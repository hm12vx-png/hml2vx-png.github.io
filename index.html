<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
  --success:#8cffb0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#15151a 0%,var(--bg) 42%);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* 頂部 */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 5vw;
  background:#0a0a0bf2;
  border-bottom:1px solid #333;
  backdrop-filter:blur(10px);
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:44px;height:44px;border:1px solid #fff;border-radius:50%;
  display:grid;place-items:center;font-weight:900;
}
.brand h1{margin:0;font-size:20px}
.brand-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand small{color:#aaa}

/* 通用按鈕 */
.btn{
  border:1px solid #3a3a40;background:#1b1b1f;color:#fff;
  padding:10px 14px;border-radius:11px;transition:.15s;
}
.btn:hover{background:#27272c}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:#111;font-weight:800}
.btn.primary:hover{background:#e8e8e8}
.btn.danger{color:#ff9aa4;border-color:#6d3439}
.btn.small{padding:7px 10px;font-size:13px}

/* Discord 聯絡賣家按鈕 */
.discord-admin-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:8px 13px;
  border:1px solid #7289da;
  border-radius:10px;
  color:#fff!important;
  background:#5865f2;
  text-decoration:none!important;
  font-weight:900;
  font-size:13px;
  line-height:1;
  white-space:nowrap;
  box-shadow:0 3px 12px rgba(88,101,242,.32);
  transition:.18s ease;
}
.discord-admin-link:hover{
  background:#6875f5;
  border-color:#8ea0ff;
  transform:translateY(-1px);
  box-shadow:0 5px 18px rgba(88,101,242,.48);
}
.discord-admin-link:active{transform:translateY(0) scale(.98)}
.discord-icon{
  width:23px;
  height:23px;
  min-width:23px;
  display:block;
  fill:currentColor;
}
.discord-link-text{display:inline-block}
.top-contact-link{
  padding:7px 11px;
  font-size:13px;
}
.payment-trade-note{
  flex-basis:100%;
  margin-top:4px;
  font-size:12px;
  line-height:1.5;
  color:#f0f0f0;
  font-weight:700;
  white-space:nowrap;
}

/* 主體 */
.wrap{width:min(1500px,calc(100% - 32px));margin:auto}
.hero{padding:36px 0 30px}
.hero-banner{display:flex;justify-content:center}
.hero-banner img{
  width:min(650px,100%);height:auto;object-fit:contain;
  border-radius:22px;border:1px solid #34343b;
  box-shadow:0 20px 60px rgba(103,69,255,.18);
}

/* 搜尋 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.search{
  flex:1;min-width:220px;background:#151518;color:#fff;
  border:1px solid #333;padding:11px 13px;border-radius:11px;outline:none;
}
.search:focus{border-color:#666}

/* =========================================================
   風格 3：霓虹線框分類
========================================================= */
.tabs{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:8px 4px 20px;
  scrollbar-width:thin;
}

.tab{
  position:relative;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:#111216;
  color:#eee;
  border:1.5px solid var(--neon,#777);
  padding:9px 16px 9px 11px;
  border-radius:999px;
  font-size:15px;
  line-height:1;
  min-height:46px;
  cursor:pointer;
  box-shadow:
    0 0 5px var(--neon,#777),
    inset 0 0 10px rgba(255,255,255,.025);
  transition:.18s ease;
}
.tab::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:999px;
  pointer-events:none;
  box-shadow:0 0 14px var(--neon,#777);
  opacity:.25;
}
.tab:hover{
  transform:translateY(-2px);
  background:#191a20;
  box-shadow:
    0 0 8px var(--neon,#777),
    0 0 22px var(--neon,#777),
    inset 0 0 12px rgba(255,255,255,.04);
}
.tab.active{
  background:#17181e;
  color:#fff;
  border-color:var(--neon,#fff);
  box-shadow:
    0 0 8px var(--neon,#fff),
    0 0 26px var(--neon,#fff),
    inset 0 0 12px rgba(255,255,255,.06);
}
.tab > span:last-child{font-weight:800}
.tab-label{
  display:inline-flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:0;
  line-height:1;
}
.tab-label .zh{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}
.tab-label .en{
  margin-top:3px;
  font-size:9px;
  font-weight:600;
  line-height:1;
  opacity:.72;
  white-space:nowrap;
}
.tab-icon{
  width:31px;height:31px;min-width:31px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;
  color:var(--neon,#fff);
  filter:drop-shadow(0 0 5px var(--neon,#fff));
}
.tab-icon svg{
  width:30px;height:30px;display:block;
  stroke:currentColor;
}
.tab-icon.badge{
  width:32px;min-width:32px;height:32px;
  font-size:10px;font-weight:900;color:#fff;
  background:#ff2438;border-radius:50%;
  transform:rotate(-7deg);
  box-shadow:0 0 8px #ff2438,0 0 16px #ff2438;
  filter:none;
}
.tab-icon.sale{
  width:32px;min-width:32px;height:32px;
  background:#ffc400;color:#111;border-radius:50%;
  transform:rotate(-7deg);
  font-size:9px;font-weight:900;
  box-shadow:0 0 8px #ffc400,0 0 16px #ffc400;
  filter:none;
}
.neon-red{--neon:#ff304f}
.neon-orange{--neon:#ff9d2e}
.neon-green{--neon:#35ff62}
.neon-cyan{--neon:#20eaff}
.neon-pink{--neon:#ff3fa8}
.neon-purple{--neon:#a85cff}
.neon-blue{--neon:#328cff}
.neon-yellow{--neon:#ffe22e}

@media(max-width:700px){
  .tab{font-size:14px;min-height:48px;padding-right:13px}
  .tab-icon{width:28px;min-width:28px;height:28px}
  .tab-label .zh{font-size:14px}
  .tab-label .en{font-size:8px}
  .tab-label .zh{font-size:14px}
  .tab-label .en{font-size:9px}
}

/* 商品標題 */
.section-head{
  display:flex;justify-content:space-between;align-items:end;
  margin:10px 0 18px;
}
.section-head h3{margin:0;font-size:24px}
.section-title-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.category-note{
  font-size:13px;
  font-weight:700;
  line-height:1.2;
  color:#20eaff;
  text-shadow:0 0 7px rgba(32,234,255,.45);
}
.category-note.female{
  color:#ff3fa8;
  text-shadow:0 0 7px rgba(255,63,168,.45);
}
.sort-box{display:flex;align-items:center;gap:8px}
.sort-box label{color:#888;font-size:13px}
.sort-box select{
  background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:9px;padding:8px 10px;outline:none;
}
.count{color:#888;font-size:13px;margin-top:5px}

/* 商品 */
.grid{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:14px;
}
.card{
  background:#161619;border:1px solid #333;border-radius:16px;
  overflow:hidden;min-width:0;display:flex;flex-direction:column;
}
.media{
  position:relative;background:#222;display:flex;
  justify-content:center;align-items:center;overflow:hidden;
  width:100%;height:210px;min-height:210px;padding:14px;
}
.media::before{
  content:"";position:absolute;inset:0;background:#17171b;z-index:0;
}
.media img{
  position:relative;z-index:1;width:240px!important;height:180px!important;
  min-width:240px;min-height:180px;max-width:240px;max-height:180px;
  aspect-ratio:4/3;display:block;object-fit:contain;
}
.body{
  padding:12px;display:grid;
  grid-template-rows:18px 36px 40px 40px 22px auto;
  row-gap:0;flex:1;min-width:0;
}
.badge-text{
  font-size:11px;color:#bbb;height:18px;line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name{
  font-size:13px;font-weight:800;height:36px;
  min-width:0;overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-start;word-break:break-word;
}
.name-zh{
  height:18px;line-height:18px;font-size:13px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name-en{
  height:14px;line-height:14px;margin-top:1px;
  font-size:9px;font-weight:600;color:#999;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.1px;
}
.price{
  font-size:18px;font-weight:900;height:27px;line-height:27px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stock{color:var(--success);font-size:13px;height:22px;line-height:22px}
.stock.soldout{color:var(--danger);font-weight:900;font-size:15px}
.variant-summary{width:100%;height:40px;display:flex;align-items:center;overflow:hidden}
.variant-summary-row{
  display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;
  align-items:center;width:100%;height:36px;
}
.variant-summary-label{font-size:10px;white-space:nowrap}
.variant-summary-select{
  width:100%;height:32px;min-width:0;padding:4px 14px 4px 7px;
  border:1px solid #666;border-radius:9px;background:#111216;color:#fff;
  font-size:10px;letter-spacing:-.2px;
}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .btn{flex:1}
.order-btn{
  width:100%;
  margin-top:10px;
  border:0;
  background:#e78aad;
  color:#fff;
  font-weight:900;
  border-radius:11px;
  padding:9px 10px;
  box-shadow:0 5px 16px rgba(231,138,173,.22);
}
.order-btn:hover{background:#f09abb;transform:translateY(-1px)}
.order-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.cart-top-btn{display:flex;align-items:center;gap:7px;white-space:nowrap}
.cart-count{
  min-width:21px;height:21px;padding:0 6px;border-radius:999px;
  display:inline-flex;align-items:center;justify-content:center;
  background:#e78aad;color:#fff;font-size:11px;font-weight:900;
}
.top-actions{display:flex;align-items:center;gap:8px}
.admin-login-btn{display:inline-flex;align-items:center;gap:7px;font-weight:800}
.admin-login-btn svg{width:18px;height:18px;display:block}
.admin-permission{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:10px;background:#101014;border:1px solid #61363b;color:#ffb0b8;font-size:12px;line-height:1.4}
.admin-permission.allowed{color:#8cffb0;border-color:#315c43;background:#101812}
.admin-permission svg{width:18px;height:18px;flex:none}
.seller-contact{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 14px;border-radius:10px;background:#5865f2;color:#fff!important;border:1px solid #7280ff;text-decoration:none;font-weight:800}
.share-preview-card{background:#101014;border:1px solid #35353b;border-radius:14px;padding:16px;line-height:1.65}
.share-preview-title{font-size:18px;font-weight:900;margin-bottom:10px}
.share-preview-line{font-size:13px;color:#ddd}
.share-preview-items{margin-top:10px;padding:10px;border-radius:10px;background:#17171b}
.share-preview-note{margin-top:10px;padding:10px;border-radius:10px;background:#17171b;color:#ffe08a;white-space:pre-wrap}
.share-preview-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.share-preview-actions .btn{flex:1;min-width:145px}
.cart-empty{color:#888;text-align:center;padding:28px 10px}
.cart-list{display:grid;gap:10px;max-height:46vh;overflow:auto;padding-right:2px}
.cart-item{
  display:grid;
  grid-template-columns:62px minmax(0,1fr);
  gap:10px;
  padding:10px;
  background:#101014;
  border:1px solid #303038;
  border-radius:12px;
}
.cart-item img{
  width:62px;height:62px;object-fit:contain;background:#17171b;border-radius:9px;
}
.cart-item-main{min-width:0}
.cart-item-title{font-size:13px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-meta{font-size:11px;color:#aaa;margin-top:3px;line-height:1.45}
.cart-item-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.qty-box{display:flex;align-items:center;gap:5px}
.qty-btn{
  width:27px;height:27px;border:1px solid #444;background:#1b1b20;color:#fff;
  border-radius:7px;font-weight:900;
}
.qty-input{
  width:42px;height:27px;text-align:center;background:#0c0c0f;color:#fff;
  border:1px solid #444;border-radius:7px;font-size:12px;
}
.remove-cart{color:#ff9aa4!important;border-color:#6d3439!important}
.cart-total{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;padding:12px 13px;background:#111116;border:1px solid #35353b;
  border-radius:11px;font-size:15px;
}
.cart-total strong{font-size:19px}
.checkout-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice-group{display:grid;gap:7px}
.choice-group>span{font-size:12px;color:#aaa;font-weight:800}
.choice-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.choice-btn{
  border:1px solid #3b3b42;background:#101014;color:#ddd;border-radius:10px;
  padding:10px 8px;font-weight:800;
}
.choice-btn.active{border-color:#e78aad;background:#2a1821;color:#fff;box-shadow:0 0 0 1px #e78aad}
.checkout-note{font-size:11px;color:#888;line-height:1.5;margin-top:9px}
@media(max-width:600px){
  .top-actions{gap:5px}
  .top-actions .btn{padding:8px 9px;font-size:12px}
  .checkout-grid{grid-template-columns:1fr}
}


/* 訂單管理 */
.orders-list{display:grid;gap:10px;max-height:70vh;overflow:auto}
.order-admin-card{background:#101014;border:1px solid #35353b;border-radius:12px;padding:12px}
.order-admin-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.order-no{font-weight:900;color:#fff}
.order-status{font-size:11px;padding:4px 8px;border-radius:999px;background:#2a1821;color:#ffb1cf;border:1px solid #7a4056}
.order-admin-meta{font-size:11px;color:#999;line-height:1.6;margin-top:7px}
.order-admin-items{margin-top:8px;padding-top:8px;border-top:1px solid #29292f;display:grid;gap:5px;font-size:12px;color:#ddd}
.order-admin-total{margin-top:9px;font-weight:900;text-align:right}

/* Dialog */
dialog{
  width:min(520px,calc(100% - 28px));border:1px solid #3d3d44;
  border-radius:16px;background:#17171b;color:#fff;padding:0;
  box-shadow:0 24px 80px #0009;
}
dialog::backdrop{background:#000b}
.dialog-wrap{padding:20px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dialog-head h3{margin:0;font-size:21px}
.icon-btn{background:transparent;border:0;color:#aaa;font-size:24px;line-height:1}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;color:#cfcfd4;font-size:13px}
.form input,.form select{
  width:100%;background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:10px;padding:11px 12px;outline:none;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.preview{
  width:100%;min-height:170px;max-height:220px;border:1px dashed #444;
  border-radius:12px;padding:10px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;
  align-content:start;color:#777;overflow:auto;background:#111;
}
.preview-item{position:relative;aspect-ratio:4/3;border:1px solid #333;border-radius:8px;overflow:hidden;background:#17171b}
.preview-item img{width:100%;height:100%;object-fit:contain;display:block}
.preview-remove{
  position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;
  border-radius:50%;background:#000c;color:#fff;font-size:16px;line-height:24px;padding:0;
}
.preview-index{
  position:absolute;left:5px;bottom:5px;padding:2px 6px;border-radius:10px;
  background:#000a;color:#fff;font-size:11px;
}
.variant-list{display:grid;gap:8px}
.variant-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 80px minmax(105px,1fr) auto;
  gap:7px;
  align-items:center;
}
.variant-row input,.variant-row select{
  width:100%;min-width:0;background:#101014;color:#fff;
  border:1px solid #3b3b42;border-radius:9px;padding:9px 10px;
}
.variant-remove{height:38px}
.variant-total{
  display:flex;justify-content:space-between;padding:8px 10px;
  background:#101014;border-radius:9px;border:1px solid #2f2f35;
}
.variant-total strong{color:#fff}
.variant-summary-note{font-size:11px;color:#777;line-height:1.5;margin-top:7px}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:100;
  background:#fff;color:#111;padding:12px 15px;border-radius:11px;
  box-shadow:0 12px 40px #0008;font-weight:800;
}

/* RWD */
@media(max-width:1200px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){
  .category-note{font-size:11px}
  .topbar{padding:12px 16px}
  .brand h1{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-form{grid-template-columns:1fr}
  .variant-row{grid-template-columns:minmax(0,1fr) 72px minmax(105px,1fr) auto}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">O²</div>
    <div>
      <h1>O² M★STAR交易區</h1>
      <div class="brand-meta">
        <small>販售・收購・交流</small>
        <a class="discord-admin-link top-contact-link"
           href="https://discord.com/users/621734178228273155"
           target="_blank" rel="noopener noreferrer"
           aria-label="使用 Discord 聯絡賣家">
          <svg class="discord-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19.54 4.99A16.7 16.7 0 0 0 15.44 3.7l-.5 1.02a15.1 15.1 0 0 0-5.88 0L8.56 3.7a16.7 16.7 0 0 0-4.1 1.29C1.86 8.86 1.16 12.65 1.51 16.39a16.6 16.6 0 0 0 5.05 2.55l1.22-1.67c-.67-.24-1.3-.54-1.9-.9l.47-.36c3.66 1.7 7.63 1.7 11.25 0 .16.13.31.25.47.36-.6.36-1.23.66-1.9.9l1.22 1.67a16.6 16.6 0 0 0 5.05-2.55c.41-4.34-.7-8.1-2.9-11.4ZM8.73 14.96c-1.08 0-1.96-.99-1.96-2.2s.87-2.2 1.96-2.2 1.97.99 1.96 2.2c0 1.21-.87 2.2-1.96 2.2Zm6.54 0c-1.08 0-1.96-.99-1.96-2.2s.87-2.2 1.96-2.2 1.97.99 1.96 2.2c0 1.21-.87 2.2-1.96 2.2Z"/>
          </svg>
          <span class="discord-link-text">聯絡賣家</span>
        </a>
        <div class="payment-trade-note">可使用台幣或糖果交易，採先付款後交易</div>
      </div>
    </div>
  </div>
  <div class="top-actions">
    <button id="cartBtn" class="btn cart-top-btn" type="button">🛒 購物車 <span id="cartCount" class="cart-count">0</span></button>
    <button id="ordersBtn" class="btn hidden" type="button">📋 訂單管理</button>

function firebaseErrorMessage(error, fallback="操作失敗", phase="") {
  const code=String(error?.code||"");
  const message=String(error?.message||"");
  const lower=(code+" "+message).toLowerCase();
  const prefix=phase?`${phase}：`:"";
  if(lower.includes("storage/unauthorized") || lower.includes("storage/permission-denied")) {
    return `${prefix}Storage 權限錯誤（${code || "storage/unauthorized"}）\n只有管理員 UID ${ADMIN_UID} 可以上傳商品圖片`;
  }
  if(lower.includes("storage/bucket-not-found")) {
    return `${prefix}Storage 找不到 Bucket（${code}）\n請確認 Firebase Storage 已啟用，Bucket 必須是 ostar-shop.firebasestorage.app`;
  }
  if(lower.includes("storage/unauthenticated")) {
    return `${prefix}Storage 未登入（${code}）\n請先登入管理員帳號`;
  }
  if(lower.includes("storage/")) {
    return `${prefix}Storage 錯誤（${code}）\n${message}`;
  }
  if(lower.includes("permission-denied") || lower.includes("permission_denied") || lower.includes("missing or insufficient permissions")) {
    return `${prefix}Firestore 權限錯誤（${code || "permission-denied"}）\n目前登入 UID：${currentUser?.uid || "未登入"}\n管理員 UID：${ADMIN_UID}`;
  }
  if(lower.includes("failed-precondition")) {
    return `${prefix}Firestore 前置條件錯誤（${code}）\n${message}`;
  }
  if(lower.includes("firestore/")) {
    return `${prefix}Firestore 錯誤（${code}）\n${message}`;
  }
  return `${prefix}${fallback}（${code || "unknown"}）\n${message || "請查看瀏覽器主控台"}`;
}

/* 圖片標準化：固定 600×450，並壓縮成適合直接存入 Firestore 的 WebP */
function normalizeImageDataURL(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const canvas=document.createElement("canvas");
        canvas.width=600;
        canvas.height=450;

        const ctx=canvas.getContext("2d");
        if(!ctx) throw new Error("瀏覽器無法建立圖片畫布");

        const scale=Math.min(600/img.naturalWidth,450/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const x=Math.round((600-w)/2);
        const y=Math.round((450-h)/2);

        ctx.clearRect(0,0,600,450);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        ctx.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,x,y,w,h);

        /*
         * Firestore 單一文件約 1 MiB 上限。
         * 新商品最多 6 張圖片，因此每張圖片先控制在約 90 KB 以下，
         * 避免多張圖片一起寫入時超過文件大小限制。
         */
        const maxBytes=90*1024;
        let best="";

        for(let quality=0.82; quality>=0.42; quality-=0.05){
          const data=canvas.toDataURL("image/webp",quality);
          if(!data.startsWith("data:image/webp")) break;

          best=data;

          const base64=data.split(",")[1]||"";
          const approxBytes=Math.floor(base64.length*3/4);

          if(approxBytes<=maxBytes){
            resolve(data);
            return;
          }
        }

        if(best){
          resolve(best);
          return;
        }

        throw new Error("目前瀏覽器不支援 WebP 圖片壓縮");
      }catch(e){
        reject(e);
      }
    };
    img.onerror=()=>reject(new Error("圖片讀取失敗"));
    img.src=src;
  });
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async()=>{
      try{resolve(await normalizeImageDataURL(reader.result))}
      catch(e){reject(e)}
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

const PRODUCT_NAME_EN_MAP = {
  "訂製粉嫩毛絨小兔": "Custom Pink Plush Bunny",

  "粉紅蜜蠟情侶對戒": "Pink Beeswax Couple Rings",

async function autoTranslateProductName(chineseName){
  const text=String(chineseName||"").trim();
  if(!text) return "";

  // 已有固定商品名稱先直接使用，避免重複呼叫翻譯服務。
  for(const [zh,en] of Object.entries(PRODUCT_NAME_EN_MAP)){
    if(text===zh || text.includes(zh)) return en;
  }

  // 使用 Google Translate 公開翻譯端點；失敗時改用本站內建片語翻譯。
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const response=await fetch(url,{method:"GET"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    const translated=Array.isArray(data?.[0])
      ? data[0].map(item=>item?.[0]||"").join("").trim()
      : "";
    if(translated) return translated;
  }catch(error){
    console.warn("英文名稱自動翻譯失敗，改用內建翻譯",error);
  }

  return getEnglishProductName({name:text});
}

function getEnglishProductName(product){
  const name=String(product?.name||"").trim();
  const saved=String(product?.nameEn||"").trim();
  if(saved) return saved;
  for(const [zh,en] of Object.entries(PRODUCT_NAME_EN_MAP)){
    if(name.includes(zh)) return en;
  }
  // 常見名稱片語自動組合；未提供英文名稱的舊商品會盡量翻譯。
  const phraseMap=[
    ["訂製","Custom "],["粉嫩","Pink "],["毛絨","Plush "],["小兔","Bunny"],
    ["淨焰之火","Pure Flame"],["粉紅","Pink"],["蜜蠟","Beeswax"],
    ["帝王","Imperial"],["鑽石","Diamond"],["情侶對戒","Couple Rings"],
    ["對戒","Couple Rings"],["戒指","Ring"],["家具","Furniture"],
    ["花盆","Flower Pot"],["作物","Crops"],["限男","Men"],["限女","Women"]
  ];
  let result=name;
  for(const [zh,en] of phraseMap) result=result.split(zh).join(en);
  return result===name ? "English name not set" : result.replace(/\\s+/g," ").trim();
}

function renderProducts(){

    const nameMatch=!keyword || String(product.name||"").toLowerCase().includes(keyword);
    return categoryMatch && nameMatch;
  }).sort((a,b)=>{

    const body=document.createElement("div");

    badge.className="badge-text";

    const name=document.createElement("div");
    name.className="name";
    name.title=`${product.name||""} / ${getEnglishProductName(product)}`;

    const nameZh=document.createElement("div");
    nameZh.className="name-zh";
    nameZh.textContent=product.name||"";

    const nameEn=document.createElement("div");
    nameEn.className="name-en";
    nameEn.textContent=getEnglishProductName(product);

    name.append(nameZh,nameEn);

    const price=document.createElement("div");
    price.className="price";
    const cashPrice=getProductCashPrice(product);

    const cashLine=document.createElement("div");
    cashLine.textContent=cashPrice ? formatMoney(cashPrice) : (product.price||"");
    price.appendChild(cashLine);
    if(candyPrice){

      candyLine.className="name-en";
      candyLine.textContent=`🍬 ${formatCandy(candyPrice)}`;
      price.appendChild(candyLine);
    }

    const variants=Array.isArray(product.variants)&&product.variants.length
      ? product.variants
      : [{color:"",stock:Number(product.stock??0),imageIndex:0}];

    const totalStock=variants.reduce(
      (sum,v)=>sum+Math.max(0,Number(v.stock)||0),0

    const stock=document.createElement("div");
    stock.className="stock";
    if(totalStock<=0){
      stock.classList.add("soldout");
      stock.textContent="售罄";
    }else{

    }

    const summary=document.createElement("div");
    summary.className="variant-summary";

    const colorVariants=variants.filter(v=>String(v.color||"").trim());

    let selectedVariantIndex=0;
    if(colorVariants.length){
      const row=document.createElement("div");
      row.className="variant-summary-row";

      label.className="variant-summary-label";

        const idx=Number(select.value)||0;

    };

      const v=getSelectedVariant();

/* =========================================================

========================================================= */
function loadCart(){
  try{
    const saved=JSON.parse(localStorage.getItem("ostar_cart")||"[]");
    cartItems=Array.isArray(saved)?saved:[];
  }catch{
    cartItems=[];
  }
  updateCartCount();
}

function saveCart(){
  localStorage.setItem("ostar_cart",JSON.stringify(cartItems));
  updateCartCount();
}

function updateCartCount(){
  const count=cartItems.reduce((sum,item)=>sum+Math.max(0,Number(item.quantity)||0),0);
  const el=$("#cartCount");
  if(el) el.textContent=String(count);
}

function findCurrentProduct(productId){
  return products.find(p=>p.id===productId)||null;
}

function getCartUnitPrice(product,payment=checkoutPayment){
  if(payment==="candy") return getProductCandyPrice(product);
  return getProductCashPrice(product);
}

function getCartUnitLabel(payment=checkoutPayment){
  return payment==="candy" ? "糖果" : "現金";
}

function addToCart(product,variant,variantIndex=0){
  const stock=Math.max(0,Number(variant?.stock)||0);
  if(stock<=0){
    toast("這個款式目前售罄");
    return;
  }

  const key=`${product.id}__${String(variant?.color||"")}__${variantIndex}`;
  const existing=cartItems.find(item=>item.key===key);
  if(existing){
    if(existing.quantity>=stock){
      toast(`目前最多只能購買 ${stock} 件`);
      return;
    }
    existing.quantity+=1;
  }else{
    const productImages=Array.isArray(product.images)
      ? product.images.filter(Boolean)
      : (product.image?[product.image]:[]);
    const imageIndex=Number.isInteger(Number(variant?.imageIndex))
      ? Number(variant.imageIndex):variantIndex;
    cartItems.push({
      key,
      productId:product.id,
      name:product.name||"",
      nameEn:getEnglishProductName(product),
      color:String(variant?.color||""),
      variantIndex:Math.max(0,Number(variantIndex)||0),
      quantity:1,
      stock,
      image:productImages[imageIndex]||productImages[0]||""
    });
  }

  saveCart();
  toast("已加入購物車");
}

function getCartLines(){
  return cartItems.map(item=>{
    const product=findCurrentProduct(item.productId);
    const fallbackProduct={
      name:item.name,nameEn:item.nameEn,price:item.price||"",cashPrice:item.cashPrice||"",
      candyPrice:item.candyPrice||""
    };
    const p=product||fallbackProduct;
    const currentVariants=Array.isArray(p.variants)&&p.variants.length?p.variants:[{color:"",stock:Number(p.stock??0),imageIndex:0}];
    const storedIndex=Number(item.variantIndex);
    const variant=Number.isInteger(storedIndex) && storedIndex>=0 && storedIndex<currentVariants.length
      ? currentVariants[storedIndex]
      : (currentVariants.find(v=>String(v.color||"")===String(item.color||"")) || currentVariants[0] || {});
    const stock=Math.max(0,Number(variant.stock)||0);
    return {item,product:p,variant,variantIndex:Number.isInteger(storedIndex)?storedIndex:currentVariants.indexOf(variant),stock};
  });
}

function canUseCandyPayment(){
  return getCartLines().every(line=>getProductCandyPrice(line.product)>0);
}

function getCartTotal(){
  return getCartLines().reduce((sum,line)=>{
    const unit=getCartUnitPrice(line.product);
    return sum+unit*Math.max(0,Number(line.item.quantity)||0);
  },0);
}

function renderCart(){
  const list=$("#cartList");
  const totalBox=$("#cartTotal");
  const checkout=$("#checkoutArea");
  const submit=$("#submitOrderBtn");
  if(!list) return;

  list.innerHTML="";

  if(!cartItems.length){
    list.innerHTML='<div class="cart-empty">購物車目前是空的<br>請先選擇商品加入購物車。</div>';
    totalBox?.classList.add("hidden");
    checkout?.classList.add("hidden");
    submit?.classList.add("hidden");
    return;
  }

  const lines=getCartLines();
  const validPayment=checkoutPayment==="cash" || canUseCandyPayment();

  lines.forEach(({item,product,variant,stock})=>{
    if(stock>0 && item.quantity>stock) item.quantity=stock;

    const box=document.createElement("div");
    box.className="cart-item";

    const img=document.createElement("img");
    img.src=item.image||((Array.isArray(product.images)&&product.images[0])||product.image||"");
    img.alt=item.name||"商品";
    img.onerror=()=>{img.style.visibility="hidden";};

    const main=document.createElement("div");
    main.className="cart-item-main";

    const title=document.createElement("div");
    title.className="cart-item-title";
    title.textContent=item.name||product.name||"商品";

    const meta=document.createElement("div");
    meta.className="cart-item-meta";
    const colorText=item.color?`款式：${item.color}｜`:"";
    const unit=getCartUnitPrice(product);
    const unitText=checkoutPayment==="candy"
      ? (unit?formatCandy(unit):"未設定糖果價格")
      : (unit?formatMoney(unit):"未設定現金價格");
    meta.textContent=`${colorText}${getCartUnitLabel()}：${unitText}｜庫存：${stock}`;

    const row=document.createElement("div");
    row.className="cart-item-row";

    const qty=document.createElement("div");
    qty.className="qty-box";

    const minus=document.createElement("button");
    minus.type="button"; minus.className="qty-btn"; minus.textContent="−";
    minus.onclick=()=>{
      item.quantity=Math.max(1,(Number(item.quantity)||1)-1);
      saveCart(); renderCart();
    };

    const input=document.createElement("input");
    input.className="qty-input"; input.type="number"; input.min="1";
    input.max=String(Math.max(1,stock)); input.value=String(item.quantity);
    input.onchange=()=>{
      const n=Math.max(1,Math.min(stock||1,parseInt(input.value,10)||1));
      item.quantity=n; saveCart(); renderCart();
    };

    const plus=document.createElement("button");
    plus.type="button"; plus.className="qty-btn"; plus.textContent="+";
    plus.onclick=()=>{
      if((Number(item.quantity)||1)>=stock){
        toast(`庫存不足，目前最多 ${stock} 件`);
        return;
      }
      item.quantity+=1; saveCart(); renderCart();
    };

    qty.append(minus,input,plus);

    const remove=document.createElement("button");
    remove.type="button"; remove.className="btn small remove-cart";
    remove.textContent="移除";
    remove.onclick=()=>{
      cartItems=cartItems.filter(x=>x.key!==item.key);
      saveCart(); renderCart();
    };

    row.append(qty,remove);
    main.append(title,meta,row);
    box.append(img,main);
    list.appendChild(box);
  });

  if(checkoutPayment==="candy" && !validPayment){
    $("#paymentHint").textContent="目前購物車有商品尚未設定糖果價格，因此不能使用糖果付款；請改選現金，或請管理員補上糖果價格。";
  }else{
    $("#paymentHint").textContent=`交易角色：${checkoutCharacter}｜付款方式：${checkoutPayment==="candy"?"糖果":"現金"}。送出訂單後會自動複製訂單內容，接著可聯絡賣家。`;
  }

  totalBox?.classList.remove("hidden");
  totalBox.querySelector("strong").textContent=
    checkoutPayment==="candy"
      ? (validPayment?formatCandy(getCartTotal()):"未完成")
      : formatMoney(getCartTotal());

  checkout?.classList.remove("hidden");
  submit?.classList.remove("hidden");
  submit.disabled=!validPayment;
  submit.textContent=validPayment?"送出訂單":"請選擇可用付款方式";
  saveCart();
}

async function submitCartOrder(){
  if(orderSubmitting || !cartItems.length) return;
  if(checkoutPayment==="candy" && !canUseCandyPayment()){
    toast("有商品尚未設定糖果價格，無法使用糖果付款",5000);
    return;
  }

  const lines=getCartLines();
  const invalid=lines.find(line=>line.stock<=0 || Number(line.item.quantity)>line.stock);
  if(invalid){
    toast(`「${invalid.item.name}」庫存已不足，請重新整理購物車`,5000);
    renderCart();
    return;
  }

  const submit=$("#submitOrderBtn");
  orderSubmitting=true;
  if(submit){ submit.disabled=true; submit.textContent="建立訂單中…"; }

  try{
    const payload={
      character:checkoutCharacter,
      payment:checkoutPayment,
      items:lines.map(line=>({
        productId:line.item.productId,
        color:String(line.item.color||""),
        variantIndex:Math.max(0,Number(line.variantIndex)||0),
        quantity:Math.max(1,Number(line.item.quantity)||1)
      }))
    };

    const result=await createOrderCallable(payload);
    const data=result?.data||{};
    const orderNo=data.orderNo||"";
    currentOrderId=String(data.orderId||"");
    currentOrderNo=String(orderNo||"");
    currentOrderData={
      character:checkoutCharacter,
      payment:checkoutPayment,
      note:String($("#checkoutNote")?.value||"").trim(),
      items:data.items||[],
      total:Number(data.total)||0
    };

    if(currentOrderData.note && currentOrderId){
      try{
        await saveOrderNoteCallable({orderId:currentOrderId,note:currentOrderData.note});
      }catch(noteError){
        console.error("交易備註儲存失敗",noteError);
        toast("訂單已成立，但交易備註尚未同步，稍後可重新儲存。",5000);
      }
    }
    const totalText=checkoutPayment==="candy"
      ? formatCandy(Number(data.total)||0)
      : formatMoney(Number(data.total)||0);

    const text=[
      "【O² M★STAR交易區｜訂單成立】",
      `訂單編號：${orderNo}`,
      `交易角色：${checkoutCharacter}`,
      `付款方式：${checkoutPayment==="candy"?"糖果":"現金"}`,
      "",
      ...(data.items||[]).map((item,index)=>
        `${index+1}. ${item.name}${item.color?`｜款式：${item.color}`:""}｜數量：${item.quantity}｜單價：${checkoutPayment==="candy"?formatCandy(item.unitPrice):formatMoney(item.unitPrice)}｜小計：${checkoutPayment==="candy"?formatCandy(item.subtotal):formatMoney(item.subtotal)}`
      ),
      "",
      `訂單合計：${totalText}`,
      "狀態：待交易",
      "請與賣家確認交易時間。"
    ].join("\n");

    try{ await navigator.clipboard.writeText(text); }catch{}

    cartItems=[];
    saveCart();
    renderCart();
    $("#cartDialog").close();
    toast(`訂單 ${orderNo} 已成立，庫存已自動扣除`,5000);

    renderSharePreview();
    $("#sharePreviewDialog").showModal();

    // 自動開啟 Discord 聯絡管理員頁面；若瀏覽器阻擋新分頁，訂單仍已成立。
    window.open("https://discord.com/users/621734178228273155","_blank","noopener,noreferrer");
  }catch(error){
    console.error("訂單建立失敗",error);
    const message=error?.message||"訂單建立失敗，請重新整理後再試。";
    toast(message,7000);
    alert(message);
    renderCart();
  }finally{
    orderSubmitting=false;
    if(submit){ submit.disabled=false; submit.textContent="送出訂單"; }
  }
}

function buildShareText(){
  if(!currentOrderData) return "";
  const payment=currentOrderData.payment==="candy"?"糖果":"現金";
  const total=currentOrderData.payment==="candy"?formatCandy(currentOrderData.total):formatMoney(currentOrderData.total);
  return [
    "【O² M★STAR交易區｜交易單】",
    `訂單編號：${currentOrderNo}`,
    `交易角色：${currentOrderData.character}`,
    `付款方式：${payment}`,
    "",
    ...(currentOrderData.items||[]).map((item,index)=>`${index+1}. ${item.name||"商品"}${item.color?`｜款式：${item.color}`:""}｜數量：${item.quantity}｜單價：${currentOrderData.payment==="candy"?formatCandy(item.unitPrice):formatMoney(item.unitPrice)}`),
    "",
    `訂單合計：${total}`,
    currentOrderData.note?`交易備註：${currentOrderData.note}`:"交易備註：無",
    "狀態：待交易",
    "請與賣家確認交易時間。"
  ].join("\n");
}

    card.append(head,meta,items,total);

/* 商品圖片預覽 */
function renderImagePreview(){
  const preview=$("#imagePreview");
  preview.innerHTML="";
  if(!selectedImageItems.length){
    preview.textContent="尚未選擇圖片";
    return;
  }

  selectedImageItems.forEach((item,index)=>{
    const box=document.createElement("div");
    box.className="preview-item";

    const img=document.createElement("img");
    img.src=item.src;
    img.alt=`商品圖片 ${index+1}`;
    box.appendChild(img);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="preview-remove";
    remove.textContent="×";
    remove.onclick=()=>{
      const removed=selectedImageItems.splice(index,1)[0];
      if(removed?.src?.startsWith("blob:")) URL.revokeObjectURL(removed.src);
      renderImagePreview();
      refreshVariantImageOptions();
    };
    box.appendChild(remove);

    const label=document.createElement("span");
    label.className="preview-index";
    label.textContent=`${index+1}${index===0?" 主圖":""}`;
    box.appendChild(label);

    preview.appendChild(box);
  });
}

function refreshVariantImageOptions(){
  $$("#variantList .variant-row").forEach(row=>{
    const select=row.querySelector(".variant-image");
    if(!select) return;
    const old=select.value;
    select.innerHTML="";

    if(!selectedImageItems.length){
      const option=document.createElement("option");
      option.value=""; option.textContent="先上傳圖片";
      option.disabled=true; option.selected=true;
      select.appendChild(option);
      return;
    }

    selectedImageItems.forEach((_,index)=>{
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=`圖片 ${index+1}${index===0?"（主圖）":""}`;
      select.appendChild(option);
    });

    if([...select.options].some(o=>o.value===old)) select.value=old;
    else select.value=String(Math.min(
      Number(row.dataset.defaultImageIndex||0),
      selectedImageItems.length-1
    ));
  });
}

function createVariantRow(variant={}){
  const row=document.createElement("div");
  row.className="variant-row";
  row.dataset.defaultImageIndex=Number(variant.imageIndex||0);

  const color=document.createElement("input");
  color.className="variant-color";
  color.maxLength=30;
  color.placeholder="顏色，例如：黑色";
  color.value=variant.color||"";

  const stock=document.createElement("input");
  stock.className="variant-stock";
  stock.type="number";
  stock.min="0";
  stock.placeholder="庫存";
  stock.value=Number(variant.stock||0);

  const image=document.createElement("select");
  image.className="variant-image";
  image.setAttribute("aria-label","指定商品圖片");

  const remove=document.createElement("button");
  remove.type="button";
  remove.className="btn small danger variant-remove";
  remove.textContent="×";
  remove.onclick=()=>{
    row.remove();
    ensureOneVariantRow();
    updateVariantTotal();
  };

  row.append(color,stock,image,remove);

  stock.addEventListener("input",updateVariantTotal);
  return row;
}

function updateVariantTotal(){
  const total=$$(".variant-stock").reduce(
    (sum,input)=>sum+Math.max(0,parseInt(input.value,10)||0),0
  );
  $("#variantTotal").textContent=String(total);
}

function ensureOneVariantRow(){
  if(!$("#variantList").children.length){
    $("#variantList").appendChild(createVariantRow());
  }
  updateVariantTotal();
  refreshVariantImageOptions();
}

function getVariantsFromForm(){
  return $$("#variantList .variant-row").map(row=>({
    color:row.querySelector(".variant-color").value.trim(),
    stock:Math.max(0,parseInt(row.querySelector(".variant-stock").value,10)||0),
    imageIndex:Math.max(0,Number(row.querySelector(".variant-image").value)||0)
  }));
}

function setVariantsInForm(variants){
  const list=$("#variantList");
  list.innerHTML="";
  const source=Array.isArray(variants)&&variants.length
    ? variants:[{color:"",stock:0,imageIndex:0}];

  source.forEach(v=>list.appendChild(createVariantRow(v)));
  updateVariantTotal();
  refreshVariantImageOptions();
}

function formatPriceInput(value){
  const digits=String(value??"").replace(/\D/g,"");
  return digits?`NT$${digits}`:"";
}

function bindCandyPriceInput(){
  const input=$("#productCandyPrice");
  if(!input) return;
  input.addEventListener("input",event=>{
    const digits=event.target.value.replace(/\D/g,"");
    const formatted=digits?`${digits}糖`:"";
    if(event.target.value!==formatted){
      event.target.value=formatted;
      try{event.target.setSelectionRange(event.target.value.length,event.target.value.length)}catch{}
    }
  });
}

$("#productPrice").addEventListener("input",event=>{
  const input=event.target;
  const digits=input.value.replace(/\D/g,"");
  const formatted=digits?`NT$${digits}`:"";
  if(input.value!==formatted){
    input.value=formatted;
    try{input.setSelectionRange(input.value.length,input.value.length)}catch{}
  }
});

let productNameTranslateTimer=null;
let productNameTranslateToken=0;

async function updateProductEnglishName(){
  const zhInput=$("#productName");
  const enInput=$("#productNameEn");
  if(!zhInput || !enInput) return;
  const chinese=zhInput.value.trim();
  if(!chinese) return;

  const token=++productNameTranslateToken;
  enInput.placeholder="自動翻譯中…";
  const translated=await autoTranslateProductName(chinese);
  if(token!==productNameTranslateToken) return;

  // 使用者手動輸入英文後，不覆蓋使用者內容。
  if(!enInput.value.trim() || enInput.dataset.autoValue===enInput.value.trim()){
    enInput.value=translated;
    enInput.dataset.autoValue=translated;
  }

}

$("#productName").addEventListener("input",()=>{
  const enInput=$("#productNameEn");
  if(enInput) enInput.dataset.autoValue=enInput.value.trim();
  clearTimeout(productNameTranslateTimer);

});

function openProductDialog(product=null){
  $("#productForm").reset();
  $("#productId").value=product?.id||"";
  $("#productDialogTitle").textContent=product?"編輯商品":"新增商品";
  $("#productCategory").value=product?.category||currentCategory;
  $("#productName").value=product?.name||"";
  $("#productNameEn").value=product?.nameEn||"";
  $("#productNameEn").dataset.autoValue=$("#productNameEn").value.trim();
  if(!$("#productNameEn").value.trim() && $("#productName").value.trim()){
    setTimeout(updateProductEnglishName,50);
  }
  $("#productPrice").value=formatPriceInput(product?.cashPrice ?? product?.price ?? "");
  $("#productCandyPrice").value=formatCandyPriceInput(product?.candyPrice ?? "");

  setVariantsInForm(
    product?.variants?.length
      ? product.variants
      : [{color:"",stock:Number(product?.stock??0),imageIndex:0}]
  );

    ? product.images.filter(Boolean)
    : (product?.image?[product.image]:[])

/* 上傳圖片 */
$("#productImage").addEventListener("change",async event=>{
  const files=[...event.target.files||[]];
  if(!files.length) return;

  const remaining=6-selectedImageItems.length;
  if(remaining<=0){
    toast("最多只能使用 6 張商品圖片");
    event.target.value="";
    return;
  }

  const filesToAdd=files.slice(0,remaining);

  const items=filesToAdd.map(file=>({
    file,
    src:URL.createObjectURL(file),
    processing:true,
    existing:false
  }));

  selectedImageItems.push(...items);
  renderImagePreview();

  await Promise.all(items.map(async item=>{
    try{
      item.processed=await compressImage(item.file);
    }catch(e){
      console.warn("圖片標準化失敗",e);
    }finally{
      item.processing=false;
    }
  }));

  renderImagePreview();
  refreshVariantImageOptions();
  event.target.value="";
});

/* Firebase Storage：圖片只負責放檔案，商品讀取仍完全沿用原版 Firestore onSnapshot */
function isFirebaseStorageUrl(url){
  const s=String(url||"");
  return s.includes("firebasestorage.googleapis.com") ||
         s.includes("storage.googleapis.com/ostar-shop") ||
         s.includes("ostar-shop.firebasestorage.app");
}

async function uploadProcessedImage(processed, productId, index){
  const response=await fetch(processed);
  const blob=await response.blob();
  const path=`products/${productId}/image_${Date.now()}_${index}.webp`;
  const fileRef=storageRef(storage,path);
  try{
    await uploadBytes(fileRef,blob,{
      contentType:"image/webp",
      cacheControl:"public,max-age=31536000,immutable"
    });
    return await getDownloadURL(fileRef);
  }catch(error){
    error.__firebasePhase="Storage 圖片上傳";
    throw error;
  }
}

async function migrateLegacyProduct(product){
  const oldImages=Array.isArray(product.images)
    ? product.images.filter(Boolean)
    : (product.image?[product.image]:[]);
  if(!oldImages.length) return false;

  let changed=false;
  const newImages=[];
  for(let i=0;i<oldImages.length;i++){
    const src=String(oldImages[i]||"");
    if(!src) continue;
    if(isFirebaseStorageUrl(src)){
      newImages.push(src);
      continue;
    }
    // 原版舊圖片通常是 data:image/...；這種不需要跨網域，直接轉 Blob 後上傳。
    const response=await fetch(src);
    const blob=await response.blob();
    const path=`products/${product.id}/migrated_${Date.now()}_${i}.webp`;
    const fileRef=storageRef(storage,path);
    await uploadBytes(fileRef,blob,{
      contentType:blob.type||"image/webp",
      cacheControl:"public,max-age=31536000,immutable"
    });
    newImages.push(await getDownloadURL(fileRef));
    changed=true;
  }
  if(changed){
    await updateDoc(doc(db,"products",product.id),{
      images:newImages,
      image:newImages[0]||"",
      updatedAt:serverTimestamp()
    });
  }
  return changed;
}

async function migrateAllLegacyImages(){
  if(!isAdmin()) return toast("只有管理員可以搬移舊圖片");
  const btn=$("#migrateImagesBtn");
  btn.disabled=true;
  const oldText=btn.textContent;
  try{
    // 這裡只讀一次 products，不改原本商品即時監聽。
    const snapshot=await new Promise((resolve,reject)=>{
      const unsub=onSnapshot(collection(db,"products"),snap=>{unsub();resolve(snap)},err=>{unsub();reject(err)});
    });
    const all=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    let changed=0, failed=0;
    for(let i=0;i<all.length;i++){
      btn.textContent=`搬移圖片 ${i+1}/${all.length}…`;
      try{ if(await migrateLegacyProduct(all[i])) changed++; }
      catch(e){ failed++; console.error("圖片搬移失敗",all[i].name,e); }
    }
    toast(`完成：${changed} 個商品已轉為 Storage${failed?`，${failed} 個失敗`:""}`);
  }catch(e){
    console.error(e);
    toast("舊圖片搬移失敗");
  }finally{
    btn.disabled=false;
    btn.textContent=oldText;
  }
}

$("#migrateImagesBtn").onclick=migrateAllLegacyImages;

/* 儲存商品：v7
 * 1. 新增商品不再上傳 Firebase Storage。
 * 2. 圖片壓縮後直接寫入 Firestore。
 * 3. 保留多圖片、顏色、庫存與舊商品編輯功能。
 * 4. 新增現金／糖果雙價格與購物車結帳。
 */
$("#productForm").addEventListener("submit",async event=>{
  event.preventDefault();

  if(!isAdmin()){
    const uid=currentUser?.uid || "未登入";
    const text=`目前沒有管理員權限。\n目前登入 UID：${uid}\n管理員 UID：${ADMIN_UID}`;
    toast(text,9000);
    alert(text);
    return;
  }

  const saveButton=$("#productForm button[type=submit]");
  const oldText=saveButton?.textContent || "儲存商品";
  if(saveButton?.disabled) return;

  const chineseName=$("#productName").value.trim();
  const priceInput=$("#productPrice").value.trim();

  if(!chineseName){
    toast("請先輸入商品名稱",5000);
    alert("請先輸入商品名稱");
    return;
  }
  if(!priceInput){
    toast("請先輸入價格",5000);
    alert("請先輸入價格");
    return;
  }

  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent="儲存中…";
  }

  try{
    const variants=getVariantsFromForm();
    const stock=variants.reduce((sum,v)=>sum+v.stock,0);

    /* 不等待 Google Translate；若英文欄空白，直接使用本站內建翻譯。 */
    let englishName=$("#productNameEn").value.trim();
    if(!englishName){
      englishName=getEnglishProductName({name:chineseName});
      $("#productNameEn").value=englishName;
    }

    const id=$("#productId").value.trim();
    const productRef=id
      ? doc(db,"products",id)
      : doc(collection(db,"products"));

    const basePayload={
      category:$("#productCategory").value,
      name:chineseName,
      nameEn:englishName,
      price:formatPriceInput(priceInput),
      cashPrice:formatPriceInput(priceInput),
      candyPrice:formatCandyPriceInput($("#productCandyPrice").value),
      stock,
      variants,
      updatedAt:serverTimestamp()
    };

    /*
     * v6：新增圖片不再上傳 Firebase Storage。
     * 已處理完成的圖片直接以壓縮後 data URL 寫入 Firestore。
     * 舊商品如果原本是 Storage URL，則完整保留，不重新上傳。
     */
    const images=[];
    for(let i=0;i<selectedImageItems.length;i++){
      const item=selectedImageItems[i];

      if(item.existing && item.src && !item.src.startsWith("blob:")){
        images.push(item.src);
      }else if(item.processed){
        images.push(item.processed);
      }else if(item.file){
        images.push(await compressImage(item.file));
      }
    }

    /* 儲存前檢查商品文件大小，避免 Firestore 文件超過約 1 MiB 限制。 */
    const previewPayload={
      ...basePayload,
      images,
      image:images[0]||"",
      ...(id ? {} : {createdAt:serverTimestamp()})
    };
    const estimatedBytes=new TextEncoder().encode(JSON.stringify(
      previewPayload,
      (key,value)=>value && typeof value==="object" && value.constructor?.name==="FieldValue"
        ? null
        : value
    )).length;

    if(estimatedBytes>900*1024){
      throw Object.assign(
        new Error("圖片總容量過大，請減少圖片張數或重新選擇較小圖片。"),
        {__firebasePhase:"Firestore 圖片容量檢查",code:"image-size-too-large"}
      );
    }

    if(id){
      await updateDoc(productRef,{
        ...basePayload,
        images,
        image:images[0]||"",
        updatedAt:serverTimestamp()
      });
    }else{
      await setDoc(productRef,{
        ...basePayload,
        images,
        image:images[0]||"",
        createdAt:serverTimestamp()
      });
    }

    toast(id ? "商品已更新" : "商品已新增",3500);
    $("#productDialog").close();
  }catch(error){
    console.error("商品儲存失敗：",error);
    const phase=error?.__firebasePhase || "商品儲存";
    showFirebaseError(error,phase);

  }finally{
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent=oldText;
    }
  }
});
