<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --panel2:#1b1b1f;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --green:#63e6a2;
  --danger:#ff7582;
  --blue:#7db7ff;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   頂部
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 4vw;

  background:#0a0a0bf2;
  border-bottom:1px solid #333;

  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;

  border:1px solid #fff;
  border-radius:50%;

  display:grid;
  place-items:center;

  font-weight:900;
  font-size:14px;
}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand small{
  color:#aaa;
}

.btn{
  border:1px solid #3a3a40;
  background:#1b1b1f;
  color:#fff;

  padding:10px 14px;

  border-radius:11px;
}

.btn:hover{
  background:#242429;
}

.btn.primary{
  background:#fff;
  color:#111;
  font-weight:800;
}

.btn.primary:hover{
  background:#ddd;
}

.btn.danger{
  color:#ff9aa4;
  border-color:#6d3439;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

/* =========================
   主內容
========================= */

.wrap{
  width:min(1600px,calc(100% - 28px));
  margin:auto;
}

/* =========================
   Banner
========================= */

.hero{
  padding:30px 0 24px;
}

.hero-banner{
  display:flex;
  justify-content:center;
}

.hero-banner img{
  width:min(650px,100%);
  height:auto;

  object-fit:contain;

  border-radius:22px;
  border:1px solid #34343b;

  box-shadow:0 20px 60px rgba(103,69,255,.18);
}

/* =========================
   搜尋
========================= */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin:15px 0;
}

.search{
  flex:1;
  min-width:220px;

  background:#151518;
  color:#fff;

  border:1px solid #333;

  padding:11px 13px;

  border-radius:11px;

  outline:none;
}

.search:focus{
  border-color:#666;
}

/* =========================
   分類
========================= */

.tabs{
  display:flex;
  gap:8px;

  overflow:auto;

  padding-bottom:18px;
}

.tab{
  white-space:nowrap;

  background:#19191d;
  color:#ddd;

  border:1px solid #38383e;

  padding:9px 13px;

  border-radius:999px;
}

.tab:hover{
  background:#242429;
}

.tab.active{
  background:#fff;
  color:#111;

  font-weight:800;
}

/* =========================
   標題
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:10px 0 18px;
}

.section-head h3{
  font-size:24px;
}

.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

/* =========================
   商品區
   8 個一排
========================= */

.grid{
  display:grid;

  grid-template-columns:repeat(8,minmax(0,1fr));

  gap:12px;
}

/* =========================
   商品卡片
========================= */

.card{
  background:#161619;

  border:1px solid #333;

  border-radius:16px;

  overflow:hidden;

  min-width:0;

  display:flex;
  flex-direction:column;
}

/* =========================
   商品圖片
========================= */

.media{
  background:#222;

  height:150px;

  display:flex;

  justify-content:center;
  align-items:center;

  color:#888;

  overflow:hidden;

  padding:10px;

  position:relative;
}

.media img{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#111;

  border-radius:6px;
}

/* =========================
   商品內容
========================= */

.body{
  padding:11px;

  min-width:0;

  display:flex;
  flex-direction:column;
}

.badge{
  font-size:11px;

  color:#aaa;

  height:18px;

  line-height:18px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/*
  商品名稱：
  固定一排
  超過自動 ...
*/

.name{
  font-size:15px;

  font-weight:800;

  margin-top:6px;

  height:22px;
  line-height:22px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* =========================
   價格
========================= */

.price{
  font-size:17px;

  font-weight:900;

  margin-top:7px;

  min-height:22px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

/* =========================
   庫存
========================= */

.stock{
  margin-top:7px;

  font-size:13px;

  color:var(--green);

  min-height:19px;

  font-weight:700;
}

.stock.soldout{
  color:var(--danger);
}

/* =========================
   管理員按鈕
========================= */

.card-actions{
  display:flex;

  gap:6px;

  margin-top:10px;
}

.card-actions .btn{
  flex:1;

  min-width:0;
}

/* =========================
   空白
========================= */

.empty{
  grid-column:1/-1;

  color:#777;

  padding:40px 0;

  text-align:center;
}

/* =========================
   留言板
========================= */

.board{
  margin:55px 0;

  border-top:1px solid #333;

  padding-top:28px;
}

.board h3{
  font-size:26px;
}

.board>p{
  color:#aaa;

  margin-top:6px;
}

/* =========================
   留言表單
========================= */

.board-form{
  display:grid;

  grid-template-columns:180px 180px 1fr auto;

  gap:10px;

  margin:18px 0;
}

.board input,
.board textarea{
  background:#151518;

  color:#fff;

  border:1px solid #333;

  border-radius:11px;

  padding:11px;

  outline:none;
}

.board input:focus,
.board textarea:focus{
  border-color:#666;
}

.board textarea{
  min-height:44px;

  resize:vertical;
}

/* =========================
   留言
========================= */

.messages{
  display:grid;

  gap:12px;
}

.message{
  background:#151518;

  border:1px solid #333;

  border-radius:13px;

  padding:14px;
}

.message-top{
  display:flex;

  justify-content:space-between;

  gap:12px;
}

.message-name{
  font-weight:800;
}

.discord-id{
  margin-top:4px;

  color:#7db7ff;

  font-size:12px;

  font-family:monospace;
}

.message-time{
  color:#777;

  font-size:11px;

  margin-top:4px;
}

.message-text{
  margin-top:8px;

  white-space:pre-wrap;

  word-break:break-word;
}

/* =========================
   管理員回覆
========================= */

.reply{
  margin-top:12px;

  margin-left:20px;

  padding:12px;

  border-left:3px solid #7db7ff;

  background:#1a1a1f;

  border-radius:0 10px 10px 0;
}

.reply-title{
  color:#7db7ff;

  font-size:13px;

  font-weight:800;
}

.reply-text{
  margin-top:6px;

  white-space:pre-wrap;

  word-break:break-word;
}

.reply-time{
  margin-top:5px;

  color:#777;

  font-size:11px;
}

/* =========================
   回覆表單
========================= */

.reply-form{
  display:flex;

  gap:8px;

  margin-top:12px;
}

.reply-form textarea{
  flex:1;

  min-height:40px;

  resize:vertical;

  background:#101014;

  color:#fff;

  border:1px solid #333;

  border-radius:9px;

  padding:9px;

  outline:none;
}

.note{
  color:#777;

  font-size:12px;

  margin-top:10px;
}

/* =========================
   Dialog
========================= */

dialog{
  width:min(520px,calc(100% - 28px));

  border:1px solid #3d3d44;

  border-radius:16px;

  background:#17171b;

  color:#fff;

  padding:0;

  box-shadow:0 24px 80px #0009;
}

dialog::backdrop{
  background:#000b;
}

.dialog-wrap{
  padding:20px;
}

.dialog-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:16px;
}

.dialog-head h3{
  font-size:21px;
}

.icon-btn{
  background:transparent;

  border:0;

  color:#aaa;

  font-size:24px;
}

.form{
  display:grid;

  gap:12px;
}

.form label{
  display:grid;

  gap:6px;

  color:#cfcfd4;

  font-size:13px;
}

.form input,
.form select{
  width:100%;

  background:#101014;

  color:#fff;

  border:1px solid #3b3b42;

  border-radius:10px;

  padding:11px 12px;

  outline:none;
}

.form input:focus,
.form select:focus{
  border-color:#666;
}

.dialog-actions{
  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:16px;
}

/* =========================
   圖片預覽
========================= */

.preview{
  width:100%;

  aspect-ratio:4/3;

  border:1px dashed #444;

  border-radius:12px;

  display:grid;

  place-items:center;

  color:#777;

  overflow:hidden;

  background:#111;
}

.preview img{
  width:100%;

  height:100%;

  object-fit:contain;
}

/* =========================
   Toast
========================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:100;

  background:#fff;

  color:#111;

  padding:11px 14px;

  border-radius:10px;

  box-shadow:0 12px 40px #0008;

  font-weight:700;
}

/* =========================
   平板
========================= */

@media(max-width:1300px){

  .grid{
    grid-template-columns:repeat(6,minmax(0,1fr));
  }

}

/* =========================
   小型平板
========================= */

@media(max-width:1000px){

  .grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .board-form{
    grid-template-columns:1fr 1fr;
  }

}

/* =========================
   手機橫向
========================= */

@media(max-width:700px){

  .grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .board-form{
    grid-template-columns:1fr;
  }

}

/* =========================
   手機
========================= */

@media(max-width:500px){

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .media{
    height:140px;
  }

  .name{
    font-size:14px;
  }

  .price{
    font-size:16px;
  }

  .brand small{
    display:none;
  }

  .topbar{
    padding:12px 14px;
  }

  .wrap{
    width:calc(100% - 18px);
  }

}

/* =========================
   超小手機
========================= */

@media(max-width:360px){

  .grid{
    grid-template-columns:1fr;
  }

}
</style>
</head>

<body>

<!-- =========================
     頂部
========================= -->

<header class="topbar">

  <div class="brand">

    <div class="logo">
      O²
    </div>

    <div>
      <h1>O² M★STAR交易區</h1>

<main class="wrap">

    <button

    </button>

    <button
      class="tab"

    >
      花盆
    </button>

    <button
      class="tab"
      data-category="戒指限男"
    >
      戒指限男
    </button>

    <button
      class="tab"
      data-category="戒指限女"
    >
      戒指限女
    </button>

    <button

    >

    </button>

    <button

    </button>

  ========================= -->

        maxlength="300"

        required
      ></textarea>

      <button
        class="btn primary"
        type="submit"
      >
        送出留言
      </button>

    </form>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="note">
      Discord User ID 僅提供管理員查看，公開留言只會顯示 Discord 暱稱。

  </section>

</main>


<!-- =========================
     管理員登入
========================= -->

<dialog id="loginDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3>
        管理員登入
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="loginDialog"

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >

      </label>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="loginDialog"
        >
          取消
        </button>

        <button
          class="btn primary"
          type="submit"
        >
          登入
        </button>

      </div>

    </form>

  </div>

</dialog>


<!-- =========================
     商品管理
========================= -->

<dialog id="productDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3 id="productDialogTitle">
        新增商品
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="productDialog"
      >
        ×
      </button>

    </div>


    <form
      id="productForm"
      class="form"
    >

      <input
        id="productId"
        type="hidden"
      >


      <label>

        <select
          id="productCategory"

        >

          <option value="新家具">
            新家具
          </option>

          <option value="家具">
            家具
          </option>

          <option value="花盆">
            花盆
          </option>

          <option value="戒指限男">
            戒指限男
          </option>

          <option value="戒指限女">
            戒指限女
          </option>

          <option value="作物限男">
            作物限男
          </option>

          <option value="作物限女">
            作物限女
          </option>

          <option value="出清區">
            出清區
          </option>

        </select>

      </label>


      <label>
        商品名稱

        <input
          id="productName"
          maxlength="80"
          required
          placeholder="輸入商品名稱"
        >

      </label>


      <label>
        價格

        <input
          id="productPrice"
          maxlength="40"
          required
          placeholder="例如：100T、80糖"
        >

      </label>


      <label>
        庫存數量

        <input
          id="productStock"
          type="number"
          min="0"
          step="1"
          required
          placeholder="例如：10"
        >

      </label>


      <label>
        商品圖片

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >

      </label>


      <div
        id="imagePreview"
        class="preview"
      >
        尚未選擇圖片
      </div>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="productDialog"
        >
          取消
        </button>

        <button
          class="btn primary"
          type="submit"
        >
          儲存商品
        </button>

      </div>

    </form>

  </div>

</dialog>

     Toast
========================= -->

} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

const firebaseConfig = {

    "ostar-shop.firebaseapp.com",

  projectId:

  messagingSenderId:

  appId:

};


/* =========================
   管理員 UID
========================= */

const ADMIN_UID =
  "IhFebcTe8tTN0jtpyjKgGvN6NmY2";


/* =========================
   初始化
========================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   簡化選取器
========================= */

const $ =
  s => document.querySelector(s);

const $$ =
  s => [...document.querySelectorAll(s)];


/* =========================
   狀態
========================= */

let products = [];

let messages = [];

let currentCategory = "新家具";

let currentUser = null;

let editingImage = "";


/* =========================
   Toast
========================= */

function toast(text){

  const el =
    $("#toast");

  el.textContent =
    text;

  el.classList.remove("hidden");

  clearTimeout(window.__tt);

  window.__tt =
    setTimeout(
      () =>
        el.classList.add("hidden"),
      2200
    );

}


/* =========================
   判斷管理員
========================= */

function isAdmin(){

  return !!currentUser &&
    currentUser.uid === ADMIN_UID;

}


/* =========================
   時間
========================= */

function formatTime(ts){

  if(!ts?.toDate){

    return "";

  }

  return ts
    .toDate()
    .toLocaleString(
      "zh-TW",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================
   商品庫存
========================= */

function getStock(product){

  const stock =
    Number(product.stock);

  if(!Number.isFinite(stock)){

    return 0;

  }

  return Math.max(
    0,
    Math.floor(stock)
  );

}


/* =========================
   商品顯示
========================= */

function renderProducts(){

  const q =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(

      p =>

        p.category === currentCategory &&

        (
          !q ||
          (p.name || "")
            .toLowerCase()
            .includes(q)
        )

    );


  $("#sectionTitle")
    .textContent =
    currentCategory;


  $("#productCount")
    .textContent =
    `${list.length} 件商品`;


  const grid =
    $("#productGrid");


  grid.innerHTML = "";


  if(!list.length){

    grid.innerHTML =
      '<div class="empty">這個分類目前沒有商品</div>';

    return;

  }


  list.forEach(p => {

    const card =
      document.createElement("article");

    card.className =
      "card";


    /* 商品圖片 */

    const media =
      document.createElement("div");

    media.className =
      "media";


    if(p.image){

      const img =
        document.createElement("img");

      img.src =
        p.image;

      img.alt =
        p.name || "商品圖片";

      img.loading =
        "lazy";

      media.appendChild(img);

    }else{

      media.textContent =
        "無商品圖片";

    }


    /* 商品內容 */

    const body =
      document.createElement("div");

    body.className =
      "body";


    /* 分類 */

    const badge =
      document.createElement("div");

    badge.className =
      "badge";

    badge.textContent =
      p.category || "";


    /* 商品名稱 */

    const name =
      document.createElement("div");

    name.className =
      "name";

    name.textContent =
      p.name || "";

    name.title =
      p.name || "";


    /* 價格 */

    const price =
      document.createElement("div");

    price.className =
      "price";

    price.textContent =
      p.price || "";


    /* 庫存 */

    const stock =
      document.createElement("div");

    stock.className =
      "stock";


    const stockNumber =
      getStock(p);


    if(stockNumber <= 0){

      stock.classList.add(
        "soldout"
      );

      stock.textContent =
        "售罄";

    }else{

      stock.textContent =
        `庫存：${stockNumber}`;

    }


    body.append(
      badge,
      name,
      price,
      stock
    );


    /* 管理員操作 */

    if(isAdmin()){

      const actions =
        document.createElement("div");

      actions.className =
        "card-actions";


      const edit =
        document.createElement("button");

      edit.className =
        "btn small";

      edit.textContent =
        "編輯";

      edit.onclick =
        () => openProductDialog(p);


      const del =
        document.createElement("button");

      del.className =
        "btn small danger";

      del.textContent =
        "刪除";


      del.onclick =
        async () => {

          if(
            !confirm(
              `確定刪除「${p.name}」嗎？`
            )
          ){

            return;

          }


          try{

            await deleteDoc(
              doc(
                db,
                "products",
                p.id
              )
            );

            toast(
              "商品已刪除"
            );

          }catch(err){

            console.error(err);

            toast(
              "刪除失敗"
            );

          }

        };


      actions.append(
        edit,
        del
      );

      body.appendChild(
        actions
      );

    }


    card.append(
      media,
      body
    );


    grid.appendChild(
      card
    );

  });

}


/* =========================
   留言板
========================= */

function renderMessages(){

  const box =
    $("#messages");

  box.innerHTML = "";


  if(!messages.length){

    box.innerHTML =
      '<div class="message">目前還沒有留言</div>';

    return;

  }


  messages.forEach(m => {

    const item =
      document.createElement("div");

    item.className =
      "message";


    /* 上方 */

    const top =
      document.createElement("div");

    top.className =
      "message-top";


    const left =
      document.createElement("div");


    /* Discord 暱稱 */

    const n =
      document.createElement("div");

    n.className =
      "message-name";

    n.textContent =
      m.name || "匿名";


    /* 時間 */

    const t =
      document.createElement("div");

    t.className =
      "message-time";

    t.textContent =
      formatTime(
        m.createdAt
      );


    left.append(
      n,
      t
    );


    /*
      管理員看到 Discord User ID
    */

    if(isAdmin()){

      const discordId =
        document.createElement("div");

      discordId.className =
        "discord-id";

      discordId.textContent =
        `Discord User ID：${m.discordId || "未提供"}`;

      left.appendChild(
        discordId
      );

    }


    top.appendChild(
      left
    );


    /* 管理員刪除 */

    if(isAdmin()){

      const del =
        document.createElement("button");

      del.className =
        "btn small danger";

      del.textContent =
        "刪除";


      del.onclick =
        async () => {

          if(
            !confirm(
              "確定刪除這則留言嗎？"
            )
          ){

            return;

          }


          try{

            await deleteDoc(
              doc(
                db,
                "messages",
                m.id
              )
            );

            toast(
              "留言已刪除"
            );

          }catch(err){

            console.error(err);

            toast(
              "刪除失敗"
            );

          }

        };


      top.appendChild(
        del
      );

    }


    /* 留言內容 */

    const tx =
      document.createElement("div");

    tx.className =
      "message-text";

    tx.textContent =
      m.text || "";


    item.append(
      top,
      tx
    );


    /* =========================
       管理員回覆
    ========================= */

    if(m.reply){

      const reply =
        document.createElement("div");

      reply.className =
        "reply";


      const replyTitle =
        document.createElement("div");

      replyTitle.className =
        "reply-title";

      replyTitle.textContent =
        "管理員回覆";


      const replyText =
        document.createElement("div");

      replyText.className =
        "reply-text";

      replyText.textContent =
        m.reply;


      const replyTime =
        document.createElement("div");

      replyTime.className =
        "reply-time";

      replyTime.textContent =
        formatTime(
          m.replyAt
        );


      reply.append(
        replyTitle,
        replyText,
        replyTime
      );


      item.appendChild(
        reply
      );

    }


    /* =========================
       管理員回覆輸入
    ========================= */

    if(isAdmin()){

      const replyForm =
        document.createElement("form");

      replyForm.className =
        "reply-form";


      const textarea =
        document.createElement("textarea");

      textarea.placeholder =
        m.reply
          ? "修改管理員回覆…"
          : "在這則留言下回覆…";

      textarea.maxLength =
        300;

      textarea.value =
        m.reply || "";


      const send =
        document.createElement("button");

      send.type =
        "submit";

      send.className =
        "btn primary";

      send.textContent =
        m.reply
          ? "修改回覆"
          : "回覆";


      replyForm.append(
        textarea,
        send
      );


      replyForm.onsubmit =
        async e => {

          e.preventDefault();


          const replyText =
            textarea.value.trim();


          if(!replyText){

            toast(
              "請輸入回覆內容"
            );

            return;

          }


          try{

            await updateDoc(

              doc(
                db,
                "messages",
                m.id
              ),

              {
                reply:
                  replyText,

                replyAt:
                  serverTimestamp()
              }

            );


            toast(
              "管理員回覆已送出"
            );

          }catch(err){

            console.error(err);

            toast(
              "回覆失敗"
            );

          }

        };


      item.appendChild(
        replyForm
      );

    }


    box.appendChild(
      item
    );

  });

}


/* =========================
   圖片壓縮
========================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onerror =
        reject;


      reader.onload =
        () => {

          const img =
            new Image();


          img.onerror =
            reject;


          img.onload =
            () => {

              const max =
                900;


              const scale =
                Math.min(
                  1,
                  max /
                  Math.max(
                    img.width,
                    img.height
                  )
                );


              const w =
                Math.round(
                  img.width * scale
                );


              const h =
                Math.round(
                  img.height * scale
                );


              const c =
                document.createElement(
                  "canvas"
                );


              c.width =
                w;

              c.height =
                h;


              const ctx =
                c.getContext("2d");


              ctx.drawImage(
                img,
                0,
                0,
                w,
                h
              );


              let q =
                .75;


              let out =
                c.toDataURL(
                  "image/jpeg",
                  q
                );


              while(
                out.length > 650000 &&
                q > .4
              ){

                q -= .08;

                out =
                  c.toDataURL(
                    "image/jpeg",
                    q
                  );

              }


              if(
                out.length > 780000
              ){

                reject(
                  new Error(
                    "圖片太大"
                  )
                );

                return;

              }


              resolve(
                out
              );

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================
   開啟商品視窗
========================= */

function openProductDialog(p = null){

  $("#productForm")
    .reset();


  $("#productId")
    .value =
    p?.id || "";


  $("#productDialogTitle")
    .textContent =
    p
      ? "編輯商品"
      : "新增商品";


  $("#productCategory")
    .value =
    p?.category ||
    currentCategory;


  $("#productName")
    .value =
    p?.name || "";


  $("#productPrice")
    .value =
    p?.price || "";


  $("#productStock")
    .value =
    p
      ? getStock(p)
      : 0;


  editingImage =
    p?.image || "";


  const prev =
    $("#imagePreview");


  prev.innerHTML =
    "";


  if(editingImage){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      editingImage;

    prev.appendChild(
      img
    );

  }else{

    prev.textContent =
      "尚未選擇圖片";

  }


  $("#productDialog")
    .showModal();

}


/* =========================
   圖片選擇
========================= */

$("#productImage")
  .addEventListener(
    "change",
    async e => {

      const file =
        e.target.files?.[0];


      if(!file){

        return;

      }


      try{

        const data =
          await compressImage(
            file
          );


        const prev =
          $("#imagePreview");


        prev.innerHTML =
          "";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          data;


        prev.appendChild(
          img
        );


      }catch(err){

        console.error(err);

        toast(
          "圖片處理失敗"
        );

      }

    }
  );


/* =========================
   儲存商品
========================= */

$("#productForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      if(!isAdmin()){

        toast(
          "只有管理員可以管理商品"
        );

        return;

      }


      const id =
        $("#productId").value;


      const file =
        $("#productImage")
          .files?.[0];


      try{

        let image =
          editingImage;


        if(file){

          image =
            await compressImage(
              file
            );

        }


        let stock =
          Number(
            $("#productStock").value
          );


        if(
          !Number.isFinite(stock) ||
          stock < 0
        ){

          stock = 0;

        }


        stock =
          Math.floor(stock);


        const payload = {

          category:
            $("#productCategory")
              .value,

          name:
            $("#productName")
              .value
              .trim(),

          price:
            $("#productPrice")
              .value
              .trim(),

          stock:
            stock,

          image:
            image,

          updatedAt:
            serverTimestamp()

        };


        if(id){

          await updateDoc(

            doc(
              db,
              "products",
              id
            ),

            payload

          );


          toast(
            "商品已更新"
          );

        }else{

          payload.createdAt =
            serverTimestamp();


          await addDoc(

            collection(
              db,
              "products"
            ),

            payload

          );


          toast(
            "商品已新增"
          );

        }


        $("#productDialog")
          .close();


      }catch(err){

        console.error(err);

        toast(
          "儲存失敗"
        );

      }

    }
  );


/* =========================
   管理員登入
========================= */

$("#loginForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      try{

        const cred =
          await signInWithEmailAndPassword(

            auth,

            $("#loginEmail")
              .value
              .trim(),

            $("#loginPassword")
              .value

          );


        if(
          cred.user.uid !==
          ADMIN_UID
        ){

          await signOut(
            auth
          );


          toast(
            "這個帳號不是管理員"
          );


          return;

        }


        $("#loginDialog")
          .close();


        $("#loginForm")
          .reset();


        toast(
          "管理員登入成功"
        );


      }catch(err){

        console.error(err);

        toast(
          "登入失敗，請檢查帳號密碼"
        );

      }

    }
  );


/* =========================
   管理員按鈕
========================= */

$("#adminBtn")
  .onclick =
  async () => {

    if(isAdmin()){

      await signOut(
        auth
      );

      toast(
        "已登出"
      );

    }else{

      $("#loginDialog")
        .showModal();

    }

  };


/* =========================
   新增商品
========================= */

$("#addBtn")
  .onclick =
  () =>
    openProductDialog();


/* =========================
   Firebase 登入狀態
========================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;


    $("#adminBtn")
      .textContent =
      isAdmin()
        ? "登出管理員"
        : "管理員登入";


    $("#addBtn")
      .classList
      .toggle(
        "hidden",
        !isAdmin()
      );


    renderProducts();

    renderMessages();

  }
);


/* =========================
   分類切換
========================= */

$("#tabs")
  .addEventListener(
    "click",
    e => {

      const btn =
        e.target.closest(
          ".tab"
        );


      if(!btn){

        return;

      }


      $$(".tab")
        .forEach(
          b =>
            b.classList
              .remove(
                "active"
              )
        );


      btn.classList.add(
        "active"
      );


      currentCategory =
        btn.dataset.category;


      renderProducts();

    }
  );


/* =========================
   搜尋
========================= */

$("#searchInput")
  .addEventListener(
    "input",
    renderProducts
  );


/* =========================
   留言
========================= */

$("#messageForm")
  .addEventListener(
    "submit",
    async e => {

      e.preventDefault();


      const name =
        $("#messageName")
          .value
          .trim();


      const discordId =
        $("#messageDiscordId")
          .value
          .trim();


      const text =
        $("#messageText")
          .value
          .trim();


      if(
        !name ||
        !discordId ||
        !text
      ){

        return;

      }


      try{

        await addDoc(

          collection(
            db,
            "messages"
          ),

          {

            name:
              name,

            discordId:
              discordId,

            text:
              text,

            createdAt:
              serverTimestamp()

          }

        );


        $("#messageText")
          .value =
          "";


        toast(
          "留言已送出"
        );


      }catch(err){

        console.error(err);

        toast(
          "留言送出失敗"
        );

      }

    }
  );


/* =========================
   關閉 Dialog
========================= */

$$("[data-close]")
  .forEach(
    btn => {

      btn.onclick =
        () => {

          document
            .getElementById(
              btn.dataset.close
            )
            ?.close();

        };

    }
  );


/* =========================
   商品即時讀取
========================= */

onSnapshot(

  query(
    collection(
      db,
      "products"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snap => {

    products =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    renderProducts();

  },

  err => {

    console.error(err);

    $("#productGrid")
      .innerHTML =
      '<div class="empty">商品讀取失敗</div>';

  }

);


/* =========================
   留言即時讀取
========================= */

onSnapshot(

  query(
    collection(
      db,
      "messages"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snap => {

    messages =
      snap.docs.map(
        d => ({
          id:d.id,
          ...d.data()
        })
      );


    renderMessages();

  },

  err => {

    console.error(err);

    $("#messages")
      .innerHTML =
      '<div class="message">留言讀取失敗</div>';

  }

);

</script>
