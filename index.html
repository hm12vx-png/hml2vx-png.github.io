<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
  --success:#8cffb0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#15151a 0%,var(--bg) 42%);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* 頂部 */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 5vw;
  background:#0a0a0bf2;
  border-bottom:1px solid #333;
  backdrop-filter:blur(10px);
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:44px;height:44px;border:1px solid #fff;border-radius:50%;
  display:grid;place-items:center;font-weight:900;
}
.brand h1{margin:0;font-size:20px}
.brand-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand small{color:#aaa}

.top-contact-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:36px;
  padding:7px 15px;
  border-radius:10px;
  text-decoration:none;
  font-size:14px;
  font-weight:900;
  letter-spacing:.3px;
  color:#fff;
  border:1.5px solid #b45cff;
  background:linear-gradient(135deg,#5b16b8,#8f2cff);
  box-shadow:
    0 0 8px #a85cff99,
    0 0 20px #a85cff55,
    inset 0 0 10px rgba(255,255,255,.12);
  text-shadow:0 0 6px rgba(255,255,255,.65);
  transition:.18s ease;
}

.top-contact-link:hover{
  color:#fff;
  background:linear-gradient(135deg,#7224d8,#a84cff);
  border-color:#d39aff;
  box-shadow:
    0 0 12px #b45cff,
    0 0 28px #a85cff88,
    inset 0 0 12px rgba(255,255,255,.16);
  transform:translateY(-1px);
}

.payment-notice{
  margin-top:7px;
  padding:7px 10px;
  width:fit-content;
  max-width:100%;
  color:#ffe98a;
  border-left:3px solid #ffc400;
  background:rgba(255,196,0,.06);
  border-radius:0 8px 8px 0;
  font-size:12px;
  font-weight:800;
  line-height:1.5;
  letter-spacing:.1px;
}

@media(max-width:600px){
  .payment-notice{
    font-size:11px;
    width:100%;
  }
}

/* 通用按鈕 */
.btn{
  border:1px solid #3a3a40;background:#1b1b1f;color:#fff;
  padding:10px 14px;border-radius:11px;transition:.15s;
}
.btn:hover{background:#27272c}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:#111;font-weight:800}
.btn.primary:hover{background:#e8e8e8}
.btn.danger{color:#ff9aa4;border-color:#6d3439}
.btn.small{padding:7px 10px;font-size:13px}

/* 主體 */
.wrap{width:min(1500px,calc(100% - 32px));margin:auto}
.hero{padding:36px 0 30px}
.hero-banner{display:flex;justify-content:center}
.hero-banner img{
  width:min(650px,100%);height:auto;object-fit:contain;
  border-radius:22px;border:1px solid #34343b;
  box-shadow:0 20px 60px rgba(103,69,255,.18);
}

/* 搜尋 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.search{
  flex:1;min-width:220px;background:#151518;color:#fff;
  border:1px solid #333;padding:11px 13px;border-radius:11px;outline:none;
}
.search:focus{border-color:#666}

/* =========================================================
   風格 3：霓虹線框分類
========================================================= */
.tabs{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:8px 4px 20px;
  scrollbar-width:thin;
}

.tab{
  position:relative;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:#111216;
  color:#eee;
  border:1.5px solid var(--neon,#777);
  padding:9px 16px 9px 11px;
  border-radius:999px;
  font-size:15px;
  line-height:1;
  min-height:46px;
  cursor:pointer;
  box-shadow:
    0 0 5px var(--neon,#777),
    inset 0 0 10px rgba(255,255,255,.025);
  transition:.18s ease;
}
.tab::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:999px;
  pointer-events:none;
  box-shadow:0 0 14px var(--neon,#777);
  opacity:.25;
}
.tab:hover{
  transform:translateY(-2px);
  background:#191a20;
  box-shadow:
    0 0 8px var(--neon,#777),
    0 0 22px var(--neon,#777),
    inset 0 0 12px rgba(255,255,255,.04);
}
.tab.active{
  background:#17181e;
  color:#fff;
  border-color:var(--neon,#fff);
  box-shadow:
    0 0 8px var(--neon,#fff),
    0 0 26px var(--neon,#fff),
    inset 0 0 12px rgba(255,255,255,.06);
}
.tab > span:last-child{font-weight:800}
.tab-label{
  display:inline-flex;
  flex-direction:column;
  align-items:flex-start;
  justify-content:center;
  min-width:0;
  line-height:1;
}
.tab-label .zh{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
}
.tab-label .en{
  margin-top:3px;
  font-size:9px;
  font-weight:600;
  line-height:1;
  opacity:.72;
  white-space:nowrap;
}
.tab-icon{
  width:31px;height:31px;min-width:31px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;
  color:var(--neon,#fff);
  filter:drop-shadow(0 0 5px var(--neon,#fff));
}
.tab-icon svg{
  width:30px;height:30px;display:block;
  stroke:currentColor;
}
.tab-icon.badge{
  width:32px;min-width:32px;height:32px;
  font-size:10px;font-weight:900;color:#fff;
  background:#ff2438;border-radius:50%;
  transform:rotate(-7deg);
  box-shadow:0 0 8px #ff2438,0 0 16px #ff2438;
  filter:none;
}
.tab-icon.sale{
  width:32px;min-width:32px;height:32px;
  background:#ffc400;color:#111;border-radius:50%;
  transform:rotate(-7deg);
  font-size:9px;font-weight:900;
  box-shadow:0 0 8px #ffc400,0 0 16px #ffc400;
  filter:none;
}
.neon-red{--neon:#ff304f}
.neon-orange{--neon:#ff9d2e}
.neon-green{--neon:#35ff62}
.neon-cyan{--neon:#20eaff}
.neon-pink{--neon:#ff3fa8}
.neon-purple{--neon:#a85cff}
.neon-blue{--neon:#328cff}
.neon-yellow{--neon:#ffe22e}

@media(max-width:700px){
  .tab{font-size:14px;min-height:48px;padding-right:13px}
  .tab-icon{width:28px;min-width:28px;height:28px}
  .tab-label .zh{font-size:14px}
  .tab-label .en{font-size:8px}
  .tab-label .zh{font-size:14px}
  .tab-label .en{font-size:9px}
}

/* 商品標題 */
.section-head{
  display:flex;justify-content:space-between;align-items:end;
  margin:10px 0 18px;
}
.section-head h3{margin:0;font-size:24px}
.section-title-line{
  display:flex;
  align-items:baseline;
  gap:10px;
  flex-wrap:wrap;
}
.category-note{
  font-size:13px;
  font-weight:700;
  line-height:1.2;
  color:#20eaff;
  text-shadow:0 0 7px rgba(32,234,255,.45);
}
.category-note.female{
  color:#ff3fa8;
  text-shadow:0 0 7px rgba(255,63,168,.45);
}
.sort-box{display:flex;align-items:center;gap:8px}
.sort-box label{color:#888;font-size:13px}
.sort-box select{
  background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:9px;padding:8px 10px;outline:none;
}
.count{color:#888;font-size:13px;margin-top:5px}

/* 商品 */
.grid{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:14px;
}
.card{
  background:#161619;border:1px solid #333;border-radius:16px;
  overflow:hidden;min-width:0;display:flex;flex-direction:column;
}
.media{
  position:relative;background:#222;display:flex;
  justify-content:center;align-items:center;overflow:hidden;
  width:100%;height:210px;min-height:210px;padding:14px;
}
.media::before{
  content:"";position:absolute;inset:0;background:#17171b;z-index:0;
}
.media img{
  position:relative;z-index:1;width:240px!important;height:180px!important;
  min-width:240px;min-height:180px;max-width:240px;max-height:180px;
  aspect-ratio:4/3;display:block;object-fit:contain;
}
.body{
  padding:12px;display:grid;
  grid-template-rows:18px 36px 40px 27px 22px auto;
  row-gap:0;flex:1;min-width:0;
}
.badge-text{
  font-size:11px;color:#bbb;height:18px;line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name{
  font-size:13px;font-weight:800;height:36px;
  min-width:0;overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-start;word-break:break-word;
}
.name-zh{
  height:18px;line-height:18px;font-size:13px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name-en{
  height:14px;line-height:14px;margin-top:1px;
  font-size:9px;font-weight:600;color:#999;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.1px;
}
.price{
  font-size:18px;font-weight:900;height:27px;line-height:27px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stock{color:var(--success);font-size:13px;height:22px;line-height:22px}
.stock.soldout{color:var(--danger);font-weight:900;font-size:15px}
.variant-summary{width:100%;height:40px;display:flex;align-items:center;overflow:hidden}
.variant-summary-row{
  display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;
  align-items:center;width:100%;height:36px;
}
.variant-summary-label{font-size:10px;white-space:nowrap}
.variant-summary-select{
  width:100%;height:32px;min-width:0;padding:4px 14px 4px 7px;
  border:1px solid #666;border-radius:9px;background:#111216;color:#fff;
  font-size:10px;letter-spacing:-.2px;
}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .btn{flex:1}
.empty{grid-column:1/-1;color:#777;padding:40px 0;text-align:center}

/* Dialog */
dialog{
  width:min(520px,calc(100% - 28px));border:1px solid #3d3d44;
  border-radius:16px;background:#17171b;color:#fff;padding:0;
  box-shadow:0 24px 80px #0009;
}
dialog::backdrop{background:#000b}
.dialog-wrap{padding:20px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dialog-head h3{margin:0;font-size:21px}
.icon-btn{background:transparent;border:0;color:#aaa;font-size:24px;line-height:1}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;color:#cfcfd4;font-size:13px}
.form input,.form select{
  width:100%;background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:10px;padding:11px 12px;outline:none;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.preview{
  width:100%;min-height:170px;max-height:220px;border:1px dashed #444;
  border-radius:12px;padding:10px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;
  align-content:start;color:#777;overflow:auto;background:#111;
}
.preview-item{position:relative;aspect-ratio:4/3;border:1px solid #333;border-radius:8px;overflow:hidden;background:#17171b}
.preview-item img{width:100%;height:100%;object-fit:contain;display:block}
.preview-remove{
  position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;
  border-radius:50%;background:#000c;color:#fff;font-size:16px;line-height:24px;padding:0;
}
.preview-index{
  position:absolute;left:5px;bottom:5px;padding:2px 6px;border-radius:10px;
  background:#000a;color:#fff;font-size:11px;
}
.variant-list{display:grid;gap:8px}
.variant-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 80px minmax(105px,1fr) auto;
  gap:7px;
  align-items:center;
}
.variant-row input,.variant-row select{
  width:100%;min-width:0;background:#101014;color:#fff;
  border:1px solid #3b3b42;border-radius:9px;padding:9px 10px;
}
.variant-remove{height:38px}
.variant-total{
  display:flex;justify-content:space-between;padding:8px 10px;
  background:#101014;border-radius:9px;border:1px solid #2f2f35;
}
.variant-total strong{color:#fff}
.variant-summary-note{font-size:11px;color:#777;line-height:1.5;margin-top:7px}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:100;
  background:#fff;color:#111;padding:12px 15px;border-radius:11px;
  box-shadow:0 12px 40px #0008;font-weight:800;
}

/* RWD */
@media(max-width:1200px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){
  .category-note{font-size:11px}
  .topbar{padding:12px 16px}
  .brand h1{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-form{grid-template-columns:1fr}
  .variant-row{grid-template-columns:minmax(0,1fr) 72px minmax(105px,1fr) auto}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">O²</div>
    <div>
      <h1>O² M★STAR交易區</h1>
      <div class="brand-meta">
        <small>販售・收購・交流</small>
        <a class="top-contact-link"
           href="https://discord.com/users/621734178228273155"
           target="_blank" rel="noopener noreferrer"
           aria-label="聯絡賣家">✉ 聯絡賣家</a>
      </div>
      <div class="payment-notice">
        可使用台幣或糖果交易・採先付款後交易
      </div>
    </div>
  </div>
  <button id="adminBtn" class="btn">管理員登入</button>
</header>

<main class="wrap">

<section class="toolbar">
  <input id="searchInput" class="search" placeholder="搜尋商品名稱…">
  <button id="addBtn" class="btn primary hidden">＋ 新增商品</button>
  <button id="migrateImagesBtn" class="btn hidden">☁ 舊圖片搬到 Firebase Storage</button>
</section>

<!-- 風格 3：霓虹分類列 -->
<nav id="tabs" class="tabs">

  <button class="tab neon-orange active" data-category="家具" aria-label="家具">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M9 25v-6c0-5 4-9 9-9h12c5 0 9 4 9 9v6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M7 25h34v8H7z" fill="currentColor"/>
        <path d="M10 33v6M38 33v6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </span><span class="tab-label"><span class="zh">家具</span><span class="en">Furniture</span></span>
  </button>

  <button class="tab neon-green" data-category="花盆" aria-label="花盆">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 22c-5-7-13-6-15-1 6 4 10 4 15 1Z" fill="currentColor"/>
        <path d="M24 22c5-7 13-6 15-1-6 4-10 4-15 1Z" fill="currentColor"/>
        <path d="M24 22v-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M13 27h22l-3 12H16l-3-12Z" stroke="currentColor" stroke-width="3"/>
      </svg>
    </span><span class="tab-label"><span class="zh">花盆</span><span class="en">Flower Pots</span></span>
  </button>

  <button class="tab neon-cyan" data-category="戒指限男" aria-label="戒指限男">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="27" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M24 6l5 7-5 7-5-7 5-7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </span><span class="tab-label"><span class="zh">戒指限男</span><span class="en">Rings · Men</span></span>
  </button>

  <!-- 戒指限女：已改為「戒指」圖示，不再使用愛心 -->
  <button class="tab neon-pink" data-category="戒指限女" aria-label="戒指限女">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="27" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M24 6l5 7-5 7-5-7 5-7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="24" cy="13" r="2" fill="currentColor"/>
      </svg>
    </span><span class="tab-label"><span class="zh">戒指限女</span><span class="en">Rings · Women</span></span>
  </button>

  <button class="tab neon-purple" data-category="作物限男" aria-label="作物限男">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 39V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 28c-10 1-14-4-14-10 8-1 14 2 14 10Z" fill="currentColor"/>
        <path d="M24 24c10 1 14-4 14-10-8-1-14 2-14 10Z" fill="currentColor"/>
      </svg>
    </span><span class="tab-label"><span class="zh">作物限男</span><span class="en">Crops · Men</span></span>
  </button>

  <button class="tab neon-blue" data-category="作物限女" aria-label="作物限女">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 40V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 27c-9 0-13-5-13-11 8 0 13 3 13 11Z" fill="currentColor"/>
        <path d="M24 34c9 0 13-5 13-11-8 0-13 3-13 11Z" fill="currentColor"/>
        <path d="M24 21c0-6 3-10 8-12 1 6-1 10-8 12Z" fill="currentColor"/>
      </svg>
    </span><span class="tab-label"><span class="zh">作物限女</span><span class="en">Crops · Women</span></span>
  </button>

</nav>

<section class="section-head">
  <div>
    <div class="section-title-line"><h3 id="sectionTitle">新家具</h3><span id="categoryNote" class="category-note hidden">購買戒指由買方支付升級費用</span></div>
    <div id="productCount" class="count">0 件商品</div>
  </div>
  <div class="sort-box">
    <label for="productSort">金額排序</label>
    <select id="productSort">
      <option value="priceDesc" selected>金額：高到低</option>
      <option value="priceAsc">金額：低到高</option>
    </select>
  </div>
</section>

<section id="productGrid" class="grid">
  <div class="empty">讀取商品中…</div>
</section>



</main>

<!-- 管理員登入 -->
<dialog id="loginDialog">
  <div class="dialog-wrap">
    <div class="dialog-head">
      <h3>管理員登入</h3>
      <button class="icon-btn" type="button" data-close="loginDialog">×</button>
    </div>
    <form id="loginForm" class="form">
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close="loginDialog">取消</button>
        <button class="btn primary" type="submit">登入</button>
      </div>
    </form>
  </div>
</dialog>

<!-- 新增 / 編輯商品 -->
<dialog id="productDialog">
  <div class="dialog-wrap">
    <div class="dialog-head">
      <h3 id="productDialogTitle">新增商品</h3>
      <button class="icon-btn" type="button" data-close="productDialog">×</button>
    </div>

    <form id="productForm" class="form" novalidate>
      <input id="productId" type="hidden">

      <label>分類
        <select id="productCategory" required>
          <option value="家具">家具</option>
          <option value="花盆">花盆</option>
          <option value="戒指限男">戒指限男</option>
          <option value="戒指限女">戒指限女</option>
          <option value="作物限男">作物限男</option>
          <option value="作物限女">作物限女</option>
        </select>
      </label>

      <label>商品名稱
        <input id="productName" maxlength="80" required placeholder="輸入商品名稱">
      </label>

      <label>英文商品名稱
        <input id="productNameEn" maxlength="120" placeholder="English product name（可留空自動翻譯）">

function firebaseErrorMessage(error, fallback="操作失敗", phase="") {
  const code=String(error?.code||"");
  const message=String(error?.message||"");
  const lower=(code+" "+message).toLowerCase();
  const prefix=phase?`${phase}：`:"";
  if(lower.includes("storage/unauthorized") || lower.includes("storage/permission-denied")) {
    return `${prefix}Storage 權限錯誤（${code || "storage/unauthorized"}）\n只有管理員 UID ${ADMIN_UID} 可以上傳商品圖片`;
  }
  if(lower.includes("storage/bucket-not-found")) {
    return `${prefix}Storage 找不到 Bucket（${code}）\n請確認 Firebase Storage 已啟用，Bucket 必須是 ostar-shop.firebasestorage.app`;
  }
  if(lower.includes("storage/unauthenticated")) {
    return `${prefix}Storage 未登入（${code}）\n請先登入管理員帳號`;
  }
  if(lower.includes("storage/")) {
    return `${prefix}Storage 錯誤（${code}）\n${message}`;
  }
  if(lower.includes("permission-denied") || lower.includes("permission_denied") || lower.includes("missing or insufficient permissions")) {
    return `${prefix}Firestore 權限錯誤（${code || "permission-denied"}）\n目前登入 UID：${currentUser?.uid || "未登入"}\n管理員 UID：${ADMIN_UID}`;
  }
  if(lower.includes("failed-precondition")) {
    return `${prefix}Firestore 前置條件錯誤（${code}）\n${message}`;
  }
  if(lower.includes("firestore/")) {
    return `${prefix}Firestore 錯誤（${code}）\n${message}`;
  }
  return `${prefix}${fallback}（${code || "unknown"}）\n${message || "請查看瀏覽器主控台"}`;
}

/* 圖片標準化：固定 600×450，並壓縮成適合直接存入 Firestore 的 WebP */
function normalizeImageDataURL(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const canvas=document.createElement("canvas");
        canvas.width=600;
        canvas.height=450;

        const ctx=canvas.getContext("2d");
        if(!ctx) throw new Error("瀏覽器無法建立圖片畫布");

        const scale=Math.min(600/img.naturalWidth,450/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const x=Math.round((600-w)/2);
        const y=Math.round((450-h)/2);

        ctx.clearRect(0,0,600,450);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        ctx.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,x,y,w,h);

        /*
         * Firestore 單一文件約 1 MiB 上限。
         * 新商品最多 6 張圖片，因此每張圖片先控制在約 90 KB 以下，
         * 避免多張圖片一起寫入時超過文件大小限制。
         */
        const maxBytes=90*1024;
        let best="";

        for(let quality=0.82; quality>=0.42; quality-=0.05){
          const data=canvas.toDataURL("image/webp",quality);
          if(!data.startsWith("data:image/webp")) break;

          best=data;

          const base64=data.split(",")[1]||"";
          const approxBytes=Math.floor(base64.length*3/4);

          if(approxBytes<=maxBytes){
            resolve(data);
            return;
          }
        }

        if(best){
          resolve(best);
          return;
        }

        throw new Error("目前瀏覽器不支援 WebP 圖片壓縮");
      }catch(e){
        reject(e);
      }
    };
    img.onerror=()=>reject(new Error("圖片讀取失敗"));
    img.src=src;
  });
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async()=>{
      try{resolve(await normalizeImageDataURL(reader.result))}
      catch(e){reject(e)}
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

const PRODUCT_NAME_EN_MAP = {
  "訂製粉嫩毛絨小兔": "Custom Pink Plush Bunny",
  "淨焰之火情侶對戒": "Pure Flame Couple Rings",
  "粉紅蜜蠟情侶對戒": "Pink Beeswax Couple Rings",
  "粉紅帝王鑽石情侶對戒": "Pink Imperial Diamond Couple Rings"
};

async function autoTranslateProductName(chineseName){
  const text=String(chineseName||"").trim();
  if(!text) return "";

  // 已有固定商品名稱先直接使用，避免重複呼叫翻譯服務。
  for(const [zh,en] of Object.entries(PRODUCT_NAME_EN_MAP)){
    if(text===zh || text.includes(zh)) return en;
  }

  // 使用 Google Translate 公開翻譯端點；失敗時改用本站內建片語翻譯。
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-TW&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const response=await fetch(url,{method:"GET"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    const translated=Array.isArray(data?.[0])
      ? data[0].map(item=>item?.[0]||"").join("").trim()
      : "";
    if(translated) return translated;
  }catch(error){
    console.warn("英文名稱自動翻譯失敗，改用內建翻譯",error);
  }

  return getEnglishProductName({name:text});
}

function getEnglishProductName(product){
  const name=String(product?.name||"").trim();
  const saved=String(product?.nameEn||"").trim();
  if(saved) return saved;
  for(const [zh,en] of Object.entries(PRODUCT_NAME_EN_MAP)){
    if(name.includes(zh)) return en;
  }
  // 常見名稱片語自動組合；未提供英文名稱的舊商品會盡量翻譯。
  const phraseMap=[
    ["訂製","Custom "],["粉嫩","Pink "],["毛絨","Plush "],["小兔","Bunny"],
    ["淨焰之火","Pure Flame"],["粉紅","Pink"],["蜜蠟","Beeswax"],
    ["帝王","Imperial"],["鑽石","Diamond"],["情侶對戒","Couple Rings"],
    ["對戒","Couple Rings"],["戒指","Ring"],["家具","Furniture"],
    ["花盆","Flower Pot"],["作物","Crops"],["限男","Men"],["限女","Women"]
  ];
  let result=name;
  for(const [zh,en] of phraseMap) result=result.split(zh).join(en);
  return result===name ? "English name not set" : result.replace(/\\s+/g," ").trim();
}

/* 商品圖片預覽 */
function renderImagePreview(){
  const preview=$("#imagePreview");
  preview.innerHTML="";
  if(!selectedImageItems.length){
    preview.textContent="尚未選擇圖片";
    return;
  }

  selectedImageItems.forEach((item,index)=>{
    const box=document.createElement("div");
    box.className="preview-item";

    const img=document.createElement("img");
    img.src=item.src;
    img.alt=`商品圖片 ${index+1}`;
    box.appendChild(img);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="preview-remove";
    remove.textContent="×";
    remove.onclick=()=>{
      const removed=selectedImageItems.splice(index,1)[0];
      if(removed?.src?.startsWith("blob:")) URL.revokeObjectURL(removed.src);
      renderImagePreview();
      refreshVariantImageOptions();
    };
    box.appendChild(remove);

    const label=document.createElement("span");
    label.className="preview-index";
    label.textContent=`${index+1}${index===0?" 主圖":""}`;
    box.appendChild(label);

    preview.appendChild(box);
  });
}

function refreshVariantImageOptions(){
  $$("#variantList .variant-row").forEach(row=>{
    const select=row.querySelector(".variant-image");
    if(!select) return;
    const old=select.value;
    select.innerHTML="";

    if(!selectedImageItems.length){
      const option=document.createElement("option");
      option.value=""; option.textContent="先上傳圖片";
      option.disabled=true; option.selected=true;
      select.appendChild(option);
      return;
    }

    selectedImageItems.forEach((_,index)=>{
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=`圖片 ${index+1}${index===0?"（主圖）":""}`;
      select.appendChild(option);
    });

    if([...select.options].some(o=>o.value===old)) select.value=old;
    else select.value=String(Math.min(
      Number(row.dataset.defaultImageIndex||0),
      selectedImageItems.length-1
    ));
  });
}

function createVariantRow(variant={}){
  const row=document.createElement("div");
  row.className="variant-row";
  row.dataset.defaultImageIndex=Number(variant.imageIndex||0);

  const color=document.createElement("input");
  color.className="variant-color";
  color.maxLength=30;
  color.placeholder="顏色，例如：黑色";
  color.value=variant.color||"";

  const stock=document.createElement("input");
  stock.className="variant-stock";
  stock.type="number";
  stock.min="0";
  stock.placeholder="庫存";
  stock.value=Number(variant.stock||0);

  const image=document.createElement("select");
  image.className="variant-image";
  image.setAttribute("aria-label","指定商品圖片");

  const remove=document.createElement("button");
  remove.type="button";
  remove.className="btn small danger variant-remove";
  remove.textContent="×";

    row.remove();
    ensureOneVariantRow();

function ensureOneVariantRow(){

let productNameTranslateTimer=null;
let productNameTranslateToken=0;

async function updateProductEnglishName(){
  const zhInput=$("#productName");
  const enInput=$("#productNameEn");
  if(!zhInput || !enInput) return;
  const chinese=zhInput.value.trim();
  if(!chinese) return;

  const token=++productNameTranslateToken;
  enInput.placeholder="自動翻譯中…";
  const translated=await autoTranslateProductName(chinese);
  if(token!==productNameTranslateToken) return;

  // 使用者手動輸入英文後，不覆蓋使用者內容。
  if(!enInput.value.trim() || enInput.dataset.autoValue===enInput.value.trim()){

$("#productName").addEventListener("input",()=>{

function openProductDialog(product=null){
  $("#productForm").reset();
  $("#productId").value=product?.id||"";
  $("#productDialogTitle").textContent=product?"編輯商品":"新增商品";
  $("#productCategory").value=product?.category||currentCategory;
  $("#productName").value=product?.name||"";
  $("#productNameEn").value=product?.nameEn||"";
  $("#productNameEn").dataset.autoValue=$("#productNameEn").value.trim();
  if(!$("#productNameEn").value.trim() && $("#productName").value.trim()){
    setTimeout(updateProductEnglishName,50);
  }
  $("#productPrice").value=formatPriceInput(product?.price||"");

  setVariantsInForm(
    product?.variants?.length
      ? product.variants
      : [{color:"",stock:Number(product?.stock??0),imageIndex:0}]
  );

  selectedImageItems=(Array.isArray(product?.images)
    ? product.images.filter(Boolean)
    : (product?.image?[product.image]:[])
  ).map(src=>({src,existing:true}));

  $("#productImage").value="";
  renderImagePreview();
  refreshVariantImageOptions();
  $("#productDialog").showModal();
}

/* 上傳圖片 */
$("#productImage").addEventListener("change",async event=>{
  const files=[...event.target.files||[]];
  if(!files.length) return;

  const remaining=6-selectedImageItems.length;
  if(remaining<=0){
    toast("最多只能使用 6 張商品圖片");
    event.target.value="";
    return;
  }

  const filesToAdd=files.slice(0,remaining);

  const items=filesToAdd.map(file=>({
    file,
    src:URL.createObjectURL(file),
    processing:true,
    existing:false
  }));

  selectedImageItems.push(...items);
  renderImagePreview();

  await Promise.all(items.map(async item=>{
    try{
      item.processed=await compressImage(item.file);
    }catch(e){
      console.warn("圖片標準化失敗",e);
    }finally{
      item.processing=false;
    }
  }));

  renderImagePreview();
  refreshVariantImageOptions();
  event.target.value="";
});

/* Firebase Storage：圖片只負責放檔案，商品讀取仍完全沿用原版 Firestore onSnapshot */
function isFirebaseStorageUrl(url){
  const s=String(url||"");
  return s.includes("firebasestorage.googleapis.com") ||
         s.includes("storage.googleapis.com/ostar-shop") ||
         s.includes("ostar-shop.firebasestorage.app");
}

async function uploadProcessedImage(processed, productId, index){
  const response=await fetch(processed);
  const blob=await response.blob();
  const path=`products/${productId}/image_${Date.now()}_${index}.webp`;
  const fileRef=storageRef(storage,path);
  try{
    await uploadBytes(fileRef,blob,{
      contentType:"image/webp",
      cacheControl:"public,max-age=31536000,immutable"
    });
    return await getDownloadURL(fileRef);
  }catch(error){
    error.__firebasePhase="Storage 圖片上傳";
    throw error;
  }
}

async function migrateLegacyProduct(product){
  const oldImages=Array.isArray(product.images)
    ? product.images.filter(Boolean)
    : (product.image?[product.image]:[]);
  if(!oldImages.length) return false;

  let changed=false;
  const newImages=[];
  for(let i=0;i<oldImages.length;i++){
    const src=String(oldImages[i]||"");
    if(!src) continue;
    if(isFirebaseStorageUrl(src)){
      newImages.push(src);
      continue;
    }
    // 原版舊圖片通常是 data:image/...；這種不需要跨網域，直接轉 Blob 後上傳。
    const response=await fetch(src);
    const blob=await response.blob();
    const path=`products/${product.id}/migrated_${Date.now()}_${i}.webp`;
    const fileRef=storageRef(storage,path);
    await uploadBytes(fileRef,blob,{
      contentType:blob.type||"image/webp",
      cacheControl:"public,max-age=31536000,immutable"
    });
    newImages.push(await getDownloadURL(fileRef));
    changed=true;
  }
  if(changed){
    await updateDoc(doc(db,"products",product.id),{
      images:newImages,
      image:newImages[0]||"",
      updatedAt:serverTimestamp()
    });
  }
  return changed;
}

async function migrateAllLegacyImages(){
  if(!isAdmin()) return toast("只有管理員可以搬移舊圖片");
  const btn=$("#migrateImagesBtn");
  btn.disabled=true;
  const oldText=btn.textContent;
  try{
    // 這裡只讀一次 products，不改原本商品即時監聽。
    const snapshot=await new Promise((resolve,reject)=>{
      const unsub=onSnapshot(collection(db,"products"),snap=>{unsub();resolve(snap)},err=>{unsub();reject(err)});
    });
    const all=snapshot.docs.map(d=>({id:d.id,...d.data()}));
    let changed=0, failed=0;
    for(let i=0;i<all.length;i++){
      btn.textContent=`搬移圖片 ${i+1}/${all.length}…`;
      try{ if(await migrateLegacyProduct(all[i])) changed++; }
      catch(e){ failed++; console.error("圖片搬移失敗",all[i].name,e); }
    }
    toast(`完成：${changed} 個商品已轉為 Storage${failed?`，${failed} 個失敗`:""}`);
  }catch(e){
    console.error(e);
    toast("舊圖片搬移失敗");
  }finally{
    btn.disabled=false;
    btn.textContent=oldText;
  }
}

$("#migrateImagesBtn").onclick=migrateAllLegacyImages;

/* 儲存商品：v6
 * 1. 新增商品不再上傳 Firebase Storage。
 * 2. 圖片壓縮後直接寫入 Firestore。
 * 3. 保留多圖片、顏色、庫存與舊商品編輯功能。
 */
$("#productForm").addEventListener("submit",async event=>{
  event.preventDefault();

  if(!isAdmin()){
    const uid=currentUser?.uid || "未登入";
    const text=`目前沒有管理員權限。\n目前登入 UID：${uid}\n管理員 UID：${ADMIN_UID}`;
    toast(text,9000);
    alert(text);
    return;
  }

  const saveButton=$("#productForm button[type=submit]");
  const oldText=saveButton?.textContent || "儲存商品";
  if(saveButton?.disabled) return;

  const chineseName=$("#productName").value.trim();
  const priceInput=$("#productPrice").value.trim();

  if(!chineseName){
    toast("請先輸入商品名稱",5000);
    alert("請先輸入商品名稱");
    return;
  }
  if(!priceInput){
    toast("請先輸入價格",5000);
    alert("請先輸入價格");
    return;
  }

  if(saveButton){
    saveButton.disabled=true;
    saveButton.textContent="儲存中…";
  }

  try{
    const variants=getVariantsFromForm();
    const stock=variants.reduce((sum,v)=>sum+v.stock,0);

    /* 不等待 Google Translate；若英文欄空白，直接使用本站內建翻譯。 */
    let englishName=$("#productNameEn").value.trim();
    if(!englishName){
      englishName=getEnglishProductName({name:chineseName});
      $("#productNameEn").value=englishName;
    }

    const id=$("#productId").value.trim();
    const productRef=id
      ? doc(db,"products",id)
      : doc(collection(db,"products"));

    const basePayload={
      category:$("#productCategory").value,
      name:chineseName,
      nameEn:englishName,
      price:formatPriceInput(priceInput),
      stock,
      variants,
      updatedAt:serverTimestamp()
    };

    /*
     * v6：新增圖片不再上傳 Firebase Storage。
     * 已處理完成的圖片直接以壓縮後 data URL 寫入 Firestore。
     * 舊商品如果原本是 Storage URL，則完整保留，不重新上傳。
     */
    const images=[];
    for(let i=0;i<selectedImageItems.length;i++){
      const item=selectedImageItems[i];

      if(item.existing && item.src && !item.src.startsWith("blob:")){
        images.push(item.src);
      }else if(item.processed){
        images.push(item.processed);
      }else if(item.file){
        images.push(await compressImage(item.file));
      }
    }

    /* 儲存前檢查商品文件大小，避免 Firestore 文件超過約 1 MiB 限制。 */
    const previewPayload={
      ...basePayload,
      images,
      image:images[0]||"",
      ...(id ? {} : {createdAt:serverTimestamp()})
    };
    const estimatedBytes=new TextEncoder().encode(JSON.stringify(
      previewPayload,
      (key,value)=>value && typeof value==="object" && value.constructor?.name==="FieldValue"
        ? null
        : value
    )).length;

    if(estimatedBytes>900*1024){
      throw Object.assign(
        new Error("圖片總容量過大，請減少圖片張數或重新選擇較小圖片。"),
        {__firebasePhase:"Firestore 圖片容量檢查",code:"image-size-too-large"}
      );
    }

    if(id){
      await updateDoc(productRef,{
        ...basePayload,
        images,
        image:images[0]||"",
        updatedAt:serverTimestamp()
      });
    }else{
      await setDoc(productRef,{
        ...basePayload,
        images,
        image:images[0]||"",
        createdAt:serverTimestamp()
      });
    }

    toast(id ? "商品已更新" : "商品已新增",3500);
    $("#productDialog").close();
  }catch(error){
    console.error("商品儲存失敗：",error);
    const phase=error?.__firebasePhase || "商品儲存";
    showFirebaseError(error,phase);

  }finally{
    if(saveButton){
      saveButton.disabled=false;
      saveButton.textContent=oldText;
    }
  }
});
