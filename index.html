or:#fff;   padding:0;   box-shadow:0 24px 80px #0009 }  dialog.cart-dialog{   width:min(620px,calc(100% - 28px)) }  dialog::backdrop{   background:#000b }  .dialog-wrap{padding:20px}  .dialog-head{   display:flex;   justify-content:space-between;   align-items:center;   margin-bottom:16px }  .dialog-head h3{font-size:21px}  .icon-btn{   background:transparent;   border:0;   color:#aaa;   font-size:24px }  .form{   display:grid;   gap:12px }  .form label{   display:grid;   gap:6px;   color:#cfcfd4;   font-size:13px }  .form input, .form select{   width:100%;   background:#101014;   color:#fff;   border:1px solid #3b3b42;   border-radius:10px;   padding:11px 12px;   outline:none }  .dialog-actions{   display:flex;   justify-content:flex-end;   gap:10px;   margin-top:16px }  .preview{   width:100%;   aspect-ratio:4/3;   border:1px dashed #444;   border-radius:12px;   display:grid;   place-items:center;   color:#777;   overflow:hidden;   background:#111 }  .preview img{   width:100%;   height:100%;   object-fit:contain }  .toast{   position:fixed;   right:18px;   bottom:18px;   z-index:100;   background:#fff;   color:#111;   padding:11px 14px;   border-radius:10px;   box-shadow:0 12px 40px #0008;   font-weight:700 }  @media(max-width:900px){   .grid{     grid-template-columns:repeat(3,1fr)   } }  @media(max-width:800px){   .grid{     grid-template-columns:repeat(2,1fr)   }    .board-form{     grid-template-columns:1fr   }    .cart-item{     grid-template-columns:60px 1fr   }    .cart-item > div:last-child{     grid-column:2   } }  @media(max-width:500px){   .grid{     grid-template-columns:1fr   }    .brand small{     display:none   }    .topbar{     padding:12px 14px   }    .toolbar .search{     min-width:100%   }    .cart-btn{     flex:1   } } </style>

<script type="module">  import {   initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";  import {   getAuth,   signInWithEmailAndPassword,   signOut,   onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";  import {   getFirestore,   collection,   addDoc,   updateDoc,   deleteDoc,   doc,   onSnapshot,   query,   orderBy,   serverTimestamp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";   /* Firebase 設定 */  const firebaseConfig = {    apiKey: "AIzaSyBWH6HxuAXNbTpRQKGhNU10P5oLWcE36yQ",    authDomain: "ostar-shop.firebaseapp.com",    projectId: "ostar-shop",    storageBucket: "ostar-shop.firebasestorage.app",    messagingSenderId: "1070557199066",    appId: "1:1070557199066:web:aa8ce9dc1b5eb3710683e3"  };   const ADMIN_UID = "IhFebcTe8tTN0jtpyjKgGvN6NmY2";   const app = initializeApp(firebaseConfig);  const auth = getAuth(app);  const db = getFirestore(app);   /* DOM */  const $ = s => document.querySelector(s);  const $$ = s => [...document.querySelectorAll(s)];   /* 全域狀態 */  let products = [];  let messages = [];  let currentCategory = "新家具";  let currentUser = null;  let editingImage = "";   /* 購物車 */  let cart = JSON.parse(   localStorage.getItem("ostar_cart") || "[]" );   /* Toast */  function toast(text){    const el = $("#toast");    el.textContent = text;    el.classList.remove("hidden");    clearTimeout(window.__tt);    window.__tt = setTimeout(     () => el.classList.add("hidden"),     2200   );  }   /* 管理員 */  function isAdmin(){    return !!currentUser &&     currentUser.uid === ADMIN_UID;  }   /* 時間 */  function formatTime(ts){    if(!ts?.toDate) return "";    return ts.toDate().toLocaleString(     "zh-TW",     {       year:"numeric",       month:"2-digit",       day:"2-digit",       hour:"2-digit",       minute:"2-digit"     }   );  }   /* 儲存購物車 */  function saveCart(){    localStorage.setItem(     "ostar_cart",     JSON.stringify(cart)   );    updateCartCount();  }   /* 購物車總數 */  function getCartCount(){    return cart.reduce(     (sum,item) => sum + Number(item.qty || 0),     0   );  }   /* 更新購物車數字 */  function updateCartCount(){    const count = getCartCount();    const badge = $("#cartCount");    badge.textContent = count;    badge.classList.toggle(     "hidden",     count <= 0   );  }   /* 取得目前商品 */  function findProduct(id){    return products.find(     p => p.id === id   );  }   /* 加入購物車 */  function addToCart(productId, quantity){    const product = findProduct(productId);    if(!product){      toast("商品不存在");      return;   }     const stock = Number(product.stock ?? 0);    if(stock <= 0){      toast("此商品已售罄");      return;   }     quantity = Number(quantity);    if(!Number.isInteger(quantity) || quantity < 1){      toast("請輸入正確數量");      return;   }     const existing = cart.find(     item => item.productId === productId   );     const currentQty = existing     ? Number(existing.qty)     : 0;     if(currentQty + quantity > stock){      toast(`庫存不足，目前庫存 ${stock} 件`);      return;   }     if(existing){      existing.qty += quantity;    }else{      cart.push({       productId:product.id,       qty:quantity     });    }     saveCart();    renderCart();    toast("已加入購物車");  }   /* 購物車數量修改 */  function changeCartQty(productId, change){    const product = findProduct(productId);    const item = cart.find(     x => x.productId === productId   );    if(!item || !product) return;     const stock = Number(product.stock ?? 0);    const newQty =     Number(item.qty) + Number(change);     if(newQty <= 0){      cart = cart.filter(       x => x.productId !== productId     );      saveCart();      renderCart();      return;   }     if(newQty > stock){      toast(`庫存不足，目前庫存 ${stock} 件`);      return;   }     item.qty = newQty;    saveCart();    renderCart();  }   /* 移除購物車商品 */  function removeFromCart(productId){    cart = cart.filter(     x => x.productId !== productId   );    saveCart();    renderCart();  }   /* 清空購物車 */  function clearCart(){    if(!cart.length){      toast("購物車已經是空的");      return;   }     if(!confirm("確定要清空購物車嗎？")) return;     cart = [];    saveCart();    renderCart();    toast("購物車已清空");  }   /* 顯示購物車 */  function renderCart(){    const list = $("#cartList");    const empty = $("#cartEmpty");    list.innerHTML = "";     /* 清理不存在商品 */    cart = cart.filter(     item => findProduct(item.productId)   );     if(!cart.length){      empty.classList.remove("hidden");      $("#cartTotal").innerHTML =       "<span>商品數量</span><span>0 件</span>";      updateCartCount();      return;   }     empty.classList.add("hidden");     let totalQty = 0;     cart.forEach(item => {      const product =       findProduct(item.productId);      if(!product) return;       const stock =       Number(product.stock ?? 0);       let qty =       Number(item.qty || 0);       /* 如果商品庫存被管理員降低 */      if(qty > stock){        qty = stock;        item.qty = stock;      }       if(qty <= 0){        return;      }       totalQty += qty;       const row =       document.createElement("div");      row.className = "cart-item";       /* 圖片 */      const imageBox =       document.createElement("div");      imageBox.className =       "cart-item-image";       if(product.image){        const img =         document.createElement("img");        img.src = product.image;        img.alt =         product.name || "商品圖片";        imageBox.appendChild(img);      }else{        imageBox.textContent =         "無圖片";      }       /* 商品資訊 */      const info =       document.createElement("div");       const name =       document.createElement("div");      name.className =       "cart-item-name";      name.textContent =       product.name || "";       const price =       document.createElement("div");      price.className =       "cart-item-price";      price.textContent =       product.price || "";       const controls =       document.createElement("div");      controls.className =       "cart-controls";       const minus =       document.createElement("button");      minus.className =       "qty-btn";      minus.textContent = "−";      minus.onclick = () =>       changeCartQty(         product.id,         -1       );       const qtyText =       document.createElement("span");      qtyText.className =       "cart-qty";      qtyText.textContent =       qty;       const plus =       document.createElement("button");      plus.className =       "qty-btn";      plus.textContent = "+";      plus.onclick = () =>       changeCartQty(         product.id,         1       );       controls.append(       minus,       qtyText,       plus     );       const remove =       document.createElement("button");      remove.className =       "cart-remove";      remove.textContent =       "移除";      remove.onclick = () =>       removeFromCart(product.id);       info.append(       name,       price,       controls,       remove     );       const stockBox =       document.createElement("div");      stockBox.style.color = "#888";      stockBox.style.fontSize = "12px";      stockBox.textContent =       `庫存 ${stock} 件`;       row.append(       imageBox,       info,       stockBox     );       list.appendChild(row);    });     saveCart();     $("#cartTotal").innerHTML =     `<span>購物車商品數量</span><span>${totalQty} 件</span>`;  }   /* 商品列表 */  function renderProducts(){    const q =     $("#searchInput")       .value       .trim()       .toLowerCase();     const list =     products.filter(       p =>         p.category === currentCategory &&         (           !q ||           (p.name || "")             .toLowerCase()             .includes(q)         )     );     $("#sectionTitle").textContent =     currentCategory;     $("#productCount").textContent =     `${list.length} 件商品`;     const grid =     $("#productGrid");     grid.innerHTML = "";     if(!list.length){      grid.innerHTML =       '<div class="empty">這個分類目前沒有商品</div>';      return;    }     list.forEach(p => {      const stock =       Number(p.stock ?? 0);       const card =       document.createElement("article");      card.className = "card";       /* 商品圖片 */      const media =       document.createElement("div");      media.className = "media";       if(p.image){        const img =         document.createElement("img");        img.src = p.image;        img.alt =         p.name || "商品圖片";        media.appendChild(img);      }else{        media.textContent =         "無商品圖片";      }       /* 商品內容 */      const body =       document.createElement("div");      body.className = "body";       const badge =       document.createElement("div");      badge.className = "badge";      badge.textContent =       p.category || "";       const name =       document.createElement("div");      name.className = "name";      name.textContent =       p.name || "";       const price =       document.createElement("div");      price.className = "price";      price.textContent =       p.price || "";       const stockText =       document.createElement("div");      stockText.className =       stock <= 0         ? "stock out"         : "stock";       stockText.textContent =       stock <= 0         ? "售罄"         : `庫存：${stock} 件`;       body.append(       badge,       name,       price,       stockText     );       /* 購買區 */      if(stock > 0){        const buyRow =         document.createElement("div");        buyRow.className =         "buy-row";         const qty =         document.createElement("input");        qty.className =         "qty-input";        qty.type = "number";        qty.min = "1";        qty.max =         String(stock);        qty.value = "1";         const add =         document.createElement("button");        add.className =         "btn primary";        add.textContent =         "加入購物車";         add.onclick = () =>         addToCart(           p.id,           qty.value         );         buyRow.append(         qty,         add       );         body.appendChild(buyRow);      }else{        const sold =         document.createElement("button");        sold.className =         "btn";        sold.textContent =         "已售罄";        sold.disabled = true;        sold.style.opacity = ".5";        sold.style.marginTop = "12px";        body.appendChild(sold);      }       /* 管理員 */      if(isAdmin()){        const actions =         document.createElement("div");        actions.className =         "card-actions";         const edit =         document.createElement("button");        edit.className =         "btn small";        edit.textContent =         "編輯";        edit.onclick = () =>         openProductDialog(p);         const del =         document.createElement("button");        del.className =         "btn small danger";        del.textContent =         "刪除";         del.onclick = async () => {          if(           confirm(             `確定刪除「${p.name}」嗎？`           )         ){            try{              await deleteDoc(               doc(                 db,                 "products",                 p.id               )             );              removeFromCart(p.id);              toast("商品已刪除");            }catch(err){              console.error(err);              toast("刪除失敗");            }          }        };         actions.append(         edit,         del       );        body.appendChild(actions);      }       card.append(       media,       body     );      grid.appendChild(card);    });  }   /* 留言 */  function renderMessages(){    const box =     $("#messages");    box.innerHTML = "";     if(!messages.length){      box.innerHTML =       '<div class="message">目前還沒有留言</div>';      return;    }     messages.forEach(m => {      const item =       document.createElement("div");      item.className =       "message";       const top =       document.createElement("div");      top.className =       "message-top";       const left =       document.createElement("div");       const n =       document.createElement("div");      n.className =       "message-name";      n.textContent =       m.name || "匿名";       const t =       document.createElement("div");      t.className =       "message-time";      t.textContent =       formatTime(m.createdAt);       left.append(       n,       t     );      top.appendChild(left);       if(isAdmin()){        const del =         document.createElement("button");        del.className =         "btn small danger";        del.textContent =         "刪除";         del.onclick = async () => {          if(           confirm(             "確定刪除這則留言嗎？"           )         ){            await deleteDoc(             doc(               db,               "messages",               m.id             )           );            toast("留言已刪除");          }        };         top.appendChild(del);      }       const tx =       document.createElement("div");      tx.className =       "message-text";      tx.textContent =       m.text || "";       item.append(       top,       tx     );      box.appendChild(item);    });  }   /* 圖片壓縮 */  function compressImage(file){    return new Promise(     (resolve,reject) => {        const reader =         new FileReader();         reader.onerror =         reject;         reader.onload = () => {          const img =           new Image();           img.onerror =           reject;           img.onload = () => {            const max = 900;             const scale =             Math.min(               1,               max /               Math.max(                 img.width,                 img.height               )             );             const w =             Math.round(               img.width * scale             );             const h =             Math.round(               img.height * scale             );             const c =             document.createElement(               "canvas"             );             c.width = w;            c.height = h;             c.getContext("2d")             .drawImage(               img,               0,               0,               w,               h             );             let q = .75;             let out =             c.toDataURL(               "image/jpeg",               q             );             while(             out.length > 650000 &&             q > .4           ){              q -= .08;              out =               c.toDataURL(                 "image/jpeg",                 q               );            }             if(out.length > 780000){              reject(               new Error(                 "圖片太大"               )             );              return;            }             resolve(out);          };           img.src =           reader.result;        };         reader.readAsDataURL(file);      }   );  }   /* 開啟商品視窗 */  function openProductDialog(p=null){    $("#productForm").reset();     $("#productId").value =     p?.id || "";     $("#productDialogTitle")     .textContent =       p         ? "編輯商品"         : "新增商品";     $("#productCategory").value =     p?.category ||     currentCategory;     $("#productName").value =     p?.name || "";     $("#productPrice").value =     p?.price || "";     $("#productStock").value =     Number(p?.stock ?? 0);     editingImage =     p?.image || "";     const prev =     $("#imagePreview");     prev.innerHTML = "";     if(editingImage){      const img =       document.createElement("img");      img.src =       editingImage;      prev.appendChild(img);    }else{      prev.textContent =       "尚未選擇圖片";    }     $("#productDialog").showModal();  }   /* 圖片預覽 */  $("#productImage")   .addEventListener(     "change",     async e => {        const file =         e.target.files?.[0];         if(!file) return;         try{          const data =           await compressImage(file);           const prev =           $("#imagePreview");           prev.innerHTML = "";           const img =           document.createElement("img");           img.src = data;           prev.appendChild(img);        }catch(err){          console.error(err);          toast("圖片處理失敗");        }      }   );   /* 儲存商品 */  $("#productForm")   .addEventListener(     "submit",     async e => {        e.preventDefault();         if(!isAdmin()){          toast(           "只有管理員可以管理商品"         );          return;        }         const id =         $("#productId").value;         const file =         $("#productImage")           .files?.[0];         try{          let image =           editingImage;           if(file){            image =             await compressImage(file);          }           const stock =           Number(             $("#productStock").value           );           if(           !Number.isInteger(stock) ||           stock < 0         ){            toast(             "庫存必須是 0 或以上的整數"           );            return;          }           const payload = {            category:             $("#productCategory").value,            name:             $("#productName")               .value               .trim(),            price:             $("#productPrice")               .value               .trim(),            stock:              stock,            image:              image,            updatedAt:             serverTimestamp()          };           if(id){            await updateDoc(             doc(               db,               "products",               id             ),             payload           );             toast(             "商品已更新"           );          }else{            payload.createdAt =             serverTimestamp();             await addDoc(             collection(               db,               "products"             ),             payload           );             toast(             "商品已新增"           );          }           $("#productDialog")           .close();         }catch(err){          console.error(err);          toast(           "儲存失敗"         );        }      }   );   /* 管理員登入 */  $("#loginForm")   .addEventListener(     "submit",     async e => {        e.preventDefault();         try{          const cred =           await signInWithEmailAndPassword(             auth,             $("#loginEmail")               .value               .trim(),             $("#loginPassword")               .value           );           if(           cred.user.uid !==           ADMIN_UID         ){            await signOut(auth);            toast(             "這個帳號不是管理員"           );            return;          }           $("#loginDialog")           .close();           $("#loginForm")           .reset();           toast(           "管理員登入成功"         );         }catch(err){          console.error(err);          toast(           "登入失敗，請檢查帳號密碼"         );        }      }   );   /* 管理員按鈕 */  $("#adminBtn")   .onclick =     async () => {        if(isAdmin()){          await signOut(auth);          toast(           "已登出"         );        }else{          $("#loginDialog")           .showModal();        }      };   /* 新增商品 */  $("#addBtn")   .onclick =     () =>       openProductDialog();   /* 購物車 */  $("#cartBtn")   .onclick =     () => {        renderCart();        $("#cartDialog")         .showModal();      };   /* 清空購物車 */  $("#clearCartBtn")   .onclick =     clearCart;   /* Firebase 登入狀態 */  onAuthStateChanged(   auth,   user => {      currentUser =       user;       $("#adminBtn")       .textContent =         isAdmin()           ? "登出管理員"           : "管理員登入";       $("#addBtn")       .classList       .toggle(         "hidden",         !isAdmin()       );       renderProducts();      renderMessages();    } );   /* 分類 */  $("#tabs")   .addEventListener(     "click",     e => {        const btn =         e.target.closest(           ".tab"         );         if(!btn) return;         $$(".tab")         .forEach(           b =>             b.classList               .remove("active")         );         btn.classList         .add("active");         currentCategory =         btn.dataset.category;         renderProducts();      }   );   /* 搜尋 */  $("#searchInput")   .addEventListener(     "input",     renderProducts   );   /* 留言 */  $("#messageForm")   .addEventListener(     "submit",     async e => {        e.preventDefault();         const name =         $("#messageName")           .value           .trim();         const text =         $("#messageText")           .value           .trim();         if(!name || !text)         return;         try{          await addDoc(           collection(             db,             "messages"           ),           {             name,             text,             createdAt:               serverTimestamp()           }         );           $("#messageText")           .value = "";           toast(           "留言已送出"         );         }catch(err){          console.error(err);          toast(           "留言送出失敗"         );        }      }   );   /* 關閉 Dialog */  $$("[data-close]")   .forEach(     btn =>       btn.onclick =         () =>           document             .getElementById(               btn.dataset.close             )             ?.close()   );   /* Firebase 商品 */  onSnapshot(   query(     collection(       db,       "products"     ),     orderBy(       "createdAt",       "desc"     )   ),    snap => {      products =       snap.docs.map(         d => ({           id:d.id,           ...d.data()         })       );       renderProducts();      renderCart();    },    err => {      console.error(err);      $("#productGrid")       .innerHTML =         '<div class="empty">商品讀取失敗</div>';    } );   /* Firebase 留言 */  onSnapshot(   query(     collection(       db,       "messages"     ),     orderBy(       "createdAt",       "desc"     )   ),    snap => {      messages =       snap.docs.map(         d => ({           id:d.id,           ...d.data()         })       );       renderMessages();    },    err => {      console.error(err);      $("#messages")       .innerHTML =         '<div class="message">留言讀取失敗</div>';    } );   /* 初始化購物車 */  updateCartCount();  </script>
