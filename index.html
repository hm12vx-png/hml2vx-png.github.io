<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
  --success:#8cffb0;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================================================
   頂部
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 5vw;

  background:#0a0a0bf2;
  border-bottom:1px solid #333;

  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;

  border:1px solid #fff;
  border-radius:50%;

  display:grid;
  place-items:center;

  font-weight:900;
}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand-meta{
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.brand small{
  color:#aaa;
}


/* =========================================================
   按鈕
========================================================= */

.btn{
  border:1px solid #3a3a40;
  background:#1b1b1f;
  color:#fff;

  padding:10px 14px;

  border-radius:11px;

  transition:
    background .15s,
    transform .15s;
}

.btn:hover{
  background:#27272c;
}

.btn:active{
  transform:scale(.98);
}

.btn.primary{
  background:#fff;
  color:#111;
  font-weight:800;
}

.btn.primary:hover{
  background:#e8e8e8;
}

.btn.danger{
  color:#ff9aa4;
  border-color:#6d3439;
}

.btn.danger:hover{
  background:#2a1719;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}


/* =========================================================
   主體
========================================================= */

.wrap{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
}


/* =========================================================
   Banner
========================================================= */

.hero{
  padding:36px 0 30px;
}

.hero-banner{
  display:flex;
  justify-content:center;
}

.hero-banner img{
  width:min(650px,100%);
  height:auto;

  object-fit:contain;

  border-radius:22px;
  border:1px solid #34343b;

  box-shadow:
    0 20px 60px rgba(103,69,255,.18);
}


/* =========================================================
   搜尋工具列
========================================================= */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin:15px 0;
}

.search{
  flex:1;
  min-width:220px;

  background:#151518;
  color:#fff;

  border:1px solid #333;

  padding:11px 13px;

  border-radius:11px;

  outline:none;
}

.search:focus{
  border-color:#666;
}


/* =========================================================
   分類
========================================================= */

.tabs{
  display:flex;
  gap:8px;

  overflow:auto;

  padding-bottom:18px;

  scrollbar-width:thin;
}

.tab{
  white-space:nowrap;

  background:#19191d;
  color:#ddd;

  border:1px solid #38383e;

  padding:9px 13px;

  border-radius:999px;
}

.tab:hover{
  background:#242429;
}

.tab.active{
  background:#fff;
  color:#111;
  font-weight:800;
}


/* =========================================================
   商品標題
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:10px 0 18px;
}

.section-head h3{
  margin:0;
  font-size:24px;
}

.sort-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.sort-box label{
  color:#888;
  font-size:13px;
}

.sort-box select{
  background:#101014;
  color:#fff;
  border:1px solid #3b3b42;
  border-radius:9px;
  padding:8px 10px;
  outline:none;
}


.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}


/* =========================================================
   商品網格
   桌機固定 6 個一排
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(8,minmax(0,1fr));

  gap:14px;
}


/* =========================================================
   商品卡片
========================================================= */

.card{
  content-visibility:auto;
  contain-intrinsic-size: 360px 520px;
  background:#161619;

  border:1px solid #333;

  border-radius:16px;

  overflow:hidden;

  min-width:0;

  display:flex;
  flex-direction:column;

  height:100%;
}


/* =========================================================
   商品圖片區
   所有圖片固定高度
========================================================= */

.media{
  position:relative;
  background:#222;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#888;

  overflow:hidden;

  padding:14px;

  width:100%;

  height:210px;
  min-height:210px;
}

.media::before{
  content:"";
  position:absolute;
  inset:0;
  background:#17171b;
  z-index:0;
}

.media img{
  /* 所有商品使用完全一致的 4:3 顯示畫布 */
  position:relative;
  z-index:1;
  width:240px !important;
  height:180px !important;
  min-width:240px;
  min-height:180px;
  max-width:240px;
  max-height:180px;
  aspect-ratio:4 / 3;
  display:block;
  object-fit:contain;
  object-position:center center;
  margin:auto;
  background:transparent;
  transition:opacity .15s ease;
}



/* =========================================================
   商品內容
========================================================= */

.body{
  padding:12px;

  display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:18px 36px 80px 27px 22px auto;
  row-gap:0;

  flex:1;
  min-width:0;
  box-sizing:border-box;
}

/* 固定每一列文字的位置 */
.body > .badge{
  grid-row:1;
  grid-column:1;
}

.body > .name{
  grid-row:2;
  grid-column:1;
}

.body > .variant-summary{
  grid-row:3;
  grid-column:1;
}

.body > .price{
  grid-row:4;
  grid-column:1;
}

.body > .stock{
  grid-row:5;
  grid-column:1;
}

.body > .card-actions{
  grid-row:6;
  grid-column:1;
}

/* 顏色／庫存完整顯示：不裁切、不省略 */
.variant-summary{
  width:100%;
  height:80px;
  min-height:80px;
  box-sizing:border-box;

  display:flex;
  flex-direction:column;
  justify-content:flex-start;

  white-space:normal;
  overflow:visible;
  text-overflow:clip;
}

.variant-summary-row{
  display:grid;
  grid-template-columns:50px minmax(0,1fr) 50px 32px;
  align-items:center;

  width:100%;
  height:20px;
  min-height:20px;
  box-sizing:border-box;

  line-height:20px;
}

.variant-summary-label,
.variant-summary-stock-label{
  white-space:nowrap;
}

.variant-summary-color{
  min-width:0;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.variant-summary-stock{
  text-align:right;
  white-space:nowrap;
  padding-left:4px;
}

.name,
.price,
.stock{
  box-sizing:border-box;
}


/* =========================================================
   商品分類
========================================================= */

.badge{
  font-size:11px;
  color:#bbb;

  height:18px;
  min-height:18px;

  line-height:18px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   商品名稱
   統一兩行高度，讓所有商品文字對齊
========================================================= */

.name{
  font-size:13px;
  font-weight:800;

  margin-top:0;

  line-height:18px;

  height:36px;
  min-height:36px;

  overflow:hidden;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  white-space:normal;
  text-overflow:ellipsis;

  word-break:break-word;
}


/* =========================================================
   商品價格
========================================================= */

.price{
  font-size:18px;
  font-weight:900;

  margin-top:0;

  height:27px;
  min-height:27px;

  line-height:27px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   庫存
========================================================= */

.stock{
  margin-top:0;
  margin-top:0;

  color:var(--success);

  font-size:13px;

  height:22px;
  min-height:22px;

  line-height:22px;
}

.stock.soldout{
  margin-top:auto;
  color:var(--danger);

  font-weight:900;

  font-size:15px;

  height:22px;
  min-height:22px;

  line-height:22px;
}


/* =========================================================
   管理員商品按鈕
========================================================= */

.card-actions{
  display:flex;

  gap:8px;

  margin-top:12px;

  height:34px;
  min-height:34px;
}

.card-actions .btn{
  flex:1;
}


/* =========================================================
   空白
========================================================= */

.empty{
  grid-column:1/-1;

  color:#777;

  padding:40px 0;

  text-align:center;
}


/* =========================================================
   留言板
========================================================= */

.board{
  margin:55px 0;

  border-top:1px solid #333;

  padding-top:28px;
}

.board-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.board h3{
  margin:0;

  font-size:26px;
}

.discord-admin-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:9px 15px;
  border:1px solid #5865F2;
  border-radius:10px;
  color:#fff;
  background:#5865F2;
  text-decoration:none;
  font-weight:800;
  font-size:13px;
  transition:.2s ease;
  white-space:nowrap;
}

.discord-admin-link:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

.top-contact-link{
  padding:6px 10px;
  font-size:12px;
}

@media(max-width:700px){
  .board-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .discord-admin-link{
    width:100%;
  }
}

.board>p{
  color:#aaa;

  margin-top:6px;
}


/* =========================================================
   留言表單
========================================================= */

.board-form{
  display:grid;

  grid-template-columns:
    180px
    minmax(0,1fr)
    auto;

  gap:10px;

  margin:18px 0;
}

.board input,
.board textarea{
  background:#151518;

  color:#fff;

  border:1px solid #333;

  border-radius:11px;

  padding:11px;

  outline:none;
}

.board input:focus,
.board textarea:focus{
  border-color:#666;
}

.board textarea{
  min-height:44px;

  resize:vertical;
}


/* =========================================================
   留言列表
========================================================= */

.messages{
  display:grid;
  gap:12px;
}

.message{
  background:#151518;

  border:1px solid #333;

  border-radius:13px;

  padding:14px;
}


/* =========================================================
   留言上方
========================================================= */

.message-top{
  display:flex;

  justify-content:space-between;

  gap:12px;
}

.message-name{
  font-weight:800;

  font-size:16px;
}


/* 管理員看到的 Discord ID */

.message-discord-id{
  color:#777;

  font-size:11px;

  margin-top:4px;

  word-break:break-all;
}

.message-time{
  color:#777;

  font-size:11px;

  margin-top:4px;
}


/* =========================================================
   留言內容
========================================================= */

.message-text{
  margin-top:10px;

  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.6;
}


/* =========================================================
   管理員回覆
========================================================= */

.reply-box{
  margin-top:12px;

  margin-left:20px;

  padding:12px;

  background:#1b1b20;

  border-left:3px solid #fff;

  border-radius:8px;
}

.reply-label{
  font-size:12px;

  color:#aaa;

  margin-bottom:5px;
}

.reply-text{
  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.5;
}

.reply-time{
  color:#666;

  font-size:11px;

  margin-top:5px;
}


/* =========================================================
   管理員回覆輸入
========================================================= */

.admin-reply-form{
  display:flex;

  gap:8px;

  margin-top:12px;
}

.admin-reply-form input{
  flex:1;

  background:#101014;

  color:#fff;

  border:1px solid #3b3b42;

  border-radius:9px;

  padding:9px 10px;

  outline:none;
}


/* =========================================================
   說明文字
========================================================= */

.note{
  color:#777;

  font-size:12px;

  margin-top:10px;

  line-height:1.6;
}


/* =========================================================
   Dialog
========================================================= */

dialog{
  width:min(520px,calc(100% - 28px));

  border:1px solid #3d3d44;

  border-radius:16px;

  background:#17171b;

  color:#fff;

  padding:0;

  box-shadow:
    0 24px 80px #0009;
}

dialog::backdrop{
  background:#000b;
}

.dialog-wrap{
  padding:20px;
}

.dialog-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:16px;
}

.dialog-head h3{
  margin:0;

  font-size:21px;
}

.icon-btn{
  background:transparent;

  border:0;

  color:#aaa;

  font-size:24px;

  line-height:1;
}


/* =========================================================
   商品表單
========================================================= */

.form{
  display:grid;

  gap:12px;
}

.form label{
  display:grid;

  gap:6px;

  color:#cfcfd4;

  font-size:13px;
}

.form input,
.form select{
  width:100%;

  background:#101014;

  color:#fff;

  border:1px solid #3b3b42;

  border-radius:10px;

  padding:11px 12px;

  outline:none;
}

.form input:focus,
.form select:focus{
  border-color:#666;
}


/* =========================================================
   Dialog 按鈕
========================================================= */

.dialog-actions{
  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:16px;
}


/* =========================================================
   圖片預覽
========================================================= */

.preview{
  width:100%;
  min-height:170px;
  max-height:220px;
  border:1px dashed #444;
  border-radius:12px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
  gap:10px;
  align-content:start;
  color:#777;
  overflow:auto;
  background:#111;
}

.preview-item{
  position:relative;
  aspect-ratio:4/3;
  min-width:0;
  border:1px solid #333;
  border-radius:8px;
  overflow:hidden;
  background:#17171b;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.preview-remove{
  position:absolute;
  top:4px;
  right:4px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:#fff;
  cursor:pointer;
  font-size:16px;
  line-height:24px;
  padding:0;
}

.preview-index{
  position:absolute;
  left:5px;
  bottom:5px;
  padding:2px 6px;
  border-radius:10px;
  background:rgba(0,0,0,.65);
  color:#fff;
  font-size:11px;
}

.image-switch-btn{
  position:absolute;
  top:7px;
  left:7px;
  z-index:4;
  min-width:42px;
  height:30px;
  padding:4px 9px;
  border:1px solid rgba(255,255,255,.28);
  border-radius:14px;
  background:rgba(0,0,0,.68);
  color:#fff;
  font-size:12px;
  line-height:20px;
  cursor:pointer;
  backdrop-filter:blur(3px);
}

.image-switch-btn:hover{
  background:rgba(0,0,0,.84);
}

.image-switch-btn:active{
  transform:scale(.96);
}

.image-error{
  width:100%;
  height:100%;
  display:grid;
  place-items:center;
  color:#777;
  font-size:14px;
  background:#111;
}


/* =========================================================
   Toast
========================================================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:100;

  background:#fff;

  color:#111;

  padding:11px 14px;

  border-radius:10px;

  box-shadow:
    0 12px 40px #0008;

  font-weight:700;
}


/* =========================================================
   RWD
========================================================= */

/* 1200 以下 */
@media(max-width:1200px){

  .grid{
    grid-template-columns:
      repeat(5,1fr);
  }

}


/* 1000 以下 */
@media(max-width:1000px){

  .grid{
    grid-template-columns:
      repeat(4,1fr);
  }

  .board-form{
    grid-template-columns:
      1fr 1fr;
  }

}


/* 800 以下 */
@media(max-width:800px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .board-form{
    grid-template-columns:
      1fr;
  }

}


/* 600 以下 */
@media(max-width:600px){

  .grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .brand small{
    display:none;
  }

  .topbar{
    padding:12px 14px;
  }

  .admin-reply-form{
    flex-direction:column;
  }

  .media{
    height:190px;
    min-height:190px;
  }

  .media img{
    width:100%;
    min-width:0;
    max-width:240px;
    height:160px;
  }

}


/* 400 以下 */
@media(max-width:400px){

  .grid{
    grid-template-columns:
      1fr;
  }

}

/* =========================================================
   顏色 / 庫存變體
========================================================= */
.variant-list{
  display:grid;
  gap:8px;
}
.variant-row{
  display:grid;
  grid-template-columns:1fr 100px auto;
  gap:8px;
  align-items:center;
}
.variant-row input{
  min-width:0;
}
.variant-total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 12px;
  background:#101014;
  border:1px solid #3b3b42;
  border-radius:10px;
  font-weight:800;
}
.variant-total strong{
  color:var(--success);
}
.variant-summary{
  width:100%;
  min-height:0;
  max-height:none;
  height:auto;
  overflow:visible;
  margin-top:8px;
  color:#aaa;
  font-size:12px;
  line-height:20px;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
}

.variant-summary-row{
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:start;
  width:100%;
  min-height:20px;
  box-sizing:border-box;
  text-align:left;
}

.variant-summary-label{
  white-space:nowrap;
  text-align:left;
}

.variant-summary-color{
  min-width:0;
  overflow:visible;
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;
  text-align:left;
  padding-left:4px;
}

.variant-summary-stock-label{
  white-space:nowrap;
  padding-left:10px;
  text-align:left;
}

.variant-summary-stock{
  text-align:left;
  white-space:nowrap;
  padding-left:4px;
}
@media(max-width:600px){
  .variant-row{
    grid-template-columns:1fr 100px auto;
  }
  .variant-row .variant-stock{
    width:100%;
  }
  .variant-row .variant-remove{
    width:100%;
  }
}

</style>
</head>


<body>


<!-- ========================================================
     頂部
========================================================= -->

<header class="topbar">

  <div class="brand">

    <div class="logo">
      O²
    </div>

    <div>

      <h1>
        O² M★STAR交易區
      </h1>

      <div class="brand-meta">
        <small>
          販售・收購・交流
        </small>

        <a
          class="discord-admin-link top-contact-link"
          href="https://discord.com/users/621734178228273155"
          target="_blank"
          rel="noopener noreferrer"
        >
          聯絡管理員
        </a>
      </div>

    </div>

  </div>


  <button
    id="adminBtn"
    class="btn"
  >
    管理員登入
  </button>

</header>


<main class="wrap">


<!-- ========================================================
     Banner
========================================================= -->

<section class="hero">

  <div class="hero-banner">

    <img
      src="ostar-logo.PNG"
      alt="O² M★STAR交易區"
    >

  </div>

</section>


<!-- ========================================================
     搜尋
========================================================= -->

<section class="toolbar">

  <input
    id="searchInput"
    class="search"
    placeholder="搜尋商品名稱…"
  >

  <button
    id="addBtn"
    class="btn primary hidden"
  >
    ＋ 新增商品
  </button>

</section>


<!-- ========================================================

/* =========================================================
   商品圖片標準化

   - 商品主體統一縮放到相近視覺尺寸
   - 舊商品也會在前台顯示時自動標準化
========================================================= */

const NORMAL_IMAGE_WIDTH = 600;
const NORMAL_IMAGE_HEIGHT = 450;
const NORMAL_OBJECT_WIDTH = 480;
const NORMAL_OBJECT_HEIGHT = 360;

const PRODUCT_PERFORMANCE = {
  lazyImages: true,
  batchDom: true,
  webpQuality: 0.82
};

function loadImageFromDataURL(src){

  return new Promise((resolve,reject)=>{

    const img = new Image();

    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;

  });

}

function getPixel(data, width, x, y){
  x = Math.max(0, Math.min(width - 1, x));
  y = Math.max(0, Math.min(data.length / 4 / width - 1, y));
  const i = (Math.floor(y) * width + Math.floor(x)) * 4;
  return [data[i], data[i + 1], data[i + 2], data[i + 3]];
}

function colorDistance(a, b){
  return Math.sqrt(
    Math.pow(a[0] - b[0], 2) +
    Math.pow(a[1] - b[1], 2) +
    Math.pow(a[2] - b[2], 2)
  );
}

/*
  自動去背：從圖片四周開始做 flood-fill。
  只有「從邊緣連通」且與背景顏色相近的像素才會被設為透明，
  因此不會把商品內部相同顏色的小區塊整片誤刪。
*/
function removeEdgeBackground(canvas, threshold = 48){
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const w = canvas.width;
  const h = canvas.height;
  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const visited = new Uint8Array(w * h);
  const queue = [];

  const seeds = [
    [0, 0], [w - 1, 0], [0, h - 1], [w - 1, h - 1]
  ];

  seeds.forEach(([x,y]) => {
    const i = y * w + x;
    if(!visited[i]){
      visited[i] = 1;
      queue.push([x,y,data[i*4],data[i*4+1],data[i*4+2]]);
    }
  });

  let head = 0;
  while(head < queue.length){
    const [x,y,sr,sg,sb] = queue[head++];
    const idx = y * w + x;
    const di = idx * 4;

    if(data[di + 3] < 18) continue;

    const pixel = [data[di], data[di+1], data[di+2]];
    const distance = Math.sqrt(
      Math.pow(pixel[0] - sr, 2) +
      Math.pow(pixel[1] - sg, 2) +
      Math.pow(pixel[2] - sb, 2)
    );

    if(distance > threshold) continue;

    data[di + 3] = 0;

    const neighbors = [
      [x-1,y], [x+1,y], [x,y-1], [x,y+1]
    ];

    for(const [nx,ny] of neighbors){
      if(nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const ni = ny * w + nx;
      if(visited[ni]) continue;
      visited[ni] = 1;
      const n4 = ni * 4;
      queue.push([nx,ny,data[n4],data[n4+1],data[n4+2]]);
    }
  }

  ctx.putImageData(imageData, 0, 0);
}

function getAlphaBounds(canvas){
  const ctx = canvas.getContext('2d', {willReadFrequently:true});
  const {data} = ctx.getImageData(0,0,canvas.width,canvas.height);
  let minX = canvas.width, minY = canvas.height;
  let maxX = -1, maxY = -1;

  for(let y=0; y<canvas.height; y++){
    for(let x=0; x<canvas.width; x++){
      const a = data[(y * canvas.width + x) * 4 + 3];
      if(a > 18){
        if(x < minX) minX = x;
        if(y < minY) minY = y;
        if(x > maxX) maxX = x;
        if(y > maxY) maxY = y;
      }
    }
  }

  if(maxX < 0){
    return {x:0,y:0,width:canvas.width,height:canvas.height};
  }

  return {
    x:minX,
    y:minY,
    width:maxX-minX+1,
    height:maxY-minY+1
  };
}

function cropCanvas(canvas, bounds, padding = 0.015){
  const padX = Math.round(bounds.width * padding);
  const padY = Math.round(bounds.height * padding);
  const x = Math.max(0, bounds.x - padX);
  const y = Math.max(0, bounds.y - padY);
  const right = Math.min(canvas.width, bounds.x + bounds.width + padX);
  const bottom = Math.min(canvas.height, bounds.y + bounds.height + padY);

  const out = document.createElement('canvas');
  out.width = Math.max(1, right - x);
  out.height = Math.max(1, bottom - y);
  out.getContext('2d').drawImage(
    canvas,
    x,y,out.width,out.height,
    0,0,out.width,out.height
  );
  return out;
}

function normalizeImageDataURL(src){
  return loadImageFromDataURL(src).then(img=>{
    /*
      安全圖片標準化：
      不再做兩次自動去背，避免某些商品被誤判成背景後整張變透明。
      保留原始圖片內容，只縮放到 600 × 450 的固定畫布。
    */
    const output = document.createElement('canvas');
    output.width = NORMAL_IMAGE_WIDTH;
    output.height = NORMAL_IMAGE_HEIGHT;

    const ctx = output.getContext('2d');
    ctx.clearRect(0, 0, output.width, output.height);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const scale = Math.min(
      output.width / img.naturalWidth,
      output.height / img.naturalHeight
    );

    const drawWidth = Math.max(1, Math.round(img.naturalWidth * scale));
    const drawHeight = Math.max(1, Math.round(img.naturalHeight * scale));
    const dx = Math.round((output.width - drawWidth) / 2);
    const dy = Math.round((output.height - drawHeight) / 2);

    ctx.drawImage(
      img,
      0, 0, img.naturalWidth, img.naturalHeight,
      dx, dy, drawWidth, drawHeight
    );

    /*
      檢查輸出是否真的有可見內容。
      若整張變成透明，直接回傳原始圖片，絕不儲存空白圖片。
    */
    const pixels = ctx.getImageData(0, 0, output.width, output.height).data;
    let visiblePixels = 0;
    for(let i = 3; i < pixels.length; i += 4){
      if(pixels[i] > 18){
        visiblePixels++;
        if(visiblePixels >= 20) break;
      }
    }

    if(visiblePixels < 20){
      return src;
    }

    /* 優先 WebP；失敗則 PNG。 */
    try{
      const webp = output.toDataURL('image/webp', 0.82);
      if(webp.startsWith('data:image/webp')) return webp;
    }catch(error){
      console.warn('WebP 產生失敗，改用 PNG', error);
    }

    return output.toDataURL('image/png');
  });
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = async () => {
      try{
        const normalized = await normalizeImageDataURL(reader.result);
        resolve(normalized);
      }catch(error){
        reject(error);
      }
    };
    reader.readAsDataURL(file);
  });
}

    String(product?.price ?? "")
      .replace(/[^0-9.]/g, "");

  const price =
    Number(value);

  return Number.isFinite(price)

      .value
      .trim()
      .toLowerCase();

        const categoryMatch =
          product.category ===

          (product.name || "")
            .toLowerCase()
            .includes(
              keyword
            );


        return (
          categoryMatch &&
          nameMatch
        );

      }
    )
    .sort(
      (a, b) => {

        const priceA =
          getProductPrice(a);

        const priceB =
          getProductPrice(b);

          "priceDesc";

        );

/* =========================================================
   開啟商品新增 / 編輯視窗
========================================================= */

function createVariantRow(variant = {}){

  const row = document.createElement("div");
  row.className = "variant-row";

  const colorInput = document.createElement("input");
  colorInput.className = "variant-color";
  colorInput.maxLength = 30;
  colorInput.placeholder = "顏色，例如：黑色";
  colorInput.value = variant.color || "";

  const stockInput = document.createElement("input");
  stockInput.className = "variant-stock";
  stockInput.type = "number";
  stockInput.min = "0";
  stockInput.step = "1";
  stockInput.placeholder = "庫存";
  stockInput.value = Number(variant.stock ?? 0);

  const removeButton = document.createElement("button");
  removeButton.className = "btn small danger variant-remove";
  removeButton.type = "button";
  removeButton.textContent = "刪除";
  removeButton.onclick = () => {
    row.remove();
    updateVariantTotal();
    ensureOneVariantRow();
  };

  [colorInput, stockInput].forEach(input => {
    input.addEventListener("input", updateVariantTotal);
  });

  row.append(
    colorInput,
    stockInput,
    removeButton
  );

  return row;
}

function updateVariantTotal(){

  const total = $$(".variant-stock")
    .reduce(
      (sum, input) =>
        sum + Math.max(0, parseInt(input.value, 10) || 0),
      0
    );

  $("#variantTotal").textContent = total;
}

function ensureOneVariantRow(){

  const list = $("#variantList");

  if(!list.children.length){
    list.appendChild(createVariantRow());
  }

  updateVariantTotal();
}

function getVariantsFromForm(){

  return $$("#variantList .variant-row")
    .map(row => ({
      color: row.querySelector(".variant-color").value.trim(),
      stock: Math.max(0, parseInt(
        row.querySelector(".variant-stock").value,
        10
      ) || 0)
    }));
}

function setVariantsInForm(variants){

  const list = $("#variantList");
  list.innerHTML = "";

  const source =
    Array.isArray(variants) && variants.length
      ? variants
      : [{ color: "", stock: 0 }];

  source.forEach(variant => {
    list.appendChild(createVariantRow(variant));
  });

  updateVariantTotal();
}

$("#addVariantBtn").addEventListener("click", () => {
  $("#variantList").appendChild(createVariantRow());
  updateVariantTotal();
});

function openProductDialog(
  product = null
){

  $("#productForm")
    .reset();


  $("#productId")
    .value =
      product?.id ||
      "";


  $("#productDialogTitle")
    .textContent =
      product
        ? "編輯商品"
        : "新增商品";


  $("#productCategory")
    .value =
      product?.category ||
      currentCategory;


  $("#productName")
    .value =
      product?.name ||
      "";


  $("#productPrice")
    .value =
      product?.price ||
      "";


  setVariantsInForm(
    product?.variants?.length
      ? product.variants
      : [{
          color: "",
          stock: Number(product?.stock ?? 0)
        }]
  );


  editingImages = Array.isArray(product?.images)
    ? product.images.filter(Boolean)
    : (product?.image ? [product.image] : []);

  pendingImageData = [];
  pendingImagePromises = [];
  selectedImageItems = editingImages.map(src => ({
    src,
    existing: true
  }));

  $("#productImage").value = "";
  renderImagePreview();

  $("#productDialog")
    .showModal();

}


/* =========================================================
   商品圖片預覽
========================================================= */

$("#productImage")
.addEventListener(
  "change",
  async event => {

    const files = Array.from(event.target.files || []);

    if(!files.length){
      return;
    }

    const remaining = 6 - selectedImageItems.length;

    if(remaining <= 0){
      toast("最多只能使用 6 張商品圖片");
      event.target.value = "";
      return;
    }

    const filesToAdd = files.slice(0, remaining);

    if(files.length > remaining){
      toast(`最多 6 張圖片，已加入前 ${remaining} 張`);
    }

    const newItems = filesToAdd.map(file => ({
      file,
      src: URL.createObjectURL(file),
      originalSrc: URL.createObjectURL(file),
      processing: true,
      existing: false
    }));

    selectedImageItems.push(...newItems);
    renderImagePreview();

    /* 背景處理所有新圖片，不影響原始預覽。 */
    await Promise.all(newItems.map(async item => {
      try{
        const normalized = await compressImage(item.file);
        item.processed = normalized;
      }catch(error){
        console.warn("圖片標準化失敗，儲存時改用原始圖片：", error);
        item.processed = null;
      }finally{
        item.processing = false;
      }
    }));

    renderImagePreview();
    event.target.value = "";
  }
);


function renderImagePreview(){
  const preview = $("#imagePreview");
  preview.innerHTML = "";

  if(!selectedImageItems.length){
    preview.textContent = "尚未選擇圖片";
    return;
  }

  selectedImageItems.forEach((item, index) => {
    const box = document.createElement("div");
    box.className = "preview-item";

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = `商品圖片 ${index + 1}`;
    img.loading = "lazy";

    img.onerror = () => {
      box.innerHTML = `<div style="display:grid;place-items:center;width:100%;height:100%;color:#888;font-size:12px;text-align:center">圖片無法預覽</div>`;
    };

    box.appendChild(img);

    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "preview-remove";
    remove.textContent = "×";
    remove.title = "移除這張圖片";
    remove.addEventListener("click", () => {
      const removed = selectedImageItems.splice(index, 1)[0];
      if(removed?.originalSrc){
        URL.revokeObjectURL(removed.originalSrc);
      }
      if(removed?.src && removed.src.startsWith("blob:")){
        URL.revokeObjectURL(removed.src);
      }
      renderImagePreview();
    });
    box.appendChild(remove);

    const label = document.createElement("span");
    label.className = "preview-index";
    label.textContent = item.processing ? `${index + 1} 處理中…` : `${index + 1}${index === 0 ? " 主圖" : ""}`;
    box.appendChild(label);

    preview.appendChild(box);
  });
}

/* =========================================================
   儲存商品
========================================================= */

$("#productForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(
      !isAdmin()
    ){

      toast(
        "只有管理員可以管理商品"
      );

      return;

    }


    const id =
      $("#productId")
        .value;


    try{

      /* 等待所有新圖片處理完成，再建立 images 陣列。 */
      const images = [];

      for(const item of selectedImageItems){
        if(item.processing && item.file){
          try{
            item.processed = await compressImage(item.file);
          }catch(error){
            console.warn("圖片標準化失敗，改用原始圖片：", error);
          }
          item.processing = false;
        }

        if(item.processed){
          images.push(item.processed);
        }else if(item.file){
          const original = await new Promise((resolve,reject)=>{
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(item.file);
          });
          images.push(original);
        }else if(item.src){
          images.push(item.src);
        }
      }


      const variants =
        getVariantsFromForm();

      const stock =
        variants.reduce(
          (sum, variant) =>
            sum + variant.stock,
          0
        );


      const payload = {

        category:
          $("#productCategory")
            .value,

        name:
          $("#productName")
            .value
            .trim(),

        price:
          $("#productPrice")
            .value
            .trim(),

        stock:
          stock,

        variants:
          variants,

        /* 新格式：多張圖片 */
        images: images,

        /* 舊格式相容：第一張仍放在 image */
        image: images[0] || "",

        updatedAt:
          serverTimestamp()

      };


      /* 編輯 */

      if(id){

        await updateDoc(
          doc(
            db,
            "products",
            id
          ),
          payload
        );


        toast(
          "商品已更新"
        );

      }


      /* 新增 */

      else{

        payload.createdAt =
          serverTimestamp();


        await addDoc(
          collection(
            db,
            "products"
          ),
          payload
        );


        toast(
          "商品已新增"
        );

      }


      $("#productDialog")
        .close();

    }
    catch(error){

      console.error(
        error
      );


      toast(
        "商品儲存失敗"
      );

    }

  }
);
