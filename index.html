<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
  --success:#8cffb0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  background:radial-gradient(circle at 50% 0%,#15151a 0%,var(--bg) 42%);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* 頂部 */
.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 5vw;
  background:#0a0a0bf2;
  border-bottom:1px solid #333;
  backdrop-filter:blur(10px);
}
.brand{display:flex;gap:12px;align-items:center}
.logo{
  width:44px;height:44px;border:1px solid #fff;border-radius:50%;
  display:grid;place-items:center;font-weight:900;
}
.brand h1{margin:0;font-size:20px}
.brand-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand small{color:#aaa}

/* 通用按鈕 */
.btn{
  border:1px solid #3a3a40;background:#1b1b1f;color:#fff;
  padding:10px 14px;border-radius:11px;transition:.15s;
}
.btn:hover{background:#27272c}
.btn:active{transform:scale(.98)}
.btn.primary{background:#fff;color:#111;font-weight:800}
.btn.primary:hover{background:#e8e8e8}
.btn.danger{color:#ff9aa4;border-color:#6d3439}
.btn.small{padding:7px 10px;font-size:13px}

/* 主體 */
.wrap{width:min(1500px,calc(100% - 32px));margin:auto}
.hero{padding:36px 0 30px}
.hero-banner{display:flex;justify-content:center}
.hero-banner img{
  width:min(650px,100%);height:auto;object-fit:contain;
  border-radius:22px;border:1px solid #34343b;
  box-shadow:0 20px 60px rgba(103,69,255,.18);
}

/* 搜尋 */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.search{
  flex:1;min-width:220px;background:#151518;color:#fff;
  border:1px solid #333;padding:11px 13px;border-radius:11px;outline:none;
}
.search:focus{border-color:#666}

/* =========================================================
   風格 3：霓虹線框分類
========================================================= */
.tabs{
  display:flex;
  gap:10px;
  overflow:auto;
  padding:8px 4px 20px;
  scrollbar-width:thin;
}

.tab{
  position:relative;
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  background:#111216;
  color:#eee;
  border:1.5px solid var(--neon,#777);
  padding:9px 16px 9px 11px;
  border-radius:999px;
  font-size:15px;
  line-height:1;
  min-height:46px;
  cursor:pointer;
  box-shadow:
    0 0 5px var(--neon,#777),
    inset 0 0 10px rgba(255,255,255,.025);
  transition:.18s ease;
}
.tab::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius:999px;
  pointer-events:none;
  box-shadow:0 0 14px var(--neon,#777);
  opacity:.25;
}
.tab:hover{
  transform:translateY(-2px);
  background:#191a20;
  box-shadow:
    0 0 8px var(--neon,#777),
    0 0 22px var(--neon,#777),
    inset 0 0 12px rgba(255,255,255,.04);
}
.tab.active{
  background:#17181e;
  color:#fff;
  border-color:var(--neon,#fff);
  box-shadow:
    0 0 8px var(--neon,#fff),
    0 0 26px var(--neon,#fff),
    inset 0 0 12px rgba(255,255,255,.06);
}
.tab > span:last-child{font-weight:800}
.tab-icon{
  width:31px;height:31px;min-width:31px;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:21px;line-height:1;
  color:var(--neon,#fff);
  filter:drop-shadow(0 0 5px var(--neon,#fff));
}
.tab-icon svg{
  width:30px;height:30px;display:block;
  stroke:currentColor;
}
.tab-icon.badge{
  width:32px;min-width:32px;height:32px;
  font-size:10px;font-weight:900;color:#fff;
  background:#ff2438;border-radius:50%;
  transform:rotate(-7deg);
  box-shadow:0 0 8px #ff2438,0 0 16px #ff2438;
  filter:none;
}
.tab-icon.sale{
  width:32px;min-width:32px;height:32px;
  background:#ffc400;color:#111;border-radius:50%;
  transform:rotate(-7deg);
  font-size:9px;font-weight:900;
  box-shadow:0 0 8px #ffc400,0 0 16px #ffc400;
  filter:none;
}
.neon-red{--neon:#ff304f}
.neon-orange{--neon:#ff9d2e}
.neon-green{--neon:#35ff62}
.neon-cyan{--neon:#20eaff}
.neon-pink{--neon:#ff3fa8}
.neon-purple{--neon:#a85cff}
.neon-blue{--neon:#328cff}
.neon-yellow{--neon:#ffe22e}

@media(max-width:700px){
  .tab{font-size:14px;min-height:42px;padding-right:13px}
  .tab-icon{width:28px;min-width:28px;height:28px}
}

/* 商品標題 */
.section-head{
  display:flex;justify-content:space-between;align-items:end;
  margin:10px 0 18px;
}
.section-head h3{margin:0;font-size:24px}
.sort-box{display:flex;align-items:center;gap:8px}
.sort-box label{color:#888;font-size:13px}
.sort-box select{
  background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:9px;padding:8px 10px;outline:none;
}
.count{color:#888;font-size:13px;margin-top:5px}

/* 商品 */
.grid{
  display:grid;
  grid-template-columns:repeat(8,minmax(0,1fr));
  gap:14px;
}
.card{
  background:#161619;border:1px solid #333;border-radius:16px;
  overflow:hidden;min-width:0;display:flex;flex-direction:column;
}
.media{
  position:relative;background:#222;display:flex;
  justify-content:center;align-items:center;overflow:hidden;
  width:100%;height:210px;min-height:210px;padding:14px;
}
.media::before{
  content:"";position:absolute;inset:0;background:#17171b;z-index:0;
}
.media img{
  position:relative;z-index:1;width:240px!important;height:180px!important;
  min-width:240px;min-height:180px;max-width:240px;max-height:180px;
  aspect-ratio:4/3;display:block;object-fit:contain;
}
.body{
  padding:12px;display:grid;
  grid-template-rows:18px 36px 40px 27px 22px auto;
  row-gap:0;flex:1;min-width:0;
}
.badge-text{
  font-size:11px;color:#bbb;height:18px;line-height:18px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.name{
  font-size:13px;font-weight:800;line-height:18px;height:36px;
  overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;
  -webkit-line-clamp:2;word-break:break-word;
}
.price{
  font-size:18px;font-weight:900;height:27px;line-height:27px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.stock{color:var(--success);font-size:13px;height:22px;line-height:22px}
.stock.soldout{color:var(--danger);font-weight:900;font-size:15px}
.variant-summary{width:100%;height:40px;display:flex;align-items:center;overflow:hidden}
.variant-summary-row{
  display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px;
  align-items:center;width:100%;height:36px;
}
.variant-summary-label{font-size:10px;white-space:nowrap}
.variant-summary-select{
  width:100%;height:32px;min-width:0;padding:4px 14px 4px 7px;
  border:1px solid #666;border-radius:9px;background:#111216;color:#fff;
  font-size:10px;letter-spacing:-.2px;
}
.card-actions{display:flex;gap:8px;margin-top:12px}
.card-actions .btn{flex:1}
.empty{grid-column:1/-1;color:#777;padding:40px 0;text-align:center}

/* 留言板 */
.board{margin:55px 0;border-top:1px solid #333;padding-top:28px}
.board-title{display:flex;align-items:center;justify-content:space-between;gap:16px}
.board h3{margin:0;font-size:26px}
.board>p{color:#aaa;margin-top:6px}
.discord-admin-link{
  display:inline-flex;align-items:center;justify-content:center;
  padding:9px 15px;border:1px solid #5865F2;border-radius:10px;
  color:#fff;background:#5865F2;text-decoration:none;font-weight:800;font-size:13px;
}
.top-contact-link{padding:6px 10px;font-size:12px}
.board-form{
  display:grid;grid-template-columns:180px minmax(0,1fr) auto;
  gap:10px;margin:18px 0;
}
.board input,.board textarea{
  background:#151518;color:#fff;border:1px solid #333;
  border-radius:11px;padding:11px;outline:none;
}
.board textarea{min-height:44px;resize:vertical}
.messages{display:grid;gap:12px}
.message{background:#151518;border:1px solid #333;border-radius:13px;padding:14px}
.message-top{display:flex;justify-content:space-between;gap:12px}
.message-name{font-weight:800;font-size:16px}
.message-time{color:#777;font-size:11px;margin-top:4px}
.message-text{margin-top:10px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.reply-box{
  margin-top:12px;margin-left:20px;padding:12px;background:#1b1b20;
  border-left:3px solid #fff;border-radius:8px;
}
.reply-label{font-size:12px;color:#aaa;margin-bottom:5px}
.reply-text{white-space:pre-wrap;word-break:break-word;line-height:1.5}
.reply-time{color:#666;font-size:11px;margin-top:5px}
.admin-reply-form{display:flex;gap:8px;margin-top:12px}
.admin-reply-form input{flex:1}
.note{color:#777;font-size:12px;margin-top:10px;line-height:1.6}

/* Dialog */
dialog{
  width:min(520px,calc(100% - 28px));border:1px solid #3d3d44;
  border-radius:16px;background:#17171b;color:#fff;padding:0;
  box-shadow:0 24px 80px #0009;
}
dialog::backdrop{background:#000b}
.dialog-wrap{padding:20px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dialog-head h3{margin:0;font-size:21px}
.icon-btn{background:transparent;border:0;color:#aaa;font-size:24px;line-height:1}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;color:#cfcfd4;font-size:13px}
.form input,.form select{
  width:100%;background:#101014;color:#fff;border:1px solid #3b3b42;
  border-radius:10px;padding:11px 12px;outline:none;
}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.preview{
  width:100%;min-height:170px;max-height:220px;border:1px dashed #444;
  border-radius:12px;padding:10px;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;
  align-content:start;color:#777;overflow:auto;background:#111;
}
.preview-item{position:relative;aspect-ratio:4/3;border:1px solid #333;border-radius:8px;overflow:hidden;background:#17171b}
.preview-item img{width:100%;height:100%;object-fit:contain;display:block}
.preview-remove{
  position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;
  border-radius:50%;background:#000c;color:#fff;font-size:16px;line-height:24px;padding:0;
}
.preview-index{
  position:absolute;left:5px;bottom:5px;padding:2px 6px;border-radius:10px;
  background:#000a;color:#fff;font-size:11px;
}
.variant-list{display:grid;gap:8px}
.variant-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 80px minmax(105px,1fr) auto;
  gap:7px;
  align-items:center;
}
.variant-row input,.variant-row select{
  width:100%;min-width:0;background:#101014;color:#fff;
  border:1px solid #3b3b42;border-radius:9px;padding:9px 10px;
}
.variant-remove{height:38px}
.variant-total{
  display:flex;justify-content:space-between;padding:8px 10px;
  background:#101014;border-radius:9px;border:1px solid #2f2f35;
}
.variant-total strong{color:#fff}
.variant-summary-note{font-size:11px;color:#777;line-height:1.5;margin-top:7px}
.toast{
  position:fixed;right:18px;bottom:18px;z-index:100;
  background:#fff;color:#111;padding:12px 15px;border-radius:11px;
  box-shadow:0 12px 40px #0008;font-weight:800;
}

/* RWD */
@media(max-width:1200px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){
  .topbar{padding:12px 16px}
  .brand h1{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .board-form{grid-template-columns:1fr}
  .variant-row{grid-template-columns:minmax(0,1fr) 72px minmax(105px,1fr) auto}
}
</style>
</head>

<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">O²</div>
    <div>
      <h1>O² M★STAR交易區</h1>
      <div class="brand-meta">
        <small>販售・收購・交流</small>
        <a class="discord-admin-link top-contact-link"
           href="https://discord.com/users/621734178228273155"
           target="_blank" rel="noopener noreferrer">聯絡管理員</a>
      </div>
    </div>
  </div>
  <button id="adminBtn" class="btn">管理員登入</button>
</header>

<main class="wrap">

<section class="hero">
  <div class="hero-banner">
    <img src="ostar-logo.PNG" alt="O² M★STAR交易區">
  </div>
</section>

<section class="toolbar">
  <input id="searchInput" class="search" placeholder="搜尋商品名稱…">
  <button id="addBtn" class="btn primary hidden">＋ 新增商品</button>
</section>

<!-- 風格 3：霓虹分類列 -->
<nav id="tabs" class="tabs">

  <button class="tab neon-red active" data-category="新家具" aria-label="新家具">
    <span class="tab-icon badge">NEW</span><span>新家具</span>
  </button>

  <button class="tab neon-orange" data-category="家具" aria-label="家具">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M9 25v-6c0-5 4-9 9-9h12c5 0 9 4 9 9v6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M7 25h34v8H7z" fill="currentColor"/>
        <path d="M10 33v6M38 33v6" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </span><span>家具</span>
  </button>

  <button class="tab neon-green" data-category="花盆" aria-label="花盆">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 22c-5-7-13-6-15-1 6 4 10 4 15 1Z" fill="currentColor"/>
        <path d="M24 22c5-7 13-6 15-1-6 4-10 4-15 1Z" fill="currentColor"/>
        <path d="M24 22v-9" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M13 27h22l-3 12H16l-3-12Z" stroke="currentColor" stroke-width="3"/>
      </svg>
    </span><span>花盆</span>
  </button>

  <button class="tab neon-cyan" data-category="戒指限男" aria-label="戒指限男">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="27" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M24 6l5 7-5 7-5-7 5-7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
      </svg>
    </span><span>戒指限男</span>
  </button>

  <!-- 戒指限女：已改為「戒指」圖示，不再使用愛心 -->
  <button class="tab neon-pink" data-category="戒指限女" aria-label="戒指限女">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <circle cx="24" cy="27" r="11" stroke="currentColor" stroke-width="4"/>
        <path d="M24 6l5 7-5 7-5-7 5-7Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="24" cy="13" r="2" fill="currentColor"/>
      </svg>
    </span><span>戒指限女</span>
  </button>

  <button class="tab neon-purple" data-category="作物限男" aria-label="作物限男">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 39V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 28c-10 1-14-4-14-10 8-1 14 2 14 10Z" fill="currentColor"/>
        <path d="M24 24c10 1 14-4 14-10-8-1-14 2-14 10Z" fill="currentColor"/>
      </svg>
    </span><span>作物限男</span>
  </button>

  <button class="tab neon-blue" data-category="作物限女" aria-label="作物限女">
    <span class="tab-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none">
        <path d="M24 40V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M24 27c-9 0-13-5-13-11 8 0 13 3 13 11Z" fill="currentColor"/>
        <path d="M24 34c9 0 13-5 13-11-8 0-13 3-13 11Z" fill="currentColor"/>
        <path d="M24 21c0-6 3-10 8-12 1 6-1 10-8 12Z" fill="currentColor"/>
      </svg>
    </span><span>作物限女</span>
  </button>

  <button class="tab neon-yellow" data-category="出清區" aria-label="出清區">
    <span class="tab-icon sale">SALE</span><span>出清區</span>
  </button>

</nav>

<section class="section-head">
  <div>
    <h3 id="sectionTitle">新家具</h3>
    <div id="productCount" class="count">0 件商品</div>
  </div>
  <div class="sort-box">
    <label for="productSort">金額排序</label>
    <select id="productSort">
      <option value="priceDesc" selected>金額：高到低</option>
      <option value="priceAsc">金額：低到高</option>
    </select>
  </div>
</section>

<section id="productGrid" class="grid">
  <div class="empty">讀取商品中…</div>
</section>

<section class="board">
  <div class="board-title"><h3>留言板</h3></div>
  <p>想詢問商品可以在這裡留言，管理員看到後會直接在留言下方回覆。</p>
  <form id="messageForm" class="board-form">
    <input id="messageName" maxlength="30" placeholder="暱稱" required>
    <textarea id="messageText" maxlength="300" placeholder="留言內容" required></textarea>
    <button class="btn primary" type="submit">送出留言</button>
  </form>
  <div id="messages" class="messages"></div>
  <div class="note">請填寫你希望顯示在留言區的暱稱。</div>
</section>

</main>

<!-- 管理員登入 -->
<dialog id="loginDialog">
  <div class="dialog-wrap">
    <div class="dialog-head">
      <h3>管理員登入</h3>
      <button class="icon-btn" type="button" data-close="loginDialog">×</button>
    </div>
    <form id="loginForm" class="form">
      <label>Email<input id="loginEmail" type="email" autocomplete="username" required></label>
      <label>密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label>
      <div class="dialog-actions">
        <button class="btn" type="button" data-close="loginDialog">取消</button>
        <button class="btn primary" type="submit">登入</button>
      </div>
    </form>
  </div>
</dialog>

<!-- 新增 / 編輯商品 -->
<dialog id="productDialog">
  <div class="dialog-wrap">
    <div class="dialog-head">
      <h3 id="productDialogTitle">新增商品</h3>
      <button class="icon-btn" type="button" data-close="productDialog">×</button>
    </div>

    <form id="productForm" class="form">
      <input id="productId" type="hidden">

      <label>分類
        <select id="productCategory" required>
          <option value="新家具">新家具</option>
          <option value="家具">家具</option>
          <option value="花盆">花盆</option>
          <option value="戒指限男">戒指限男</option>
          <option value="戒指限女">戒指限女</option>
          <option value="作物限男">作物限男</option>
          <option value="作物限女">作物限女</option>
          <option value="出清區">出清區</option>
        </select>
      </label>

      <label>商品名稱
        <input id="productName" maxlength="80" required placeholder="輸入商品名稱">
      </label>

      <label>價格
        <input id="productPrice" maxlength="40" required placeholder="例如：100T、80糖">
      </label>

      <div>
        <label>顏色／庫存</label>
        <div id="variantList" class="variant-list"></div>
        <button id="addVariantBtn" class="btn small" type="button">＋ 新增顏色</button>
        <div class="variant-total" style="margin-top:8px">
          <span>總庫存數量</span><strong id="variantTotal">0</strong>
        </div>
        <div class="variant-summary-note">
          每個顏色與庫存可指定一張對應商品圖片；前台選擇顏色後會自動切換圖片。
        </div>
      </div>

      <label>商品圖片
        <input id="productImage" type="file" accept="image/*" multiple>

/* 圖片標準化：保留透明背景並固定 600×450 */
function normalizeImageDataURL(src){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        const canvas=document.createElement("canvas");
        canvas.width=600; canvas.height=450;
        const ctx=canvas.getContext("2d");
        const scale=Math.min(600/img.naturalWidth,450/img.naturalHeight);
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const x=Math.round((600-w)/2);
        const y=Math.round((450-h)/2);
        ctx.clearRect(0,0,600,450);
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality="high";
        ctx.drawImage(img,0,0,img.naturalWidth,img.naturalHeight,x,y,w,h);
        const webp=canvas.toDataURL("image/webp",.82);
        resolve(webp.startsWith("data:image/webp")?webp:canvas.toDataURL("image/png"));
      }catch(e){reject(e)}
    };
    img.onerror=reject;
    img.src=src;
  });
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=async()=>{
      try{resolve(await normalizeImageDataURL(reader.result))}
      catch(e){reject(e)}
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}

/* 商品卡片 */
function getProductPrice(product){
  const value=String(product?.price??"").replace(/[^0-9.]/g,"");
  const n=Number(value);
  return Number.isFinite(n)?n:0;
}

function renderProducts(){
  const keyword=$("#searchInput").value.trim().toLowerCase();

  const list=products.filter(product=>{
    const categoryMatch=product.category===currentCategory;
    const nameMatch=!keyword || String(product.name||"").toLowerCase().includes(keyword);
    return categoryMatch && nameMatch;
  }).sort((a,b)=>{
    const pa=getProductPrice(a), pb=getProductPrice(b);
    return $("#productSort").value==="priceDesc"?pb-pa:pa-pb;
  });

  $("#sectionTitle").textContent=currentCategory;
  $("#productCount").textContent=`${list.length} 件商品`;

  const grid=$("#productGrid");
  grid.innerHTML="";

  if(!list.length){
    grid.innerHTML='<div class="empty">目前沒有符合條件的商品</div>';
    return;
  }

  const fragment=document.createDocumentFragment();

  list.forEach(product=>{
    const card=document.createElement("article");
    card.className="card";

    const media=document.createElement("div");
    media.className="media";

    const productImages=Array.isArray(product.images)
      ? product.images.filter(Boolean)
      : (product.image?[product.image]:[]);

    if(productImages.length){
      const img=document.createElement("img");
      img.alt=product.name||"商品圖片";
      img.loading="lazy";
      img.decoding="async";
      img.width=240; img.height=180;
      img.src=productImages[0];
      img.onerror=()=>{
        img.remove();
        media.textContent="圖片無法載入";
      };
      media.appendChild(img);
    }else{
      media.textContent="無商品圖片";
    }

    const body=document.createElement("div");
    body.className="body";

    const badge=document.createElement("div");
    badge.className="badge-text";
    badge.textContent=product.category||"";

    const name=document.createElement("div");
    name.className="name";
    name.textContent=product.name||"";
    name.title=product.name||"";

    const price=document.createElement("div");
    price.className="price";
    price.textContent=product.price||"";

    const variants=Array.isArray(product.variants)&&product.variants.length
      ? product.variants
      : [{color:"",stock:Number(product.stock??0),imageIndex:0}];

    const totalStock=variants.reduce(
      (sum,v)=>sum+Math.max(0,Number(v.stock)||0),0
    );

    const stock=document.createElement("div");
    stock.className="stock";
    if(totalStock<=0){
      stock.classList.add("soldout");
      stock.textContent="售罄";
    }else{
      stock.textContent=`總庫存：${totalStock}`;
    }

    const summary=document.createElement("div");
    summary.className="variant-summary";

    const colorVariants=variants.filter(v=>String(v.color||"").trim());

    if(colorVariants.length){
      const row=document.createElement("div");
      row.className="variant-summary-row";

      const label=document.createElement("span");
      label.className="variant-summary-label";
      label.textContent="款式";

      const select=document.createElement("select");
      select.className="variant-summary-select";
      select.setAttribute("aria-label","選擇商品顏色與庫存");

      colorVariants.forEach((variant,index)=>{
        const option=document.createElement("option");
        option.value=String(index);
        const s=Math.max(0,Number(variant.stock)||0);
        option.textContent=s>0
          ? `${variant.color}｜庫存 ${s}`
          : `${variant.color}｜售罄`;
        select.appendChild(option);
      });

      const updateVariantImage=()=>{
        const idx=Number(select.value)||0;
        const selected=colorVariants[idx]||colorVariants[0];
        const imageIndex=Number.isInteger(Number(selected?.imageIndex))
          ? Number(selected.imageIndex):idx;
        const src=productImages[imageIndex]||productImages[0];
        const img=media.querySelector("img");
        if(img && src) img.src=src;
      };

      select.addEventListener("change",updateVariantImage);
      row.append(label,select);
      summary.appendChild(row);
      setTimeout(updateVariantImage,0);
    }

    body.append(badge,name,summary,price,stock);

    if(isAdmin()){
      const actions=document.createElement("div");
      actions.className="card-actions";

      const edit=document.createElement("button");
      edit.className="btn small";
      edit.textContent="編輯";
      edit.onclick=()=>openProductDialog(product);

      const remove=document.createElement("button");
      remove.className="btn small danger";
      remove.textContent="刪除";
      remove.onclick=async()=>{
        if(!confirm(`確定刪除「${product.name}」嗎？`)) return;
        try{
          await deleteDoc(doc(db,"products",product.id));
          toast("商品已刪除");
        }catch(e){
          console.error(e); toast("商品刪除失敗");
        }
      };

      actions.append(edit,remove);
      body.appendChild(actions);
    }

    card.append(media,body);
    fragment.appendChild(card);
  });

  grid.appendChild(fragment);
}

/* 商品圖片預覽 */
function renderImagePreview(){
  const preview=$("#imagePreview");
  preview.innerHTML="";
  if(!selectedImageItems.length){
    preview.textContent="尚未選擇圖片";
    return;
  }

  selectedImageItems.forEach((item,index)=>{
    const box=document.createElement("div");
    box.className="preview-item";

    const img=document.createElement("img");
    img.src=item.src;
    img.alt=`商品圖片 ${index+1}`;
    box.appendChild(img);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="preview-remove";
    remove.textContent="×";
    remove.onclick=()=>{
      const removed=selectedImageItems.splice(index,1)[0];
      if(removed?.src?.startsWith("blob:")) URL.revokeObjectURL(removed.src);
      renderImagePreview();
      refreshVariantImageOptions();
    };
    box.appendChild(remove);

    const label=document.createElement("span");
    label.className="preview-index";
    label.textContent=`${index+1}${index===0?" 主圖":""}`;
    box.appendChild(label);

    preview.appendChild(box);
  });
}

function refreshVariantImageOptions(){
  $$("#variantList .variant-row").forEach(row=>{
    const select=row.querySelector(".variant-image");
    if(!select) return;
    const old=select.value;
    select.innerHTML="";

    if(!selectedImageItems.length){
      const option=document.createElement("option");
      option.value=""; option.textContent="先上傳圖片";
      option.disabled=true; option.selected=true;
      select.appendChild(option);
      return;
    }

    selectedImageItems.forEach((_,index)=>{
      const option=document.createElement("option");
      option.value=String(index);
      option.textContent=`圖片 ${index+1}${index===0?"（主圖）":""}`;
      select.appendChild(option);
    });

    if([...select.options].some(o=>o.value===old)) select.value=old;
    else select.value=String(Math.min(
      Number(row.dataset.defaultImageIndex||0),
      selectedImageItems.length-1
    ));
  });
}

function createVariantRow(variant={}){
  const row=document.createElement("div");
  row.className="variant-row";
  row.dataset.defaultImageIndex=Number(variant.imageIndex||0);

  const color=document.createElement("input");
  color.className="variant-color";
  color.maxLength=30;
  color.placeholder="顏色，例如：黑色";
  color.value=variant.color||"";

  const stock=document.createElement("input");
  stock.className="variant-stock";
  stock.type="number";
  stock.min="0";
  stock.placeholder="庫存";
  stock.value=Number(variant.stock||0);

  const image=document.createElement("select");
  image.className="variant-image";
  image.setAttribute("aria-label","指定商品圖片");

  const remove=document.createElement("button");
  remove.type="button";
  remove.className="btn small danger variant-remove";
  remove.textContent="×";
  remove.onclick=()=>{
    row.remove();
    ensureOneVariantRow();
    updateVariantTotal();
  };

  row.append(color,stock,image,remove);

  stock.addEventListener("input",updateVariantTotal);
  return row;
}

function updateVariantTotal(){
  const total=$$(".variant-stock").reduce(
    (sum,input)=>sum+Math.max(0,parseInt(input.value,10)||0),0
  );
  $("#variantTotal").textContent=String(total);
}

function ensureOneVariantRow(){
  if(!$("#variantList").children.length){
    $("#variantList").appendChild(createVariantRow());
  }
  updateVariantTotal();
  refreshVariantImageOptions();
}

function getVariantsFromForm(){
  return $$("#variantList .variant-row").map(row=>({
    color:row.querySelector(".variant-color").value.trim(),
    stock:Math.max(0,parseInt(row.querySelector(".variant-stock").value,10)||0),
    imageIndex:Math.max(0,Number(row.querySelector(".variant-image").value)||0)
  }));
}

function setVariantsInForm(variants){
  const list=$("#variantList");
  list.innerHTML="";
  const source=Array.isArray(variants)&&variants.length
    ? variants:[{color:"",stock:0,imageIndex:0}];

  source.forEach(v=>list.appendChild(createVariantRow(v)));
  updateVariantTotal();
  refreshVariantImageOptions();
}

function openProductDialog(product=null){
  $("#productForm").reset();
  $("#productId").value=product?.id||"";
  $("#productDialogTitle").textContent=product?"編輯商品":"新增商品";
  $("#productCategory").value=product?.category||currentCategory;
  $("#productName").value=product?.name||"";
  $("#productPrice").value=product?.price||"";

  setVariantsInForm(
    product?.variants?.length
      ? product.variants
      : [{color:"",stock:Number(product?.stock??0),imageIndex:0}]
  );

  selectedImageItems=(Array.isArray(product?.images)
    ? product.images.filter(Boolean)
    : (product?.image?[product.image]:[])
  ).map(src=>({src,existing:true}));

  $("#productImage").value="";
  renderImagePreview();
  refreshVariantImageOptions();
  $("#productDialog").showModal();
}

/* 上傳圖片 */
$("#productImage").addEventListener("change",async event=>{
  const files=[...event.target.files||[]];
  if(!files.length) return;

  const remaining=6-selectedImageItems.length;
  if(remaining<=0){
    toast("最多只能使用 6 張商品圖片");
    event.target.value="";
    return;
  }

  const filesToAdd=files.slice(0,remaining);

  const items=filesToAdd.map(file=>({
    file,
    src:URL.createObjectURL(file),
    processing:true,
    existing:false
  }));

  selectedImageItems.push(...items);
  renderImagePreview();

  await Promise.all(items.map(async item=>{
    try{
      item.processed=await compressImage(item.file);
    }catch(e){
      console.warn("圖片標準化失敗",e);
    }finally{
      item.processing=false;
    }
  }));

  renderImagePreview();
  refreshVariantImageOptions();
  event.target.value="";
});

/* 儲存商品 */
$("#productForm").addEventListener("submit",async event=>{
  event.preventDefault();

  if(!isAdmin()){
    toast("只有管理員可以管理商品");
    return;
  }

  try{
    const images=[];

    for(const item of selectedImageItems){
      if(item.processed) images.push(item.processed);
      else if(item.src && !item.src.startsWith("blob:")) images.push(item.src);
      else if(item.file){
        images.push(await compressImage(item.file));
      }
    }

    const variants=getVariantsFromForm();
    const stock=variants.reduce((sum,v)=>sum+v.stock,0);

    const payload={
      category:$("#productCategory").value,
      name:$("#productName").value.trim(),
      price:$("#productPrice").value.trim(),
      stock,
      variants,
      images,
      image:images[0]||"",
      updatedAt:serverTimestamp()
    };

    const id=$("#productId").value;

    if(id){
      await updateDoc(doc(db,"products",id),payload);
      toast("商品已更新");
    }else{
      payload.createdAt=serverTimestamp();
      await addDoc(collection(db,"products"),payload);
      toast("商品已新增");
    }

    $("#productDialog").close();
  }catch(error){
    console.error(error);
    toast("商品儲存失敗");
  }
});

/* 登入 */
$("#loginForm").addEventListener("submit",async event=>{
  event.preventDefault();
  try{
    const credential=await signInWithEmailAndPassword(
      auth,$("#loginEmail").value.trim(),$("#loginPassword").value
    );

    if(credential.user.uid!==ADMIN_UID){
      await signOut(auth);
      toast("這個帳號不是管理員");
      return;
    }

    $("#loginDialog").close();
    $("#loginForm").reset();
    toast("管理員登入成功");
  }catch(error){
    console.error(error);
    toast("登入失敗，請檢查帳號密碼");
  }
});

/* 管理員按鈕 */
$("#adminBtn").onclick=async()=>{
  if(isAdmin()){
    await signOut(auth);
    toast("已登出");
  }else{
    $("#loginDialog").showModal();
  }
};

/* 新增商品 */
$("#addBtn").onclick=()=>openProductDialog();

/* 新增顏色 */
$("#addVariantBtn").onclick=()=>{
  const row=createVariantRow({imageIndex:$$("#variantList .variant-row").length});
  $("#variantList").appendChild(row);
  updateVariantTotal();
  refreshVariantImageOptions();
};

/* Dialog 關閉 */
$$("[data-close]").forEach(button=>{
  button.onclick=()=>{
    const dialog=document.getElementById(button.dataset.close);
    if(dialog) dialog.close();
  };
});

/* 分類切換 */
$("#tabs").addEventListener("click",event=>{
  const button=event.target.closest(".tab");
  if(!button) return;

  $$(".tab").forEach(tab=>tab.classList.remove("active"));
  button.classList.add("active");
  currentCategory=button.dataset.category;
  renderProducts();
});

/* 搜尋 */
$("#searchInput").addEventListener("input",()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(renderProducts,80);
});

/* 排序 */
$("#productSort").addEventListener("change",renderProducts);

/* 留言 */
$("#messageForm").addEventListener("submit",async event=>{
  event.preventDefault();

  const name=$("#messageName").value.trim();
  const text=$("#messageText").value.trim();

  if(!name||!text){
    toast("請完整填寫暱稱和留言");
    return;
  }

  try{
    await addDoc(collection(db,"messages"),{
      name,text,createdAt:serverTimestamp(),reply:"",replyAt:null
    });
    $("#messageText").value="";
    toast("留言已送出");
  }catch(error){
    console.error(error);
    toast("留言送出失敗");
  }
});

/* 留言顯示 */
function renderMessages(){
  const box=$("#messages");
  box.innerHTML="";

  if(!messages.length){
    box.innerHTML='<div class="message">目前還沒有留言</div>';
    return;
  }

  messages.forEach(message=>{
    const item=document.createElement("div");
    item.className="message";

    const top=document.createElement("div");
    top.className="message-top";

    const left=document.createElement("div");
    const name=document.createElement("div");
    name.className="message-name";
    name.textContent=message.name||"匿名";

    const time=document.createElement("div");
    time.className="message-time";
    time.textContent=formatTime(message.createdAt);

    left.append(name,time);
    top.appendChild(left);

    if(isAdmin()){
      const remove=document.createElement("button");
      remove.className="btn small danger";
      remove.textContent="刪除";
      remove.onclick=async()=>{
        if(!confirm("確定刪除這則留言嗎？")) return;
        try{
          await deleteDoc(doc(db,"messages",message.id));
          toast("留言已刪除");
        }catch(e){
          console.error(e);toast("留言刪除失敗");
        }
      };
      top.appendChild(remove);
    }

    item.appendChild(top);

    const text=document.createElement("div");
    text.className="message-text";
    text.textContent=message.text||"";
    item.appendChild(text);

    if(message.reply){
      const reply=document.createElement("div");
      reply.className="reply-box";

      const label=document.createElement("div");
      label.className="reply-label";
      label.textContent="管理員回覆";

      const replyText=document.createElement("div");
      replyText.className="reply-text";
      replyText.textContent=message.reply;

      const replyTime=document.createElement("div");
      replyTime.className="reply-time";
      replyTime.textContent=formatTime(message.replyAt);

      reply.append(label,replyText,replyTime);
      item.appendChild(reply);
    }

    if(isAdmin()){
      const form=document.createElement("form");
      form.className="admin-reply-form";

      const input=document.createElement("input");
      input.maxLength=300;
      input.placeholder=message.reply?"修改管理員回覆…":"輸入管理員回覆…";
      input.value=message.reply||"";

      const button=document.createElement("button");
      button.type="submit";
      button.className="btn primary";
      button.textContent=message.reply?"修改回覆":"回覆";

      form.append(input,button);

      form.onsubmit=async e=>{
        e.preventDefault();
        const reply=input.value.trim();
        if(!reply){
          toast("請輸入回覆內容");
          return;
        }
        try{
          await updateDoc(doc(db,"messages",message.id),{
            reply,replyAt:serverTimestamp()
          });
          toast("回覆已送出");
        }catch(error){
          console.error(error);
          toast("回覆失敗");
        }
      };

      item.appendChild(form);
    }

    box.appendChild(item);
  });
}

/* Firebase 商品即時監聽 */
onSnapshot(
  query(collection(db,"products"),orderBy("createdAt","desc")),
  snapshot=>{
    products=snapshot.docs.map(document=>({id:document.id,...document.data()}));
    renderProducts();
  },
  error=>{
    console.error(error);
    $("#productGrid").innerHTML='<div class="empty">商品讀取失敗</div>';
  }
);

/* Firebase 留言即時監聽 */
onSnapshot(
  query(collection(db,"messages"),orderBy("createdAt","desc")),
  snapshot=>{
    messages=snapshot.docs.map(document=>({id:document.id,...document.data()}));
    renderMessages();
  },
  error=>{
    console.error(error);
    $("#messages").innerHTML='<div class="message">留言讀取失敗</div>';
  }
);

/* 登入狀態 */
onAuthStateChanged(auth,user=>{
  currentUser=user;
  $("#adminBtn").textContent=isAdmin()?"登出管理員":"管理員登入";
  $("#addBtn").classList.toggle("hidden",!isAdmin());
  renderProducts();
  renderMessages();
});

ensureOneVariantRow();
</script>
