<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 5vw;
  background:#0a0a0bf2;
  border-bottom:1px solid #333;
  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;
  border:1px solid #fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-weight:900;
}

.brand h1{
  font-size:20px;
}

.brand small{
  color:#aaa;
}

h1,
h2,
h3,
p{
  margin:0;
}

.btn{
  border:1px solid #3a3a40;
  background:#1b1b1f;
  color:#fff;
  padding:10px 14px;
  border-radius:11px;
}

.btn:hover{
  background:#25252a;
}

.btn.primary{
  background:#fff;
  color:#111;
  font-weight:800;
}

.btn.primary:hover{
  background:#ddd;
}

.btn.danger{
  color:#ff9aa4;
  border-color:#6d3439;
}

.btn.danger:hover{
  background:#321a1d;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
  padding:36px 0 30px;
}

.hero-banner{
  display:flex;
  justify-content:center;
}

.hero-banner img{
  width:min(650px,100%);
  height:auto;
  max-height:500px;
  object-fit:contain;
  object-position:center;
  border-radius:22px;
  border:1px solid #34343b;
  box-shadow:0 20px 60px rgba(103,69,255,.18);
}

/* =========================
   SEARCH
========================= */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:15px 0;
}

.search{
  flex:1;
  min-width:220px;
  background:#151518;
  color:#fff;
  border:1px solid #333;
  padding:11px 13px;
  border-radius:11px;
  outline:none;
}

.search:focus{
  border-color:#777;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:18px;
  scrollbar-width:thin;
}

.tab{
  white-space:nowrap;
  background:#19191d;
  color:#ddd;
  border:1px solid #38383e;
  padding:9px 13px;
  border-radius:999px;
}

.tab:hover{
  background:#25252a;
}

.tab.active{
  background:#fff;
  color:#111;
  font-weight:800;
}

/* =========================
   SECTION
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:10px 0 18px;
}

.section-head h3{
  font-size:24px;
}

.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

/* =========================
   PRODUCT GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
}

.card{
  background:#161619;
  border:1px solid #333;
  border-radius:16px;
  overflow:hidden;
  transition:.2s ease;
}

.card:hover{
  transform:translateY(-2px);
  border-color:#555;
}

/*
  商品圖片區：
  不再固定 4:3，
  避免不同圖片比例看起來被裁切。
*/

.media{
  width:100%;
  min-height:260px;
  max-height:420px;
  background:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  padding:10px;
}

.media img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:400px;
  object-fit:contain;
  object-position:center;
  background:#111;
}

.media-empty{
  color:#777;
  font-size:14px;
}

.body{
  padding:12px;
}

.badge{
  font-size:11px;
  color:#bbb;
}

.name{
  font-size:17px;
  font-weight:800;
  margin-top:7px;
  word-break:break-word;
}

.price{
  font-size:18px;
  font-weight:900;
  margin-top:7px;
  word-break:break-word;
}

.card-actions{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.empty{
  grid-column:1/-1;
  color:#777;
  padding:40px 0;
  text-align:center;
}

/* =========================
   MESSAGE BOARD
========================= */

.board{
  margin:55px 0;
  border-top:1px solid #333;
  padding-top:28px;
}

.board h3{
  font-size:26px;
}

.board>p{
  color:#aaa;
  margin-top:6px;
}

.board-form{
  display:grid;
  grid-template-columns:180px 1fr auto;
  gap:10px;
  margin:18px 0;
}

.board input,
.board textarea{
  background:#151518;
  color:#fff;
  border:1px solid #333;
  border-radius:11px;
  padding:11px;
  outline:none;
}

.board input:focus,
.board textarea:focus{
  border-color:#777;
}

.board textarea{
  min-height:44px;
  resize:vertical;
}

.messages{
  display:grid;
  gap:10px;
}

.message{
  background:#151518;
  border:1px solid #333;
  border-radius:13px;
  padding:14px;
}

.message-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.message-name{
  font-weight:800;
}

.message-time{
  color:#777;
  font-size:11px;
  margin-top:4px;
}

.message-text{
  margin-top:8px;
  white-space:pre-wrap;
  word-break:break-word;
}

.note{
  color:#777;
  font-size:12px;
  margin-top:10px;
}

/* =========================
   DIALOG
========================= */

dialog{
  width:min(520px,calc(100% - 28px));
  border:1px solid #3d3d44;
  border-radius:16px;
  background:#17171b;
  color:#fff;
  padding:0;
  box-shadow:0 24px 80px #0009;
}

dialog::backdrop{
  background:#000b;
}

.dialog-wrap{
  padding:20px;
}

.dialog-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.dialog-head h3{
  font-size:21px;
}

.icon-btn{
  background:transparent;
  border:0;
  color:#aaa;
  font-size:24px;
}

.form{
  display:grid;
  gap:12px;
}

.form label{
  display:grid;
  gap:6px;
  color:#cfcfd4;
  font-size:13px;
}

.form input,
.form select{
  width:100%;
  background:#101014;
  color:#fff;
  border:1px solid #3b3b42;
  border-radius:10px;
  padding:11px 12px;
  outline:none;
}

.form input:focus,
.form select:focus{
  border-color:#777;
}

.dialog-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:16px;
}

/* =========================
   IMAGE PREVIEW
========================= */

.preview{
  width:100%;
  min-height:280px;
  max-height:500px;
  border:1px dashed #444;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  overflow:hidden;
  background:#111;
  padding:12px;
}

.preview img{
  display:block;
  width:auto;
  height:auto;
  max-width:100%;
  max-height:470px;
  object-fit:contain;
  object-position:center;
}

/* =========================
   UPLOAD STATUS
========================= */

.upload-status{
  color:#888;
  font-size:12px;
  margin-top:5px;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:100;
  background:#fff;
  color:#111;
  padding:11px 14px;
  border-radius:10px;
  box-shadow:0 12px 40px #0008;
  font-weight:700;
}

/* =========================
   LOADING
========================= */

.loading{
  color:#777;
  padding:40px 0;
  text-align:center;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){

  .grid{
    grid-template-columns:repeat(3,1fr);
  }

}

@media(max-width:800px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .board-form{
    grid-template-columns:1fr;
  }

  .media{
    min-height:230px;
  }

}

@media(max-width:500px){

  .grid{
    grid-template-columns:1fr;
  }

  .brand small{
    display:none;
  }

  .topbar{
    padding:12px 14px;
  }

  .hero{
    padding-top:20px;
  }

  .media{
    min-height:240px;
    max-height:500px;
  }

  .media img{
    max-height:470px;
  }

  .preview{
    min-height:240px;
  }

}
</style>
</head>

<body>

<header class="topbar">

  <div class="brand">

    <div class="logo">
      O²
    </div>

    <div>
      <h1>O² M★STAR交易區</h1>
      <small>販售・收購・交流</small>
    </div>

  </div>

  <button id="adminBtn" class="btn">
    管理員登入
  </button>

</header>


<main class="wrap">

  <!-- =========================
       HERO
  ========================== -->

  <section class="hero">

    <div class="hero-banner">

      <img
        src="ostar-logo.PNG"
        alt="O² M★STAR交易區"
      >

    </div>

  </section>


  <!-- =========================
       SEARCH
  ========================== -->

  <section class="toolbar">

    <input
      id="searchInput"
      class="search"
      placeholder="搜尋商品名稱…"
    >

    <button
      id="addBtn"
      class="btn primary hidden"
    >
      ＋ 新增商品
    </button>

  </section>


  <!-- =========================
       CATEGORY
  ========================== -->

  <nav id="tabs" class="tabs">

    <button class="tab active" data-category="新家具">
      新家具
    </button>

    <button class="tab" data-category="家具">
      家具
    </button>

    <button class="tab" data-category="花盆">
      花盆
    </button>

    <button class="tab" data-category="戒指限男">
      戒指限男
    </button>

    <button class="tab" data-category="戒指限女">
      戒指限女
    </button>

    <button class="tab" data-category="作物限男">
      作物限男
    </button>

    <button class="tab" data-category="作物限女">
      作物限女
    </button>

    <button class="tab" data-category="收購區">
      收購區
    </button>

  </nav>


  <!-- =========================
       PRODUCT TITLE
  ========================== -->

  <section class="section-head">

    <div>

      <h3 id="sectionTitle">
        新家具
      </h3>

      <div id="productCount" class="count">
        0 件商品
      </div>

    </div>

  </section>


  <!-- =========================
       PRODUCT GRID
  ========================== -->

  <section id="productGrid" class="grid">

    <div class="loading">
      讀取商品中…
    </div>

  </section>


  <!-- =========================
       MESSAGE BOARD
  ========================== -->

  <section class="board">

    <h3>
      留言板
    </h3>

    <p>
      想詢問商品或留言可以寫在這裡。
    </p>


    <form
      id="messageForm"
      class="board-form"
    >

      <input
        id="messageName"
        maxlength="30"
        placeholder="暱稱"
        required
      >

      <textarea
        id="messageText"
        maxlength="300"
        placeholder="留言內容"
        required
      ></textarea>

      <button
        class="btn primary"
        type="submit"
      >
        送出留言
      </button>

    </form>


    <div
      id="messages"
      class="messages"
    ></div>


    <div class="note">
      留言送出後會公開顯示，請勿留下密碼或其他敏感資訊。
    </div>

  </section>

</main>


<!-- =========================
     LOGIN
========================= -->

<dialog id="loginDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3>
        管理員登入
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="loginDialog"
      >
        ×
      </button>

    </div>


    <form
      id="loginForm"
      class="form"
    >

      <label>

        Email

        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          required
        >

      </label>


      <label>

        密碼

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >

      </label>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="loginDialog"
        >
          取消
        </button>

        <button
          class="btn primary"
          type="submit"
        >
          登入
        </button>

      </div>

    </form>

  </div>

</dialog>


<!-- =========================
     PRODUCT DIALOG
========================= -->

<dialog id="productDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3 id="productDialogTitle">
        新增商品
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="productDialog"
      >
        ×
      </button>

    </div>


    <form
      id="productForm"
      class="form"
    >

      <input
        id="productId"
        type="hidden"
      >


      <label>

        分類

        <select
          id="productCategory"
          required
        >

          <option value="新家具">
            新家具
          </option>

          <option value="家具">
            家具
          </option>

          <option value="花盆">
            花盆
          </option>

          <option value="戒指限男">
            戒指限男
          </option>

          <option value="戒指限女">
            戒指限女
          </option>

          <option value="作物限男">
            作物限男
          </option>

          <option value="作物限女">
            作物限女
          </option>

          <option value="收購區">
            收購區
          </option>

        </select>

      </label>


      <label>

        商品名稱

        <input
          id="productName"
          maxlength="80"
          required
          placeholder="輸入商品名稱"
        >

      </label>


      <label>

        價格

        <input
          id="productPrice"
          maxlength="40"
          required
          placeholder="例如：100T、80糖"
        >

      </label>


      <label>

        商品圖片

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >

      </label>


      <div class="upload-status">
        建議使用 JPG、PNG、WEBP，系統會自動縮小圖片。
      </div>


      <div
        id="imagePreview"
        class="preview"
      >
        尚未選擇圖片
      </div>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="productDialog"
        >
          取消
        </button>

        <button
          id="saveProductBtn"
          class="btn primary"
          type="submit"
        >
          儲存商品
        </button>

      </div>

    </form>

  </div>

</dialog>


<div
  id="toast"
  class="toast hidden"
></div>


<script type="module">

/* =========================================================
   Firebase
========================================================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL,
  deleteObject
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* =========================================================
   Firebase 設定
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBWH6HxuAXNbTpRQKGhNU10P5oLWcE36yQ",

  authDomain:
    "ostar-shop.firebaseapp.com",

  projectId:
    "ostar-shop",

  storageBucket:
    "ostar-shop.firebasestorage.app",

  messagingSenderId:
    "1070557199066",

  appId:
    "1:1070557199066:web:aa8ce9dc1b5eb3710683e3"

};


/* =========================================================
   管理員 UID
========================================================= */

const ADMIN_UID =
  "IhFebcTe8tTN0jtpyjKgGvN6NmY2";


/* =========================================================
   初始化
========================================================= */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);

const storage =
  getStorage(app);


/* =========================================================
   快捷選擇器
========================================================= */

const $ =
  selector =>
    document.querySelector(selector);

const $$ =
  selector =>
    [...document.querySelectorAll(selector)];


/* =========================================================
   全域變數
========================================================= */

let products = [];

let messages = [];

let currentCategory = "新家具";

let currentUser = null;

let editingImage = "";

let editingStoragePath = "";


/* =========================================================
   Toast
========================================================= */

function toast(text){

  const el =
    $("#toast");

  el.textContent =
    text;

  el.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {
        el.classList.add(
          "hidden"
        );
      },
      2500
    );

}


/* =========================================================
   是否為管理員
========================================================= */

function isAdmin(){

  return !!currentUser &&
    currentUser.uid === ADMIN_UID;

}


/* =========================================================
   Firebase 時間
========================================================= */

function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }

  return timestamp
    .toDate()
    .toLocaleString(
      "zh-TW",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   Render 商品
========================================================= */

function renderProducts(){

  const keyword =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(product => {

      const sameCategory =
        product.category ===
        currentCategory;

      const matchKeyword =
        !keyword ||
        (product.name || "")
          .toLowerCase()
          .includes(keyword);

      return sameCategory &&
        matchKeyword;

    });


  $("#sectionTitle")
    .textContent =
      currentCategory;


  $("#productCount")
    .textContent =
      `${list.length} 件商品`;


  const grid =
    $("#productGrid");


  grid.innerHTML = "";


  if(!list.length){

    grid.innerHTML =
      `
      <div class="empty">
        這個分類目前沒有商品
      </div>
      `;

    return;

  }


  list.forEach(product => {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "card";


    /* 商品圖片 */

    const media =
      document.createElement(
        "div"
      );

    media.className =
      "media";


    if(product.image){

      const img =
        document.createElement(
          "img"
        );

      img.src =
        product.image;

      img.alt =
        product.name ||
        "商品圖片";

      img.loading =
        "lazy";


      img.onerror =
        () => {

          media.innerHTML =
            `<div class="media-empty">
              商品圖片載入失敗
            </div>`;

        };


      media.appendChild(
        img
      );

    }else{

      media.innerHTML =
        `<div class="media-empty">
          無商品圖片
        </div>`;

    }


    /* 商品內容 */

    const body =
      document.createElement(
        "div"
      );

    body.className =
      "body";


    const badge =
      document.createElement(
        "div"
      );

    badge.className =
      "badge";

    badge.textContent =
      product.category || "";


    const name =
      document.createElement(
        "div"
      );

    name.className =
      "name";

    name.textContent =
      product.name || "";


    const price =
      document.createElement(
        "div"
      );

    price.className =
      "price";

    price.textContent =
      product.price || "";


    body.append(
      badge,
      name,
      price
    );


    /* 管理員按鈕 */

    if(isAdmin()){

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "card-actions";


      const edit =
        document.createElement(
          "button"
        );

      edit.className =
        "btn small";

      edit.textContent =
        "編輯";

      edit.onclick =
        () =>
          openProductDialog(
            product
          );


      const del =
        document.createElement(
          "button"
        );

      del.className =
        "btn small danger";

      del.textContent =
        "刪除";


      del.onclick =
        async () => {

          const confirmed =
            confirm(
              `確定刪除「${product.name}」嗎？`
            );


          if(!confirmed){

            return;

          }


          try{

            await deleteDoc(
              doc(
                db,
                "products",
                product.id
              )
            );


            if(
              product.storagePath
            ){

              try{

                await deleteObject(
                  ref(
                    storage,
                    product.storagePath
                  )
                );

              }catch(error){

                console.warn(
                  "Storage 圖片刪除失敗：",
                  error
                );

              }

            }


            toast(
              "商品已刪除"
            );

          }catch(error){

            console.error(
              error
            );

            toast(
              "商品刪除失敗"
            );

          }

        };


      actions.append(
        edit,
        del
      );

      body.appendChild(
        actions
      );

    }


    card.append(
      media,
      body
    );


    grid.appendChild(
      card
    );

  });

}


/* =========================================================
   Render 留言
========================================================= */

function renderMessages(){

  const box =
    $("#messages");

  box.innerHTML = "";


  if(!messages.length){

    box.innerHTML =
      `
      <div class="message">
        目前還沒有留言
      </div>
      `;

    return;

  }


  messages.forEach(
    message => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "message";


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "message-top";


      const left =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "message-name";

      name.textContent =
        message.name ||
        "匿名";


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "message-time";

      time.textContent =
        formatTime(
          message.createdAt
        );


      left.append(
        name,
        time
      );


      top.appendChild(
        left
      );


      if(isAdmin()){

        const del =
          document.createElement(
            "button"
          );

        del.className =
          "btn small danger";

        del.textContent =
          "刪除";


        del.onclick =
          async () => {

            if(
              !confirm(
                "確定刪除這則留言嗎？"
              )
            ){

              return;

            }


            try{

              await deleteDoc(
                doc(
                  db,
                  "messages",
                  message.id
                )
              );

              toast(
                "留言已刪除"
              );

            }catch(error){

              console.error(
                error
              );

              toast(
                "留言刪除失敗"
              );

            }

          };


        top.appendChild(
          del
        );

      }


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "message-text";

      text.textContent =
        message.text || "";


      item.append(
        top,
        text
      );


      box.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   圖片壓縮
========================================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onerror =
        reject;


      reader.onload =
        () => {

          const img =
            new Image();


          img.onerror =
            reject;


          img.onload =
            () => {

              const maxSize =
                1400;


              const scale =
                Math.min(
                  1,
                  maxSize /
                  Math.max(
                    img.width,
                    img.height
                  )
                );


              const width =
                Math.round(
                  img.width *
                  scale
                );


              const height =
                Math.round(
                  img.height *
                  scale
                );


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );


              context.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              let quality =
                0.82;


              let output =
                canvas.toDataURL(
                  "image/jpeg",
                  quality
                );


              while(
                output.length > 850000 &&
                quality > 0.4
              ){

                quality -= 0.08;

                output =
                  canvas.toDataURL(
                    "image/jpeg",
                    quality
                  );

              }


              if(
                output.length >
                950000
              ){

                reject(
                  new Error(
                    "圖片仍然太大"
                  )
                );

                return;

              }


              resolve(
                dataURLToBlob(
                  output
                )
              );

            };


          img.src =
            reader.result;

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   Data URL → Blob
========================================================= */

function dataURLToBlob(
  dataURL
){

  const parts =
    dataURL.split(",");


  const mime =
    parts[0]
      .match(
        /:(.*?);/
      )[1];


  const binary =
    atob(parts[1]);


  const array =
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    array[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:mime
    }
  );

}


/* =========================================================
   上傳圖片到 Firebase Storage
========================================================= */

async function uploadProductImage(
  file
){

  const blob =
    await compressImage(
      file
    );


  const fileName =
    `products/${Date.now()}-${Math.random()
      .toString(36)
      .slice(2,10)}.jpg`;


  const storageRef =
    ref(
      storage,
      fileName
    );


  await uploadBytes(
    storageRef,
    blob,
    {
      contentType:
        "image/jpeg"
    }
  );


  const url =
    await getDownloadURL(
      storageRef
    );


  return {
    url,
    storagePath:
      fileName
  };

}


/* =========================================================
   開啟商品視窗
========================================================= */

function openProductDialog(
  product = null
){

  $("#productForm")
    .reset();


  $("#productId")
    .value =
      product?.id || "";


  $("#productDialogTitle")
    .textContent =
      product
      ? "編輯商品"
      : "新增商品";


  $("#productCategory")
    .value =
      product?.category ||
      currentCategory;


  $("#productName")
    .value =
      product?.name || "";


  $("#productPrice")
    .value =
      product?.price || "";


  editingImage =
    product?.image || "";


  editingStoragePath =
    product?.storagePath || "";


  const preview =
    $("#imagePreview");


  preview.innerHTML =
    "";


  if(editingImage){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      editingImage;

    img.alt =
      "商品圖片";


    preview.appendChild(
      img
    );

  }else{

    preview.textContent =
      "尚未選擇圖片";

  }


  $("#productDialog")
    .showModal();

}


/* =========================================================
   圖片選擇預覽
========================================================= */

$("#productImage")
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files?.[0];


      if(!file){

        return;

      }


      const preview =
        $("#imagePreview");


      preview.innerHTML =
        "圖片處理中…";


      try{

        const blob =
          await compressImage(
            file
          );


        const url =
          URL.createObjectURL(
            blob
          );


        const img =
          document.createElement(
            "img"
          );


        img.src =
          url;

        img.alt =
          "圖片預覽";


        preview.innerHTML =
          "";


        preview.appendChild(
          img
        );


      }catch(error){

        console.error(
          error
        );

        preview.textContent =
          "圖片處理失敗";

        toast(
          "圖片處理失敗，請換一張圖片"
        );

      }

    }
  );


/* =========================================================
   儲存商品
========================================================= */

$("#productForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if(!isAdmin()){

        toast(
          "只有管理員可以管理商品"
        );

        return;

      }


      const saveButton =
        $("#saveProductBtn");


      saveButton.disabled =
        true;

      saveButton.textContent =
        "儲存中…";


      const id =
        $("#productId")
          .value;


      const file =
        $("#productImage")
          .files?.[0];


      try{

        let image =
          editingImage;


        let storagePath =
          editingStoragePath;


        /* 新圖片 */

        if(file){

          const uploaded =
            await uploadProductImage(
              file
            );


          image =
            uploaded.url;


          storagePath =
            uploaded.storagePath;


          /* 刪除舊圖片 */

          if(
            editingStoragePath
          ){

            try{

              await deleteObject(
                ref(
                  storage,
                  editingStoragePath
                )
              );

            }catch(error){

              console.warn(
                "舊圖片刪除失敗：",
                error
              );

            }

          }

        }


        const payload = {

          category:
            $("#productCategory")
              .value,

          name:
            $("#productName")
              .value
              .trim(),

          price:
            $("#productPrice")
              .value
              .trim(),

          image,

          storagePath,

          updatedAt:
            serverTimestamp()

        };


        if(id){

          await updateDoc(
            doc(
              db,
              "products",
              id
            ),
            payload
          );


          toast(
            "商品已更新"
          );

        }else{

          payload.createdAt =
            serverTimestamp();


          await addDoc(
            collection(
              db,
              "products"
            ),
            payload
          );


          toast(
            "商品已新增"
          );

        }


        $("#productDialog")
          .close();


        $("#productForm")
          .reset();


      }catch(error){

        console.error(
          error
        );

        toast(
          "商品儲存失敗，請確認 Firebase Storage 設定"
        );

      }finally{

        saveButton.disabled =
          false;

        saveButton.textContent =
          "儲存商品";

      }

    }
  );


/* =========================================================
   管理員登入
========================================================= */

$("#loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      try{

        const credential =
          await signInWithEmailAndPassword(
            auth,
            $("#loginEmail")
              .value
              .trim(),
            $("#loginPassword")
              .value
          );


        if(
          credential.user.uid !==

        ){

          await signOut(
            auth
          );


          toast(

          );


          return;

        }

          .close();


        $("#loginForm")
          .reset();


        toast(
          "管理員登入成功"
        );


      }catch(error){

        console.error(
          error
        );


        toast(
          "登入失敗，請檢查帳號密碼"
        );

      }

    }
  );


/* =========================================================
   管理員按鈕
========================================================= */

$("#adminBtn")

          auth

        );

/* =========================================================
   新增商品
========================================================= */

$("#addBtn")

      openProductDialog();

    };


/* =========================================================
   Firebase 登入狀態
========================================================= */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;


    $("#adminBtn")
      .textContent =
        isAdmin()
        ? "登出管理員"
        : "管理員登入";

      .toggle(

      );

);


/* =========================================================
   分類切換
========================================================= */

$("#tabs")
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".tab"
        );


      if(!button){

        return;

      }


      $$(".tab")
        .forEach(
          item =>
            item.classList
              .remove(
                "active"
              )
        );


      button.classList.add(
        "active"
      );


      currentCategory =
        button.dataset.category;


      renderProducts();

    }
  );


/* =========================================================
   搜尋
========================================================= */

$("#searchInput")
  .addEventListener(
    "input",
    renderProducts
  );


/* =========================================================
   留言
========================================================= */

$("#messageForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        $("#messageName")
          .value
          .trim();


      const text =
        $("#messageText")
          .value
          .trim();


      if(
        !name ||
        !text
      ){

        return;

      }


      try{

        await addDoc(
          collection(
            db,
            "messages"
          ),
          {

            name,

            text,

            createdAt:
              serverTimestamp()

          }
        );


        $("#messageText")
          .value = "";


        toast(
          "留言已送出"
        );


      }catch(error){

        console.error(
          error
        );


        toast(
          "留言送出失敗"
        );

      }

    }
  );


/* =========================================================
   關閉 Dialog
========================================================= */

$$("[data-close]")
  .forEach(
    button => {

      button.onclick =
        () => {

          const id =
            button.dataset.close;


          document
            .getElementById(id)
            ?.close();

        };

    }
  );


/* =========================================================
   Firestore 商品即時監聽
========================================================= */

onSnapshot(

  query(
    collection(
      db,
      "products"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snapshot => {

    products =
      snapshot.docs.map(
        document => ({
          id:
            document.id,
          ...document.data()
        })
      );


    renderProducts();

  },

  error => {

    console.error(
      error
    );


    $("#productGrid")
      .innerHTML =
        `
        <div class="empty">
          商品讀取失敗，請確認 Firebase 設定。
        </div>
        `;

  }

);


/* =========================================================
   Firestore 留言即時監聽
========================================================= */

onSnapshot(

  query(
    collection(
      db,
      "messages"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snapshot => {

    messages =
      snapshot.docs.map(
        document => ({
          id:
            document.id,
          ...document.data()
        })
      );


    renderMessages();

  },

  error => {

    console.error(
      error
    );


    $("#messages")
      .innerHTML =
        `
        <div class="message">
          留言讀取失敗
        </div>
        `;

  }

);

</script>
