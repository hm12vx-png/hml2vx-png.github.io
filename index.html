<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --panel2:#111114;

  --danger:#ff7582;

}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:

    "Microsoft JhengHei",

}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:14px 5vw;

  background:rgba(10,10,11,.94);
  border-bottom:1px solid #333;

  backdrop-filter:blur(14px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;

  border:1px solid #fff;
  border-radius:50%;

  display:grid;
  place-items:center;

  font-weight:900;
  font-size:13px;
}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand small{
  color:#aaa;
}

/* =========================
   BUTTON
========================= */

.btn{
  border:1px solid #3a3a40;
  background:#1b1b1f;
  color:#fff;

  padding:10px 14px;
  border-radius:11px;

  transition:.2s;
}

.btn:hover{
  border-color:#666;
  transform:translateY(-1px);
}

.btn.primary{
  background:#fff;
  color:#111;
  font-weight:800;
}

.btn.danger{
  color:#ff9aa4;
  border-color:#6d3439;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

/* =========================
   MAIN
========================= */

.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

/* =========================
   HERO
========================= */

.hero{
  padding:34px 0 28px;
}

.hero-banner{
  display:flex;
  justify-content:center;
}

.hero-banner img{
  width:min(650px,100%);
  height:auto;

  object-fit:contain;

  border-radius:22px;
  border:1px solid #34343b;

  box-shadow:
    0 20px 60px rgba(103,69,255,.18);

  display:block;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin:15px 0;
}

.search{
  flex:1;
  min-width:220px;

  background:#151518;
  color:#fff;

  border:1px solid #333;

  padding:11px 13px;
  border-radius:11px;

  outline:none;
}

.search:focus{
  border-color:#777;
}

/* =========================
   CATEGORY
========================= */

.tabs{
  display:flex;
  gap:8px;

  overflow-x:auto;

  padding-bottom:18px;

  scrollbar-width:thin;
}

.tab{
  white-space:nowrap;

  background:#19191d;
  color:#ddd;

  border:1px solid #38383e;

  padding:9px 13px;
  border-radius:999px;

  transition:.2s;
}

.tab:hover{
  border-color:#777;
}

.tab.active{
  background:#fff;
  color:#111;

  font-weight:800;
}

/* =========================
   SECTION
========================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:10px 0 18px;
}

.section-head h3{
  font-size:24px;
}

.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}

/* =========================
   PRODUCT GRID
========================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  gap:14px;
}

.card{
  background:var(--panel);

  border:1px solid #333;

  border-radius:16px;

  overflow:hidden;

  transition:
    transform .2s,
    border-color .2s,
    box-shadow .2s;
}

.card:hover{
  transform:translateY(-3px);
  border-color:#555;

  box-shadow:
    0 12px 35px rgba(0,0,0,.3);
}

/* =========================
   IMAGE
========================= */

.media{
  aspect-ratio:4/3;

  background:#111;

  display:grid;
  place-items:center;

  color:#777;

  overflow:hidden;

  position:relative;
}

.media img{
  width:100%;
  height:100%;

  object-fit:contain;

  background:#111;

  display:block;

  /* 加快圖片解碼 */
  image-rendering:auto;
}

.image-loading{
  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  color:#777;

  font-size:13px;

  background:#111;
}

.media.loaded .image-loading{
  display:none;
}

/* =========================
   PRODUCT BODY
========================= */

.body{
  padding:12px;
}

.badge{
  font-size:11px;
  color:#bbb;
}

.name{

.price{

.card-actions{

/* =========================

========================= */

.board input,

/* ==========================================
   圖片壓縮
========================================== */

/*

  原始圖片
       ↓
  Canvas
       ↓
  最大 1000px
       ↓
  WebP
       ↓
  約 100~300KB
       ↓
  Firebase Storage

*/

function compressImage(file){

  return new Promise(
    (resolve,reject)=>{

      if(!file.type.startsWith("image/")){

        reject(
          new Error("不是圖片檔案")
        );

        return;
      }


      const reader =
        new FileReader();


      reader.onerror =
        () =>
          reject(
            new Error("圖片讀取失敗")
          );


      reader.onload = () => {

        const img =
          new Image();


        img.onerror =
          () =>
            reject(
              new Error("圖片解析失敗")
            );


        img.onload = () => {

          const MAX_SIZE = 1000;

          const maxSide =
            Math.max(
              img.width,
              img.height
            );


          const scale =
            Math.min(
              1,
              MAX_SIZE / maxSide
            );


          const width =
            Math.round(
              img.width * scale
            );


          const height =
            Math.round(
              img.height * scale
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const ctx =
            canvas.getContext(
              "2d",
              {
                alpha:false
              }
            );


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          /*

             優先使用 WebP

          */

          let mime =
            "image/webp";


          let quality =
            0.78;


          let dataUrl =
            canvas.toDataURL(
              mime,
              quality
            );


          /*
             如果瀏覽器不支援 WebP
          */

          if(
            !dataUrl.startsWith(
              "data:image/webp"
            )
          ){

            mime =
              "image/jpeg";

            dataUrl =
              canvas.toDataURL(
                mime,
                0.78
              );

          }


          resolve({
            dataUrl,
            mime,
            width,
            height
          });

        };


        img.src =
          reader.result;

      };


      reader.readAsDataURL(file);

    }
  );

}


/* ==========================================
   DataURL → Blob
========================================== */

function dataURLToBlob(dataURL){

  const parts =
    dataURL.split(",");

  const mime =
    parts[0]
      .match(/:(.*?);/)[1];

  const binary =
    atob(parts[1]);

  const len =
    binary.length;

  const array =
    new Uint8Array(len);


  for(
    let i = 0;
    i < len;
    i++
  ){

    array[i] =
      binary.charCodeAt(i);

  }


  return new Blob(
    [array],
    {
      type:mime
    }
  );

}


/* ==========================================
   上傳圖片到 Firebase Storage
========================================== */

async function uploadProductImage(
  file,
  productId
){

  const compressed =
    await compressImage(file);


  const blob =
    dataURLToBlob(
      compressed.dataUrl
    );


  /*
     Storage 路徑

     products/
       商品ID/
         image.webp
  */

  const extension =
    compressed.mime ===
      "image/webp"
      ? "webp"
      : "jpg";


  const storagePath =
    `products/${productId}/image.${extension}`;


  const imageRef =
    ref(
      storage,
      storagePath
    );


  await uploadBytes(
    imageRef,
    blob,
    {
      contentType:
        compressed.mime,

      cacheControl:
        "public,max-age=31536000,immutable"
    }
  );


  const downloadURL =
    await getDownloadURL(
      imageRef
    );


  return {
    url:downloadURL,
    path:storagePath
  };

}


/* ==========================================
   刪除 Storage 圖片
========================================== */

async function deleteStorageImage(
  imagePath
){

  if(!imagePath){
    return;
  }


  try{

    const imageRef =
      ref(
        storage,
        imagePath
      );

    await deleteObject(
      imageRef
    );

  }catch(error){

    /*
      如果圖片本來不存在，
      不影響商品刪除
    */

    console.warn(
      "Storage 圖片刪除失敗:",
      error
    );

  }

}


/* ==========================================
   PRODUCT RENDER
========================================== */

function renderProducts(){

  const keyword =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(
      p =>
        p.category === currentCategory &&
        (
          !keyword ||
          (p.name || "")
            .toLowerCase()
            .includes(keyword)
        )
    );


  $("#sectionTitle")
    .textContent =
      currentCategory;


  $("#productCount")
    .textContent =
      `${list.length} 件商品`;


  const grid =
    $("#productGrid");


  grid.innerHTML = "";


  if(!list.length){

    grid.innerHTML =
      `
      <div class="empty">
        這個分類目前沒有商品
      </div>
      `;

    return;
  }


  list.forEach(
    product => {

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      /* =========================
         IMAGE
      ========================= */

      const media =
        document.createElement(
          "div"
        );

      media.className =
        "media";


      if(product.image){

        const loading =
          document.createElement(
            "div"
          );

        loading.className =
          "image-loading";

        loading.textContent =
          "圖片載入中…";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          product.image;


        img.alt =
          product.name ||
          "商品圖片";


        /*
           延遲載入
        */

        img.loading =
          "lazy";


        /*
           非同步解碼
        */

        img.decoding =
          "async";


        img.addEventListener(
          "load",
          () => {

            media.classList.add(
              "loaded"
            );

          },
          {
            once:true
          }
        );


        img.addEventListener(
          "error",
          () => {

            loading.textContent =
              "圖片載入失敗";

          }
        );


        media.append(
          loading,
          img
        );

      }else{

        media.textContent =
          "無商品圖片";

      }


      /* =========================
         BODY
      ========================= */

      const body =
        document.createElement(
          "div"
        );

      body.className =
        "body";


      const badge =
        document.createElement(
          "div"
        );

      badge.className =
        "badge";

      badge.textContent =
        product.category || "";


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "name";

      name.textContent =
        product.name || "";


      const price =
        document.createElement(
          "div"
        );

      price.className =
        "price";

      price.textContent =
        product.price || "";


      body.append(
        badge,
        name,
        price
      );


      /* =========================
         ADMIN BUTTONS
      ========================= */

      if(isAdmin()){

        const actions =
          document.createElement(
            "div"
          );

        actions.className =
          "card-actions";


        const edit =
          document.createElement(
            "button"
          );

        edit.className =
          "btn small";

        edit.textContent =
          "編輯";


        edit.onclick =
          () =>
            openProductDialog(
              product
            );


        const del =
          document.createElement(
            "button"
          );

        del.className =
          "btn small danger";

        del.textContent =
          "刪除";


        del.onclick =
          async () => {

            if(
              !confirm(
                `確定刪除「${product.name}」嗎？`
              )
            ){

              return;

            }


            try{

              /*
                 先刪 Storage
              */

              await deleteStorageImage(
                product.imagePath
              );


              /*
                 再刪 Firestore
              */

              await deleteDoc(
                doc(
                  db,
                  "products",
                  product.id
                )
              );


              toast(
                "商品已刪除"
              );

            }catch(error){

              console.error(
                error
              );

              toast(
                "商品刪除失敗"
              );

            }

          };


        actions.append(
          edit,
          del
        );


        body.appendChild(
          actions
        );

      }


      card.append(
        media,
        body
      );


      grid.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   MESSAGE RENDER
========================================== */

function renderMessages(){

  const box =
    $("#messages");


  box.innerHTML = "";


  if(!messages.length){

    box.innerHTML =
      `
      <div class="message">
        目前還沒有留言
      </div>
      `;

    return;
  }


  messages.forEach(
    message => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "message";


      const top =
        document.createElement(
          "div"
        );

      top.className =
        "message-top";


      const left =
        document.createElement(
          "div"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "message-name";

      name.textContent =
        message.name ||
        "匿名";


      const time =
        document.createElement(
          "div"
        );

      time.className =
        "message-time";

      time.textContent =
        formatTime(
          message.createdAt
        );


      left.append(
        name,
        time
      );


      top.appendChild(
        left
      );


      if(isAdmin()){

        const del =
          document.createElement(
            "button"
          );

        del.className =
          "btn small danger";

        del.textContent =
          "刪除";


        del.onclick =
          async () => {

            if(
              !confirm(
                "確定刪除這則留言嗎？"
              )
            ){

              return;
            }


            try{

              await deleteDoc(
                doc(
                  db,
                  "messages",
                  message.id
                )
              );


              toast(
                "留言已刪除"
              );

            }catch(error){

              console.error(
                error
              );

              toast(
                "留言刪除失敗"
              );

            }

          };


        top.appendChild(
          del
        );

      }


      const text =
        document.createElement(
          "div"
        );

      text.className =
        "message-text";

      text.textContent =
        message.text || "";


      item.append(
        top,
        text
      );


      box.appendChild(
        item
      );

    }
  );

}


/* ==========================================
   開啟商品視窗
========================================== */

function openProductDialog(
  product = null
){

  $("#productForm").reset();


  $("#productId")
    .value =
      product?.id || "";


  $("#productDialogTitle")
    .textContent =
      product
        ? "編輯商品"
        : "新增商品";


  $("#productCategory")
    .value =
      product?.category ||
      currentCategory;


  $("#productName")
    .value =
      product?.name || "";


  $("#productPrice")
    .value =
      product?.price || "";


  editingImage =
    product?.image || "";


  const preview =
    $("#imagePreview");


  preview.innerHTML =
    "";


  if(editingImage){

    const img =
      document.createElement(
        "img"
      );

    img.src =
      editingImage;

    img.alt =
      "商品圖片預覽";

    img.loading =
      "eager";

    img.decoding =
      "async";

    preview.appendChild(
      img
    );

  }else{

    preview.textContent =
      "尚未選擇圖片";

  }


  $("#uploadStatus")
    .className =
      "upload-status";


  $("#uploadStatus")
    .textContent =
      "圖片會自動壓縮後上傳至 Firebase Storage";


  $("#saveProductBtn")
    .disabled =
      false;


  $("#productDialog")
    .showModal();

}


/* ==========================================
   選擇圖片預覽
========================================== */

$("#productImage")
  .addEventListener(
    "change",
    async event => {

      const file =
        event.target.files?.[0];


      if(!file){
        return;
      }


      try{

        $("#uploadStatus")
          .className =
            "upload-status";


        $("#uploadStatus")
          .textContent =
            "正在處理圖片…";


        const compressed =
          await compressImage(
            file
          );


        const preview =
          $("#imagePreview");


        preview.innerHTML =
          "";


        const img =
          document.createElement(
            "img"
          );


        img.src =
          compressed.dataUrl;


        img.alt =
          "圖片預覽";


        preview.appendChild(
          img
        );


        const kb =
          Math.round(
            compressed.dataUrl.length /
            1.37 /
            1024
          );


        $("#uploadStatus")
          .textContent =
            `圖片已壓縮，準備上傳（約 ${kb} KB）`;

      }catch(error){

        console.error(
          error
        );


        $("#uploadStatus")
          .className =
            "upload-status error";


        $("#uploadStatus")
          .textContent =
            "圖片處理失敗";

        toast(
          "圖片處理失敗"
        );

      }

    }
  );


/* ==========================================
   新增 / 編輯商品
========================================== */

$("#productForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      if(!isAdmin()){

        toast(
          "只有管理員可以管理商品"
        );

        return;
      }


      const saveButton =
        $("#saveProductBtn");


      saveButton.disabled =
        true;


      const id =
        $("#productId").value;


      const file =
        $("#productImage")
          .files?.[0];


      try{

        $("#uploadStatus")
          .className =
            "upload-status";


        /*
           ==========================
           新增商品
           ==========================
        */

        if(!id){

          /*
             先建立 Firestore 文件
             取得商品 ID
          */

          const productRef =
            await addDoc(
              collection(
                db,
                "products"
              ),
              {

                category:
                  $("#productCategory")
                    .value,

                name:
                  $("#productName")
                    .value
                    .trim(),

                price:
                  $("#productPrice")
                    .value
                    .trim(),

                image:"",
                imagePath:"",

                createdAt:
                  serverTimestamp(),

                updatedAt:
                  serverTimestamp()

              }
            );


          /*
             如果有圖片
             上傳 Storage
          */

          if(file){

            $("#uploadStatus")
              .textContent =
                "正在壓縮圖片…";


            const result =
              await uploadProductImage(
                file,
                productRef.id
              );


            $("#uploadStatus")
              .textContent =
                "圖片上傳中…";


            /*
               把 Storage URL
               存進 Firestore
            */

            await updateDoc(
              productRef,
              {

                image:
                  result.url,

                imagePath:
                  result.path,

                updatedAt:
                  serverTimestamp()

              }
            );

          }


          toast(
            "商品已新增"
          );

        }


        /*
           ==========================
           編輯商品
           ==========================
        */

        else{

          const productRef =
            doc(
              db,
              "products",
              id
            );


          const oldSnap =
            await getDoc(
              productRef
            );


          const oldData =
            oldSnap.exists()
              ? oldSnap.data()
              : {};


          let image =
            oldData.image ||
            editingImage ||
            "";


          let imagePath =
            oldData.imagePath ||
            "";


          /*
             如果重新選擇圖片
          */

          if(file){

            $("#uploadStatus")
              .textContent =
                "正在壓縮並上傳新圖片…";


            const result =
              await uploadProductImage(
                file,
                id
              );


            image =
              result.url;


            imagePath =
              result.path;


            /*
               嘗試刪除舊圖片

               因為新舊圖片可能使用
               不同 extension
            */

            if(
              oldData.imagePath &&
              oldData.imagePath !== imagePath
            ){

              await deleteStorageImage(
                oldData.imagePath
              );

            }

          }


          await updateDoc(
            productRef,
            {

              category:
                $("#productCategory")
                  .value,

              name:
                $("#productName")
                  .value
                  .trim(),

              price:
                $("#productPrice")
                  .value
                  .trim(),

              image,

              imagePath,

              updatedAt:
                serverTimestamp()

            }
          );


          toast(
            "商品已更新"
          );

        }


        $("#productDialog")
          .close();


        $("#productForm")
          .reset();


      }catch(error){

        console.error(
          "商品儲存錯誤:",
          error
        );


        $("#uploadStatus")
          .className =
            "upload-status error";


        /*
           常見 Firebase 錯誤
        */

        if(
          error.code ===
          "storage/unauthorized"
        ){

          $("#uploadStatus")
            .textContent =
              "Storage Rules 不允許目前帳號上傳圖片";

        }

        else if(
          error.code ===
          "storage/quota-exceeded"
        ){

          $("#uploadStatus")
            .textContent =
              "Firebase Storage 容量不足";

        }

        else{

          $("#uploadStatus")
            .textContent =
              "商品儲存失敗，請查看 Console";

        }


        toast(
          "商品儲存失敗"
        );

      }finally{

        saveButton.disabled =
          false;

      }

    }
  );


/* ==========================================
   LOGIN
========================================== */

$("#loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      try{

        const credential =
          await signInWithEmailAndPassword(
            auth,
            $("#loginEmail")
              .value
              .trim(),
            $("#loginPassword")
              .value
          );


        if(
          credential.user.uid !==
          ADMIN_UID
        ){

          await signOut(
            auth
          );


          toast(
            "這個帳號不是管理員"
          );


          return;
        }


        $("#loginDialog")
          .close();


        $("#loginForm")
          .reset();


        toast(
          "管理員登入成功"
        );

      }catch(error){

        console.error(
          error
        );


        toast(
          "登入失敗，請檢查帳號密碼"
        );

      }

    }
  );


/* ==========================================
   ADMIN BUTTON
========================================== */

$("#adminBtn")
  .onclick =
    async () => {

      if(isAdmin()){

        await signOut(
          auth
        );


        toast(
          "已登出管理員"
        );

      }else{

        $("#loginDialog")
          .showModal();

      }

    };


/* ==========================================
   ADD BUTTON
========================================== */

$("#addBtn")
  .onclick =
    () =>
      openProductDialog();


/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
  auth,
  user => {

    currentUser =
      user;


    $("#adminBtn")
      .textContent =
        isAdmin()
          ? "登出管理員"
          : "管理員登入";


    $("#addBtn")
      .classList
      .toggle(
        "hidden",
        !isAdmin()
      );


    renderProducts();

    renderMessages();

  }
);


/* ==========================================
   CATEGORY
========================================== */

$("#tabs")
  .addEventListener(
    "click",
    event => {

      const button =
        event.target.closest(
          ".tab"
        );


      if(!button){
        return;
      }


      $$(".tab")
        .forEach(
          item =>
            item.classList
              .remove(
                "active"
              )
        );


      button.classList.add(
        "active"
      );


      currentCategory =
        button.dataset.category;


      renderProducts();

    }
  );


/* ==========================================
   SEARCH
========================================== */

$("#searchInput")
  .addEventListener(
    "input",
    renderProducts
  );


/* ==========================================
   MESSAGE
========================================== */

$("#messageForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const name =
        $("#messageName")
          .value
          .trim();


      const text =
        $("#messageText")
          .value
          .trim();


      if(
        !name ||
        !text
      ){

        return;
      }


      try{

        await addDoc(
          collection(
            db,
            "messages"
          ),
          {

            name,

            text,

            createdAt:
              serverTimestamp()

          }
        );


        $("#messageText")
          .value =
            "";


        toast(
          "留言已送出"
        );

      }catch(error){

        console.error(
          error
        );


        toast(
          "留言送出失敗"
        );

      }

    }
  );


/* ==========================================
   CLOSE DIALOG
========================================== */

$$("[data-close]")
  .forEach(
    button => {

      button.onclick =
        () => {

          const id =
            button.dataset.close;


          document
            .getElementById(id)
            ?.close();

        };

    }
  );


/* ==========================================
   FIRESTORE PRODUCTS
========================================== */

onSnapshot(
  query(
    collection(
      db,
      "products"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snapshot => {

    products =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    renderProducts();

  },

  error => {

    console.error(
      "商品讀取錯誤:",
      error
    );


    $("#productGrid")
      .innerHTML =
        `
        <div class="empty">
          商品讀取失敗
        </div>
        `;

  }
);


/* ==========================================
   FIRESTORE MESSAGES
========================================== */

onSnapshot(
  query(
    collection(
      db,
      "messages"
    ),
    orderBy(
      "createdAt",
      "desc"
    )
  ),

  snapshot => {

    messages =
      snapshot.docs.map(
        item => ({
          id:item.id,
          ...item.data()
        })
      );


    renderMessages();

  },

  error => {

    console.error(
      "留言讀取錯誤:",
      error
    );


    $("#messages")
      .innerHTML =
        `
        <div class="message">
          留言讀取失敗
        </div>
        `;

  }
);

</script>
