<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>
<style>
body{margin:0;background:#0d0d0f;color:#f5f5f5;font-family:Arial,"Microsoft JhengHei",sans-serif}
*{box-sizing:border-box}button,input,textarea{font:inherit}button{cursor:pointer}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 5vw;background:#0a0a0b;border-bottom:1px solid #333}
.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border:1px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:900}
h1,h2,h3,p{margin:0}.brand h1{font-size:20px}.brand small{color:#aaa}
.btn{border:1px solid #3a3a40;background:#1b1b1f;color:#fff;padding:10px 14px;border-radius:11px}.primary{background:#fff;color:#111;font-weight:800}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}.hero{padding:55px 0 30px}.hero small{letter-spacing:.2em;color:#bbb}.hero h2{font-size:clamp(36px,6vw,64px);margin:12px 0}.hero p{color:#aaa}
.hero-split{display:grid;grid-template-columns:1fr minmax(280px,460px);gap:34px;align-items:center}
.hero-art{display:flex;justify-content:center}
.hero-art img{width:100%;max-width:430px;aspect-ratio:1/1;object-fit:cover;border-radius:22px;border:1px solid #34343b;box-shadow:0 18px 55px rgba(111,72,255,.22)}
@media(max-width:760px){.hero-split{grid-template-columns:1fr}.hero-art img{max-width:360px}}
.toolbar{display:flex;gap:10px;margin:15px 0}.search{flex:1;background:#151518;color:#fff;border:1px solid #333;padding:11px 13px;border-radius:11px}
.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:18px}.tab{white-space:nowrap;background:#19191d;color:#ddd;border:1px solid #38383e;padding:9px 13px;border-radius:999px}.tab.active{background:#fff;color:#111;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#161619;border:1px solid #333;border-radius:16px;overflow:hidden}.media{aspect-ratio:4/3;background:#222;display:grid;place-items:center;color:#888}.body{padding:12px}.badge{font-size:11px;color:#bbb}.name{font-size:17px;font-weight:800;margin-top:7px}.price{font-size:18px;font-weight:900;margin-top:7px}
.board{margin:55px 0;border-top:1px solid #333;padding-top:28px}.board h3{font-size:26px}.board>p{color:#aaa;margin-top:6px}.board-form{display:grid;grid-template-columns:180px 1fr auto;gap:10px;margin:18px 0}.board input,.board textarea{background:#151518;color:#fff;border:1px solid #333;border-radius:11px;padding:11px}.board textarea{min-height:44px}.message{background:#151518;border:1px solid #333;border-radius:13px;padding:14px}.note{color:#888;font-size:12px;margin-top:10px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.board-form{grid-template-columns:1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">O²</div><div><h1>O² M★STAR交易區</h1><small>販售・收購・交流</small></div></div>
  <button class="btn">管理員登入</button>
</header>
<main class="wrap">
  <section class="hero">
    <div class="hero-banner"><img src="ostar-logo.PNG" alt="O² M★STAR交易區"></div>
    
    <h2>O² M★STAR交易區</h2>
    
  </section>
  <section class="toolbar"><input class="search" placeholder="搜尋商品名稱…"><button class="btn primary">＋ 新增商品</button></section>
  <nav class="tabs">
    <button class="tab active">新家具</button><button class="tab">家具</button><button class="tab">花盆</button>
    <button class="tab">戒指限男</button><button class="tab">戒指限女</button><button class="tab">作物限男</button>
    <button class="tab">作物限女</button><button class="tab">收購區</button>
  </nav>
  <h3 style="margin:10px 0 18px">新家具</h3>
  <section class="grid"><article class="card"><div class="media">商品圖片</div><div class="body"><div class="badge">新家具</div><div class="name">商品範例</div><div class="price">價格</div></div></article></section>
  <section class="board">
    <h3>留言板</h3><p>想詢問商品或留言可以寫在這裡。</p>
    <div class="board-form"><input placeholder="暱稱"><textarea placeholder="留言內容"></textarea><button class="btn primary">送出留言</button></div>
    <div class="message"><strong>留言範例</strong><br>這裡之後會顯示大家的留言。</div>
    <div class="note">目前先做外觀；商品管理與留言板同步之後接 Firebase。</div>
  </section>
</main>
</body>
</html><style>
.hero{padding:36px 0 30px!important}
.hero-banner{display:flex;justify-content:center;margin-bottom:38px}
.hero-banner img{width:min(650px,100%);height:auto;object-fit:contain;border-radius:22px;border:1px solid #34343b;box-shadow:0 20px 60px rgba(103,69,255,.18)}
</style>
