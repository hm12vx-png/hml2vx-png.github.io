<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O² M★STAR交易區</title>

<style>
:root{
  --bg:#0d0d0f;
  --panel:#161619;
  --line:#35353b;
  --text:#f5f5f5;
  --muted:#aaa;
  --danger:#ff7582;
  --success:#8cffb0;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Microsoft JhengHei",sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}


/* =========================================================
   頂部
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:20;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:16px 5vw;

  background:#0a0a0bf2;
  border-bottom:1px solid #333;

  backdrop-filter:blur(10px);
}

.brand{
  display:flex;
  gap:12px;
  align-items:center;
}

.logo{
  width:44px;
  height:44px;

  border:1px solid #fff;
  border-radius:50%;

  display:grid;
  place-items:center;

  font-weight:900;
}

.brand h1{
  margin:0;
  font-size:20px;
}

.brand small{
  color:#aaa;
}


/* =========================================================
   按鈕
========================================================= */

.btn{
  border:1px solid #3a3a40;
  background:#1b1b1f;
  color:#fff;

  padding:10px 14px;

  border-radius:11px;

  transition:
    background .15s,
    transform .15s;
}

.btn:hover{
  background:#27272c;
}

.btn:active{
  transform:scale(.98);
}

.btn.primary{
  background:#fff;
  color:#111;
  font-weight:800;
}

.btn.primary:hover{
  background:#e8e8e8;
}

.btn.danger{
  color:#ff9aa4;
  border-color:#6d3439;
}

.btn.danger:hover{
  background:#2a1719;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}


/* =========================================================
   主體
========================================================= */

.wrap{
  width:min(1500px,calc(100% - 32px));
  margin:auto;
}


/* =========================================================
   Banner
========================================================= */

.hero{
  padding:36px 0 30px;
}

.hero-banner{
  display:flex;
  justify-content:center;
}

.hero-banner img{
  width:min(650px,100%);
  height:auto;

  object-fit:contain;

  border-radius:22px;
  border:1px solid #34343b;

  box-shadow:
    0 20px 60px rgba(103,69,255,.18);
}


/* =========================================================
   搜尋工具列
========================================================= */

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;

  margin:15px 0;
}

.search{
  flex:1;
  min-width:220px;

  background:#151518;
  color:#fff;

  border:1px solid #333;

  padding:11px 13px;

  border-radius:11px;

  outline:none;
}

.search:focus{
  border-color:#666;
}


/* =========================================================
   分類
========================================================= */

.tabs{
  display:flex;
  gap:8px;

  overflow:auto;

  padding-bottom:18px;

  scrollbar-width:thin;
}

.tab{
  white-space:nowrap;

  background:#19191d;
  color:#ddd;

  border:1px solid #38383e;

  padding:9px 13px;

  border-radius:999px;
}

.tab:hover{
  background:#242429;
}

.tab.active{
  background:#fff;
  color:#111;
  font-weight:800;
}


/* =========================================================
   商品標題
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;

  margin:10px 0 18px;
}

.section-head h3{
  margin:0;
  font-size:24px;
}

.count{
  color:#888;
  font-size:13px;
  margin-top:5px;
}


/* =========================================================
   商品網格
   桌機固定 6 個一排
========================================================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(8,minmax(0,1fr));

  gap:14px;
}


/* =========================================================
   商品卡片
========================================================= */

.card{
  background:#161619;

  border:1px solid #333;

  border-radius:16px;

  overflow:hidden;

  min-width:0;

  display:flex;
  flex-direction:column;

  height:100%;
}


/* =========================================================
   商品圖片區
   所有圖片固定高度
========================================================= */

.media{
  background:#222;

  display:flex;
  justify-content:center;
  align-items:center;

  color:#888;

  overflow:hidden;

  padding:14px;

  width:100%;

  height:210px;
  min-height:210px;
}

.media img{
  display:block;

  width:100%;
  max-width:240px;

  height:180px;

  object-fit:contain;

  background:#111;
}


/* =========================================================
   商品內容
========================================================= */

.body{
  padding:12px;

  display:flex;
  flex-direction:column;

  flex:1;

  min-width:0;
}


/* =========================================================
   商品分類
========================================================= */

.badge{
  font-size:11px;
  color:#bbb;

  height:18px;
  min-height:18px;

  line-height:18px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   商品名稱
   固定兩行高度
========================================================= */

.name{
  font-size:13px;
  font-weight:800;

  margin-top:5px;

  line-height:18px;

  height:18px;
  min-height:18px;

  overflow:hidden;

  white-space:nowrap;
  text-overflow:ellipsis;

  word-break:normal;
}


/* =========================================================
   商品價格
========================================================= */

.price{
  font-size:18px;
  font-weight:900;

  margin-top:7px;

  height:27px;
  min-height:27px;

  line-height:27px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


/* =========================================================
   庫存
========================================================= */

.stock{
  margin-top:7px;

  color:var(--success);

  font-size:13px;

  height:22px;
  min-height:22px;

  line-height:22px;
}

.stock.soldout{
  color:var(--danger);

  font-weight:900;

  font-size:15px;

  height:22px;
  min-height:22px;

  line-height:22px;
}


/* =========================================================
   管理員商品按鈕
========================================================= */

.card-actions{
  display:flex;

  gap:8px;

  margin-top:12px;

  height:34px;
  min-height:34px;
}

.card-actions .btn{
  flex:1;
}


/* =========================================================
   空白
========================================================= */

.empty{
  grid-column:1/-1;

  color:#777;

  padding:40px 0;

  text-align:center;
}


/* =========================================================
   留言板
========================================================= */

.board{
  margin:55px 0;

  border-top:1px solid #333;

  padding-top:28px;
}

.board-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
}

.board h3{
  margin:0;

  font-size:26px;
}

.discord-admin-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:9px 15px;
  border:1px solid #5865F2;
  border-radius:10px;
  color:#fff;
  background:#5865F2;
  text-decoration:none;
  font-weight:800;
  font-size:13px;
  transition:.2s ease;
  white-space:nowrap;
}

.discord-admin-link:hover{
  transform:translateY(-1px);
  filter:brightness(1.08);
}

@media(max-width:700px){
  .board-title{
    align-items:flex-start;
    flex-direction:column;
  }

  .discord-admin-link{
    width:100%;
  }
}

.board>p{
  color:#aaa;

  margin-top:6px;
}


/* =========================================================
   留言表單
========================================================= */

.board-form{
  display:grid;

  grid-template-columns:
    180px
    minmax(0,1fr)
    auto;

  gap:10px;

  margin:18px 0;
}

.board input,
.board textarea{
  background:#151518;

  color:#fff;

  border:1px solid #333;

  border-radius:11px;

  padding:11px;

  outline:none;
}

.board input:focus,
.board textarea:focus{
  border-color:#666;
}

.board textarea{
  min-height:44px;

  resize:vertical;
}


/* =========================================================
   留言列表
========================================================= */

.messages{
  display:grid;
  gap:12px;
}

.message{
  background:#151518;

  border:1px solid #333;

  border-radius:13px;

  padding:14px;
}


/* =========================================================
   留言上方
========================================================= */

.message-top{
  display:flex;

  justify-content:space-between;

  gap:12px;
}

.message-name{
  font-weight:800;

  font-size:16px;
}


/* 管理員看到的 Discord ID */

.message-discord-id{
  color:#777;

  font-size:11px;

  margin-top:4px;

  word-break:break-all;
}

.message-time{
  color:#777;

  font-size:11px;

  margin-top:4px;
}


/* =========================================================
   留言內容
========================================================= */

.message-text{
  margin-top:10px;

  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.6;
}


/* =========================================================
   管理員回覆
========================================================= */

.reply-box{
  margin-top:12px;

  margin-left:20px;

  padding:12px;

  background:#1b1b20;

  border-left:3px solid #fff;

  border-radius:8px;
}

.reply-label{
  font-size:12px;

  color:#aaa;

  margin-bottom:5px;
}

.reply-text{
  white-space:pre-wrap;

  word-break:break-word;

  line-height:1.5;
}

.reply-time{
  color:#666;

  font-size:11px;

  margin-top:5px;
}


/* =========================================================
   管理員回覆輸入
========================================================= */

.admin-reply-form{
  display:flex;

  gap:8px;

  margin-top:12px;
}

.admin-reply-form input{
  flex:1;

  background:#101014;

  color:#fff;

  border:1px solid #3b3b42;

  border-radius:9px;

  padding:9px 10px;

  outline:none;
}


/* =========================================================
   說明文字
========================================================= */

.note{
  color:#777;

  font-size:12px;

  margin-top:10px;

  line-height:1.6;
}


/* =========================================================
   Dialog
========================================================= */

dialog{
  width:min(520px,calc(100% - 28px));

  border:1px solid #3d3d44;

  border-radius:16px;

  background:#17171b;

  color:#fff;

  padding:0;

  box-shadow:
    0 24px 80px #0009;
}

dialog::backdrop{
  background:#000b;
}

.dialog-wrap{
  padding:20px;
}

.dialog-head{
  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:16px;
}

.dialog-head h3{
  margin:0;

  font-size:21px;
}

.icon-btn{
  background:transparent;

  border:0;

  color:#aaa;

  font-size:24px;

  line-height:1;
}


/* =========================================================
   商品表單
========================================================= */

.form{
  display:grid;

  gap:12px;
}

.form label{
  display:grid;

  gap:6px;

  color:#cfcfd4;

  font-size:13px;
}

.form input,
.form select{
  width:100%;

  background:#101014;

  color:#fff;

  border:1px solid #3b3b42;

  border-radius:10px;

  padding:11px 12px;

  outline:none;
}

.form input:focus,
.form select:focus{
  border-color:#666;
}


/* =========================================================
   Dialog 按鈕
========================================================= */

.dialog-actions{
  display:flex;

  justify-content:flex-end;

  gap:10px;

  margin-top:16px;
}


/* =========================================================
   圖片預覽
========================================================= */

.preview{
  width:100%;

  aspect-ratio:4/3;

  border:1px dashed #444;

  border-radius:12px;

  display:grid;

  place-items:center;

  color:#777;

  overflow:hidden;

  background:#111;
}

.preview img{
  width:100%;

  height:100%;

  object-fit:contain;
}


/* =========================================================
   Toast
========================================================= */

.toast{
  position:fixed;

  right:18px;
  bottom:18px;

  z-index:100;

  background:#fff;

  color:#111;

  padding:11px 14px;

  border-radius:10px;

  box-shadow:
    0 12px 40px #0008;

  font-weight:700;
}


/* =========================================================
   RWD
========================================================= */

/* 1200 以下 */
@media(max-width:1200px){

  .grid{
    grid-template-columns:
      repeat(5,1fr);
  }

}


/* 1000 以下 */
@media(max-width:1000px){

  .grid{
    grid-template-columns:
      repeat(4,1fr);
  }

  .board-form{
    grid-template-columns:
      1fr 1fr;
  }

}


/* 800 以下 */
@media(max-width:800px){

  .grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .board-form{
    grid-template-columns:
      1fr;
  }

}


/* 600 以下 */
@media(max-width:600px){

  .grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .brand small{
    display:none;
  }

  .topbar{
    padding:12px 14px;
  }

  .admin-reply-form{
    flex-direction:column;
  }

  .media{
    height:190px;
    min-height:190px;
  }

  .media img{
    height:160px;
  }

}


/* 400 以下 */
@media(max-width:400px){

  .grid{
    grid-template-columns:
      1fr;
  }

}
</style>
</head>


<body>


<!-- ========================================================
     頂部
========================================================= -->

<header class="topbar">

  <div class="brand">

    <div class="logo">
      O²
    </div>

    <div>

      <h1>
        O² M★STAR交易區
      </h1>

      <small>
        販售・收購・交流
      </small>

    </div>

  </div>


  <button
    id="adminBtn"
    class="btn"
  >
    管理員登入
  </button>

</header>


<main class="wrap">


<!-- ========================================================
     Banner
========================================================= -->

<section class="hero">

  <div class="hero-banner">

    <img
      src="ostar-logo.PNG"
      alt="O² M★STAR交易區"
    >

  </div>

</section>


<!-- ========================================================
     搜尋
========================================================= -->

<section class="toolbar">

  <input
    id="searchInput"
    class="search"
    placeholder="搜尋商品名稱…"
  >

  <button
    id="addBtn"
    class="btn primary hidden"
  >
    ＋ 新增商品
  </button>

</section>


<!-- ========================================================
     分類
========================================================= -->

<nav
  id="tabs"
  class="tabs"
>

  <button
    class="tab active"
    data-category="新家具"
  >
    新家具
  </button>


  <button
    class="tab"
    data-category="家具"
  >
    家具
  </button>


  <button
    class="tab"
    data-category="花盆"
  >
    花盆
  </button>


  <button
    class="tab"
    data-category="戒指限男"
  >
    戒指限男
  </button>


  <button
    class="tab"
    data-category="戒指限女"
  >
    戒指限女
  </button>


  <button
    class="tab"
    data-category="作物限男"
  >
    作物限男
  </button>


  <button
    class="tab"
    data-category="作物限女"
  >
    作物限女
  </button>


  <button
    class="tab"
    data-category="出清區"
  >
    出清區
  </button>

</nav>


<!-- ========================================================
     商品標題
========================================================= -->

<section class="section-head">

  <div>

    <h3 id="sectionTitle">
      新家具
    </h3>

    <div
      id="productCount"
      class="count"
    >
      0 件商品
    </div>

  </div>

</section>


<!-- ========================================================
     商品
========================================================= -->

<section
  id="productGrid"
  class="grid"
>

  <div class="empty">
    讀取商品中…
  </div>

</section>


<!-- ========================================================
     留言板
========================================================= -->

<section class="board">

  <div class="board-title">

    <h3>
      留言板
    </h3>

    <a
      class="discord-admin-link"
      href="https://discord.com/users/621734178228273155"
      target="_blank"
      rel="noopener noreferrer"
    >
      聯絡管理員 Discord
    </a>

  </div>

  <p>
    想詢問商品可以在這裡留言，管理員看到後會直接在留言下方回覆。
  </p>


  <form
    id="messageForm"
    class="board-form"
  >

    <!-- 暱稱 -->

    <input
      id="messageName"
      maxlength="30"
      placeholder="暱稱"
      required
    >


    <!-- 留言 -->

    <textarea
      id="messageText"
      maxlength="300"
      placeholder="留言內容"
      required
    ></textarea>


    <button
      class="btn primary"
      type="submit"
    >
      送出留言
    </button>

  </form>


  <div
    id="messages"
    class="messages"
  ></div>


  <div class="note">

    請填寫你希望顯示在留言區的暱稱。

  </div>

</section>

</main>


<!-- ========================================================
     管理員登入
========================================================= -->

<dialog id="loginDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3>
        管理員登入
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="loginDialog"
      >
        ×
      </button>

    </div>


    <form
      id="loginForm"
      class="form"
    >

      <label>

        Email

        <input
          id="loginEmail"
          type="email"
          autocomplete="username"
          required
        >

      </label>


      <label>

        密碼

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          required
        >

      </label>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="loginDialog"
        >
          取消
        </button>


        <button
          class="btn primary"
          type="submit"
        >
          登入
        </button>

      </div>

    </form>

  </div>

</dialog>


<!-- ========================================================
     新增 / 編輯商品
========================================================= -->

<dialog id="productDialog">

  <div class="dialog-wrap">

    <div class="dialog-head">

      <h3 id="productDialogTitle">
        新增商品
      </h3>

      <button
        class="icon-btn"
        type="button"
        data-close="productDialog"
      >
        ×
      </button>

    </div>


    <form
      id="productForm"
      class="form"
    >

      <input
        id="productId"
        type="hidden"
      >


      <!-- 分類 -->

      <label>

        分類

        <select
          id="productCategory"
          required
        >

          <option value="新家具">
            新家具
          </option>

          <option value="家具">
            家具
          </option>

          <option value="花盆">
            花盆
          </option>

          <option value="戒指限男">
            戒指限男
          </option>

          <option value="戒指限女">
            戒指限女
          </option>

          <option value="作物限男">
            作物限男
          </option>

          <option value="作物限女">
            作物限女
          </option>

          <option value="出清區">
            出清區
          </option>

        </select>

      </label>


      <!-- 商品名稱 -->

      <label>

        商品名稱

        <input
          id="productName"
          maxlength="80"
          required
          placeholder="輸入商品名稱"
        >

      </label>


      <!-- 價格 -->

      <label>

        價格

        <input
          id="productPrice"
          maxlength="40"
          required
          placeholder="例如：100T、80糖"
        >

      </label>


      <!-- 庫存 -->

      <label>

        庫存數量

        <input
          id="productStock"
          type="number"
          min="0"
          step="1"
          required
          value="1"
          placeholder="例如：10"
        >

      </label>


      <!-- 圖片 -->

      <label>

        商品圖片

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >

      </label>


      <!-- 圖片預覽 -->

      <div
        id="imagePreview"
        class="preview"
      >
        尚未選擇圖片
      </div>


      <div class="dialog-actions">

        <button
          class="btn"
          type="button"
          data-close="productDialog"
        >
          取消
        </button>


        <button
          class="btn primary"
          type="submit"
        >
          儲存商品
        </button>

      </div>

    </form>

  </div>

</dialog>


<!-- ========================================================
     Toast
========================================================= -->

<div
  id="toast"
  class="toast hidden"
></div>


<!-- ========================================================
     Firebase
========================================================= -->

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  addDoc,
  updateDoc,
  deleteDoc,
  doc,
  onSnapshot,
  query,
  orderBy,

/* =========================================================

========================================================= */

function toast(text){

  const el =
    $("#toast");

  el.textContent =
    text;

  el.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      () => {

        el.classList.add(
          "hidden"
        );

      },
      2200
    );

}

/* =========================================================
   時間
========================================================= */

function formatTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }

  return timestamp
    .toDate()
    .toLocaleString(
      "zh-TW",
      {
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   圖片壓縮
========================================================= */

function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onerror =
        reject;


      reader.onload = () => {

        const img =
          new Image();


        img.onerror =
          reject;


        img.onload = () => {

          const maxSize =
            900;


          const scale =
            Math.min(
              1,
              maxSize /
              Math.max(
                img.width,
                img.height
              )
            );


          const width =
            Math.round(
              img.width * scale
            );


          const height =
            Math.round(
              img.height * scale
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const context =
            canvas.getContext(
              "2d"
            );


          context.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          let quality =
            0.75;


          let output =
            canvas.toDataURL(
              "image/jpeg",
              quality
            );


          while(
            output.length > 650000 &&
            quality > 0.4
          ){

            quality -= 0.08;


            output =
              canvas.toDataURL(
                "image/jpeg",
                quality
              );

          }


          if(
            output.length > 780000
          ){

            reject(
              new Error(
                "圖片太大"
              )
            );

            return;

          }


          resolve(
            output
          );

        };


        img.src =
          reader.result;

      };


      reader.readAsDataURL(
        file
      );

    }
  );

}

function renderProducts(){

  const keyword =
    $("#searchInput")
      .value
      .trim()
      .toLowerCase();


  const list =
    products.filter(
      product => {

        const categoryMatch =
          product.category ===
          currentCategory;


        const nameMatch =
          !keyword ||
          (product.name || "")
            .toLowerCase()
            .includes(
              keyword
            );


        return (
          categoryMatch &&
          nameMatch
        );

      }
    );


  $("#sectionTitle")
    .textContent =
      currentCategory;


  $("#productCount")
    .textContent =
      `${list.length} 件商品`;


  const grid =
    $("#productGrid");


  grid.innerHTML =
    "";


  if(!list.length){

    grid.innerHTML =
      '<div class="empty">這個分類目前沒有商品</div>';

    return;

  }


  list.forEach(
    product => {

      /* =================================================
         商品卡片
      ================================================= */

      const card =
        document.createElement(
          "article"
        );


      card.className =
        "card";


      /* =================================================
         圖片
      ================================================= */

      const media =
        document.createElement(
          "div"
        );


      media.className =
        "media";


      if(product.image){

        const img =
          document.createElement(
            "img"
          );


        img.src =
          product.image;


        img.alt =
          product.name ||
          "商品圖片";


        img.loading =
          "lazy";


        media.appendChild(
          img
        );

      }
      else{

        media.textContent =
          "無商品圖片";

      }


      /* =================================================
         商品內容
      ================================================= */

      const body =
        document.createElement(
          "div"
        );


      body.className =
        "body";


      /* 分類 */

      const badge =
        document.createElement(
          "div"
        );


      badge.className =
        "badge";


      badge.textContent =
        product.category ||
        "";


      /* 商品名稱 */

      const name =
        document.createElement(
          "div"
        );


      name.className =
        "name";


      name.textContent =
        product.name ||
        "";


      name.title =
        product.name ||
        "";


      /* 價格 */

      const price =
        document.createElement(
          "div"
        );


      price.className =
        "price";


      price.textContent =
        product.price ||
        "";


      /* =================================================
         庫存
      ================================================= */

      const stock =
        document.createElement(
          "div"
        );


      stock.className =
        "stock";


      const stockNumber =
        Number(
          product.stock ?? 0
        );


      if(
        stockNumber <= 0
      ){

        stock.classList.add(
          "soldout"
        );


        stock.textContent =
          "售罄";

      }
      else{

        stock.textContent =
          `庫存：${stockNumber}`;

      }


      body.append(
        badge,
        name,
        price,
        stock
      );


      /* =================================================
         管理員按鈕
      ================================================= */

      if(
        isAdmin()
      ){

        const actions =
          document.createElement(
            "div"
          );


        actions.className =
          "card-actions";


        /* 編輯 */

        const edit =
          document.createElement(
            "button"
          );


        edit.className =
          "btn small";


        edit.textContent =
          "編輯";


        edit.onclick =
          () =>
            openProductDialog(
              product
            );


        /* 刪除 */

        const remove =
          document.createElement(
            "button"
          );


        remove.className =
          "btn small danger";


        remove.textContent =
          "刪除";


        remove.onclick =
          async () => {

            if(
              !confirm(
                `確定刪除「${product.name}」嗎？`
              )
            ){

              return;

            }


            try{

              await deleteDoc(
                doc(
                  db,
                  "products",
                  product.id
                )
              );


              toast(
                "商品已刪除"
              );

            }
            catch(error){

              console.error(
                error
              );


              toast(
                "商品刪除失敗"
              );

            }

          };


        actions.append(
          edit,
          remove

        body.appendChild(
          actions
        );

      }


      card.append(
        media,

      grid.appendChild(
        card

    }

/* =========================================================
   開啟商品新增 / 編輯視窗
========================================================= */

function openProductDialog(
  product = null
){

  $("#productForm")
    .reset();


  $("#productId")
    .value =
      product?.id ||
      "";


  $("#productDialogTitle")
    .textContent =
      product
        ? "編輯商品"
        : "新增商品";


  $("#productCategory")
    .value =
      product?.category ||
      currentCategory;


  $("#productName")
    .value =
      product?.name ||
      "";


  $("#productPrice")
    .value =
      product?.price ||
      "";


  $("#productStock")
    .value =
      product?.stock ??
      0;


  editingImage =
    product?.image ||
    "";


  const preview =
    $("#imagePreview");


  preview.innerHTML =
    "";


  if(
    editingImage
  ){

    const image =
      document.createElement(
        "img"
      );


    image.src =
      editingImage;


    preview.appendChild(
      image
    );

  }
  else{

    preview.textContent =
      "尚未選擇圖片";

  }


  $("#productDialog")
    .showModal();

}


/* =========================================================
   商品圖片預覽
========================================================= */

$("#productImage")
.addEventListener(
  "change",
  async event => {

    const file =
      event.target
        .files?.[0];


    if(!file){

      return;

    }


    try{

      const imageData =
        await compressImage(
          file
        );


      const preview =
        $("#imagePreview");


      preview.innerHTML =
        "";


      const image =
        document.createElement(
          "img"
        );


      image.src =
        imageData;


      preview.appendChild(
        image
      );

    }
    catch(error){

      console.error(
        error
      );


      toast(
        "圖片處理失敗"
      );

    }

  }
);


/* =========================================================
   儲存商品
========================================================= */

$("#productForm")
.addEventListener(
  "submit",
  async event => {

    event.preventDefault();


    if(
      !isAdmin()
    ){

      toast(
        "只有管理員可以管理商品"
      );

      return;

    }


    const id =
      $("#productId")
        .value;


    const file =
      $("#productImage")
        .files?.[0];


    try{

      let image =
        editingImage;


      if(file){

        image =
          await compressImage(
            file
          );

      }


      let stock =
        parseInt(
          $("#productStock")
            .value,
          10
        );


      if(
        Number.isNaN(stock) ||
        stock < 0
      ){

        stock = 0;

      }


      const payload = {

        category:
          $("#productCategory")
            .value,

        name:
          $("#productName")
            .value
            .trim(),

        price:
          $("#productPrice")
            .value
            .trim(),

        stock:
          stock,

        image:
          image,

        updatedAt:
          serverTimestamp()

      };


      /* 編輯 */

      if(id){

        await updateDoc(
          doc(
            db,
            "products",
            id
          ),
          payload
        );


        toast(
          "商品已更新"
        );

      }


      /* 新增 */

      else{

        payload.createdAt =
          serverTimestamp();


        await addDoc(
          collection(
            db,
            "products"
          ),
          payload
        );


        toast(
          "商品已新增"
        );

      }


      $("#productDialog")
        .close();

    }
    catch(error){

      console.error(
        error
      );


      toast(
        "商品儲存失敗"
      );

    }

  }
);

========================================================= */

.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        ".tab"
      );


    if(!button){

      return;

    }


    $$(".tab")
      .forEach(
        tab => {

          tab.classList
            .remove(
              "active"
            );

      .add(
        "active"
      );

      button.dataset.category;


    renderProducts();

  }
);

========================================================= */

onSnapshot(

    collection(
      db,
      "products"

    orderBy(
      "createdAt",
      "desc"
    )
